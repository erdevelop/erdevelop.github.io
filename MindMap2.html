<style>

<script>
const KEY = 'erdevelop-fikir', PAL = ['#5aa9ff', '#f0a04b', '#4cc38a', '#e5484d', '#a78bfa', '#2dd4bf', '#f472b6', '#facc15', '#94a3b8'];
let D = store.json(KEY, null); if (!D || !Array.isArray(D.nodes)) D = { nodes: [], links: [], ls: 'c' };
let nextId = Math.max(0, ...D.nodes.map(n => +n.id || 0)) + 1, sel = null, view = { x: 0, y: 0, s: 1 }, undo = [], redo = [], color = store.get('fikir:col', PAL[0]), shape = store.get('fikir:shape', 'r');
const save = () => store.put(KEY, D), snap = () => { undo.push(JSON.stringify(D)); if (undo.length > 80) undo.shift(); redo = []; };
const byId = id => D.nodes.find(n => n.id == id);
const cv = document.createElement('canvas').getContext('2d'); cv.font = '500 14px "IBM Plex Sans", "Segoe UI", sans-serif';
function dims(n) { const L = (n.text || ' ').split('\n'), w = Math.max(...L.map(l => cv.measureText(l || ' ').width)); let W = Math.min(300, w) + 32, H = L.length * 20 + 20; if (n.shape === 'e') { W *= 1.3; H *= 1.35; } if (n.shape === 'd') { W *= 1.5; H = Math.max(H * 1.6, 56); } if (n.shape === 'n') { W = Math.max(W, 140); H = Math.max(H, 80); } return [Math.max(W, 70), Math.max(H, 40)]; }

  if (n.shape === 'd') return `<path d="M${n.x} ${y}L${x + w} ${n.y}L${n.x} ${y + h}L${x} ${n.y}Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
  if (n.shape === 'n') return `<path d="M${x} ${y}H${x + w - 16}L${x + w} ${y + 16}V${y + h}H${x}Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M${x + w - 16} ${y}V${y + 16}H${x + w}" fill="none" stroke="${stroke}" stroke-width="${sw}"/>`;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${n.shape === 'p' ? h / 2 : 10}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`; }
const svg = $('svg'), stage = $('stage');
function render(ghost) {
  const panel = TM.css('--panel'), fg = TM.css('--fg'), muted = TM.css('--muted'); let L = '', N = '';
  (D.links || []).forEach(l => { const a = byId(l.parentId), b = byId(l.childId); if (!a || !b) return; const d = linkPath(a, b), on = sel === 'L' + l.id, col = on ? fg : (a.color || muted);
    L += `<g data-link="${l.id}"><path class="lkh" d="${d}"/><path class="lk" d="${d}" stroke="${col}" stroke-width="${on ? 3 : 2}" marker-end="url(#ar)" opacity="${on ? 1 : .8}"/></g>`; });
  if (ghost) L += `<path class="lk" d="M${ghost[0]} ${ghost[1]} L${ghost[2]} ${ghost[3]}" stroke="${TM.css('--accent')}" stroke-width="2" stroke-dasharray="6 4"/>`;

    const fill = note ? c : `color-mix(in srgb, ${c} 16%, ${panel})`, tc = note ? '#10151c' : fg;
    N += `<g class="nd${on ? ' sel' : ''}" data-id="${n.id}">${shapeSvg(n, w, h, fill, on ? fg : c, on ? 2.5 : 1.6)}`
      + lines.map((t, i) => `<text x="${n.x}" y="${n.y + (i - (lines.length - 1) / 2) * 20}" text-anchor="middle" fill="${tc}" style="font:500 14px 'IBM Plex Sans','Segoe UI',sans-serif">${esc(t)}</text>`).join('')
      + `<circle class="hd" data-h="${n.id}" cx="${n.x + w / 2}" cy="${n.y}" r="7" fill="${c}" stroke="${panel}" stroke-width="2"/><g class="hd" data-plus="${n.id}"><circle cx="${n.x}" cy="${n.y + h / 2 + 14}" r="9" fill="${panel}" stroke="${c}" stroke-width="1.5"/><text x="${n.x}" y="${n.y + h / 2 + 14}" text-anchor="middle" fill="${c}" style="font:700 14px sans-serif">+</text></g></g>`; });
  svg.innerHTML = `<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${muted}"/></marker></defs><g id="vp" transform="translate(${view.x} ${view.y}) scale(${view.s})">${L}${N}</g>`;
  $('hint').hidden = D.nodes.length > 0; $('bUndo').disabled = !undo.length; $('bRedo').disabled = !redo.length; $('bDel').disabled = !sel; $('lstyle').value = D.ls || 'c';
}
const toW = (cx, cy) => { const b = stage.getBoundingClientRect(); return [(cx - b.left - view.x) / view.s, (cy - b.top - view.y) / view.s]; };

/* düzenleme */
const ed = $('edit'); let editing = null;
function edit(id, isNew) { const n = byId(id); if (!n) return; editing = { id, isNew, old: n.text }; const [w, h] = dims(n), b = stage.getBoundingClientRect();
  Object.assign(ed.style, { display: 'block', left: (n.x - w / 2) * view.s + view.x + 'px', top: (n.y - h / 2) * view.s + view.y + 'px', width: Math.max(160, w * view.s) + 'px', height: Math.max(40, h * view.s) + 'px', fontSize: Math.max(12, 14 * view.s) + 'px' }); ed.value = n.text; ed.focus(); ed.select(); }
function endEdit(ok) { if (!editing) return; const e = editing, n = byId(e.id); editing = null; ed.style.display = 'none'; if (!n) return; const v = ed.value.replace(/\s+$/, '');
  if (ok && v) { if (v !== e.old) { if (!e.isNew) snap(); n.text = v; } } else if (e.isNew && !v) { D.nodes = D.nodes.filter(x => x !== n); D.links = D.links.filter(l => l.childId != n.id && l.parentId != n.id); undo.pop(); sel = null; } save(); render(); }
ed.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); endEdit(true); } else if (e.key === 'Escape') endEdit(false); else if (e.key === 'Tab') { e.preventDefault(); const id = editing && editing.id; endEdit(true); const n = byId(id); if (n) addNode(n.x + dims(n)[0] + 80, n.y, '', n.id); } });
ed.addEventListener('blur', () => endEdit(true));
/* işaretçi */
const pts = new Map(); let act = null;
stage.addEventListener('pointerdown', e => {
  if (e.target === ed) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 2) { const [a, b] = [...pts.values()]; act = { pinch: Math.hypot(a[0] - b[0], a[1] - b[1]), s: view.s, vx: view.x, vy: view.y, cx: (a[0] + b[0]) / 2, cy: (a[1] + b[1]) / 2 }; return; }
  const plus = e.target.closest('[data-plus]'); if (plus) { const n = byId(plus.dataset.plus), [, h] = dims(n); addNode(n.x, n.y + h + 70, '', n.id); act = null; return; }
  const hd = e.target.closest('[data-h]'); if (hd) { act = { link: hd.dataset.h }; return; }
  const lk = e.target.closest('[data-link]'); if (lk) { sel = 'L' + lk.dataset.link; render(); act = null; return; }
  const g = e.target.closest('.nd'); if (g) { if (editing) endEdit(true); sel = g.dataset.id; const n = byId(sel), [wx, wy] = toW(e.clientX, e.clientY); act = { node: n, dx: wx - n.x, dy: wy - n.y, moved: false, before: JSON.stringify(D) }; render(); return; }
  sel = null; render(); act = { pan: 1, x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
});
stage.addEventListener('pointermove', e => { if (!pts.has(e.pointerId) || !act) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (act.pinch) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), ns = Math.min(3, Math.max(.2, act.s * d / act.pinch)), bb = stage.getBoundingClientRect(), cx = act.cx - bb.left, cy = act.cy - bb.top; view.x = cx - (cx - act.vx) * ns / act.s; view.y = cy - (cy - act.vy) * ns / act.s; view.s = ns; render(); return; }
  if (act.pan) { view.x = act.vx + e.clientX - act.x; view.y = act.vy + e.clientY - act.y; $('vp').setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.s})`); return; }
  const [wx, wy] = toW(e.clientX, e.clientY);
  if (act.node) { act.moved = true; act.node.x = Math.round((wx - act.dx) / 12) * 12; act.node.y = Math.round((wy - act.dy) / 12) * 12; render(); return; }
  if (act.link) { const n = byId(act.link); render([n.x + dims(n)[0] / 2, n.y, wx, wy]); act.wx = wx; act.wy = wy; }
});
const up = e => { pts.delete(e.pointerId); if (!act) return;
  if (act.node && act.moved) { undo.push(act.before); redo = []; save(); }
  if (act.link && act.wx != null) { const t = D.nodes.find(n => { const [w, h] = dims(n); return Math.abs(act.wx - n.x) <= w / 2 && Math.abs(act.wy - n.y) <= h / 2; });
    if (t && t.id != act.link) { if (!D.links.some(l => l.parentId == act.link && l.childId == t.id)) { snap(); D.links.push({ id: nextId++, parentId: +act.link || act.link, childId: t.id }); save(); } } else if (!t) { const n = byId(act.link); addNode(act.wx, act.wy, '', n.id); } render(); }
  if (!pts.size) act = null; };

stage.addEventListener('dblclick', e => { const g = e.target.closest('.nd'); if (g) return edit(g.dataset.id); if (e.target.closest('[data-link]')) return; const [x, y] = toW(e.clientX, e.clientY); addNode(x, y); });

addEventListener('keydown', e => { if (editing || e.target.closest('input,textarea,select')) return; const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); } else if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); doRedo(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); delSel(); } else if ((e.key === 'F2' || e.key === 'Enter') && sel && String(sel)[0] !== 'L') { e.preventDefault(); edit(sel); }
  else if (e.key === 'Tab' && sel && String(sel)[0] !== 'L') { e.preventDefault(); const n = byId(sel); addNode(n.x + dims(n)[0] + 80, n.y, '', n.id); } });
function doUndo() { if (!undo.length) return; redo.push(JSON.stringify(D)); D = JSON.parse(undo.pop()); sel = null; save(); render(); }
function doRedo() { if (!redo.length) return; undo.push(JSON.stringify(D)); D = JSON.parse(redo.pop()); sel = null; save(); render(); }
function fit() { if (!D.nodes.length) { view = { x: stage.clientWidth / 2, y: stage.clientHeight / 2, s: 1 }; return render(); } let a = 1e9, b = 1e9, c = -1e9, d = -1e9; D.nodes.forEach(n => { const [w, h] = dims(n); a = Math.min(a, n.x - w / 2); b = Math.min(b, n.y - h / 2); c = Math.max(c, n.x + w / 2); d = Math.max(d, n.y + h / 2 + 24); });
  const W = stage.clientWidth, H = stage.clientHeight; view.s = Math.min(1.5, Math.max(.2, Math.min((W - 80) / (c - a), (H - 80) / (d - b)))); view.x = W / 2 - (a + c) / 2 * view.s; view.y = H / 2 - (b + d) / 2 * view.s; render(); }
const zoomBy = f => { const W = stage.clientWidth, H = stage.clientHeight, ns = Math.min(3, Math.max(.2, view.s * f)); view.x = W / 2 - (W / 2 - view.x) * ns / view.s; view.y = H / 2 - (H / 2 - view.y) * ns / view.s; view.s = ns; render(); };
$('zIn').onclick = () => zoomBy(1.2); $('zOut').onclick = () => zoomBy(1 / 1.2); $('zFit').onclick = fit;
/* araç çubuğu */
$('sw').innerHTML = PAL.map(c => `<button type="button" data-c="${c}" style="background:${c}" aria-label="renk"></button>`).join('');
const paintSw = () => $('sw').querySelectorAll('button').forEach(b => b.style.boxShadow = b.dataset.c === color ? `0 0 0 2px ${TM.css('--fg')}` : `0 0 0 1px ${TM.css('--line')}`);
$('sw').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; color = b.dataset.c; store.set('fikir:col', color); paintSw(); const n = byId(sel); if (n) { snap(); n.color = color; save(); render(); } };

$('bDel').onclick = delSel; $('bUndo').onclick = doUndo; $('bRedo').onclick = doRedo;
$('bClear').onclick = () => { if (!D.nodes.length || !confirm('Tahtadaki her şey silinsin mi?')) return; snap(); D = { nodes: [], links: [], ls: D.ls }; sel = null; save(); fit(); };

  const p = 40, W = c - a + 2 * p, H = d - b + 2 * p, v = { ...view }, s = sel; view = { x: p - a, y: p - b, s: 1 }; sel = null; render(); svg.querySelectorAll('.hd').forEach(x => x.remove()); const inner = svg.innerHTML.replace(/color-mix\([^)]*\)/g, m => mix(m)); view = v; sel = s; render();
  return { W, H, s: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="${TM.css('--bg')}"/>${inner}</svg>` }; }
function mix(m) { const r = m.match(/(#[0-9a-f]{6})\s+(\d+)%,\s*(#[0-9a-f]{6})/i); if (!r) return TM.css('--panel'); const A = parseInt(r[1].slice(1), 16), B = parseInt(r[3].slice(1), 16), t = +r[2] / 100, ch = s => Math.round(((A >> s) & 255) * t + ((B >> s) & 255) * (1 - t)); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }
const empty = () => { if (!D.nodes.length) { TM.toast('Tahta boş'); return true; } };
$('bSvg').onclick = () => { if (empty()) return; TM.download('fikir-tahtasi.svg', new Blob([exportSvg().s], { type: 'image/svg+xml' })); };

$('bJson').onclick = () => TM.download('fikir-tahtasi.json', new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' }));
$('imp').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const o = JSON.parse(await f.text()); if (!Array.isArray(o.nodes)) throw 0; snap();
    D = { nodes: o.nodes.map(n => ({ id: n.id, x: +n.x || 0, y: +n.y || 0, text: n.text || '', color: n.color || PAL[0], shape: n.shape || 'r' })), links: (o.links || []).map((l, i) => ({ id: l.id || 'i' + i, parentId: l.parentId, childId: l.childId })), ls: o.ls || 'c' };
    nextId = Math.max(0, ...D.nodes.map(n => +n.id || 0), ...D.links.map(l => +l.id || 0)) + 1; save(); fit(); TM.toast('İçe aktarıldı'); } catch (er) { TM.toast('Dosya okunamadı'); } };
TM.onMode(() => { paintSw(); render(); }); addEventListener('resize', () => render());
if (!D.nodes.length) { D.nodes = [{ id: 1, x: 0, y: 0, text: 'Ana fikir', color: '#5aa9ff', shape: 'p' }, { id: 2, x: 240, y: -84, text: 'Araştır', color: '#4cc38a', shape: 'r' }, { id: 3, x: 240, y: 84, text: 'Karar ver?', color: '#f0a04b', shape: 'd' }, { id: 4, x: -240, y: 0, text: 'Not:\nçift tıkla, yaz', color: '#facc15', shape: 'n' }];
  D.links = [{ id: 5, parentId: 1, childId: 2 }, { id: 6, parentId: 1, childId: 3 }]; nextId = 7; save(); }
