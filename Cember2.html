<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renkli Daireler · İz ve Nefes | erdevelop</title>
<meta name="description" content="Nefes alır gibi parlayan, iz bırakan ve fareni çevreleyen renkli daireler.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="deneyler/kit.css">

</head>
<body>
<script src="deneyler/kit.js"></script>
<script>
let S, C = [];
const K = Kit({ id: 'cember2', title: 'Renkli Daireler', sub: 'iz ve nefes', help: 'Daireler nefes alır gibi parlayıp söner ve arkalarında iz bırakır. Fareyi ya da parmağını gezdir: daireler etrafında döner.',
  controls: [
    { t: 'h', l: 'Daireler' },
    { k: 'n', t: 'range', l: 'Sayı', min: 10, max: 200, v: 50 },
    { k: 'size', t: 'range', l: 'En büyük boyut', min: 6, max: 80, v: 45 },
    { k: 'speed', t: 'range', l: 'Hız', min: .1, max: 5, step: .1, v: 1.2 },
    { k: 'pal', t: 'select', l: 'Renk paleti', o: PAL_OPTS, v: 'klasik' },
    { t: 'h', l: 'Efekt' },
    { k: 'trail', t: 'range', l: 'İz uzunluğu', min: 0, max: .97, step: .01, v: .88, fmt: x => '%' + Math.round(x * 100) },
    { k: 'breath', t: 'range', l: 'Nefes hızı', min: 0, max: 3, step: .1, v: 1 },
    { k: 'pull', t: 'range', l: 'Fareye çekim', min: 0, max: 1, step: .05, v: .5 },
    { k: 'glow', t: 'check', l: 'Işıltı', v: true },
    { t: 'buttons', b: [['Yeniden dağıt', () => init(), 1], ['Temizle', () => { S.ctx.fillStyle = '#000'; S.ctx.fillRect(0, 0, S.W, S.H); }]] }
  ],
  onChange: k => { if (['n', 'size', 'pal', '*'].includes(k)) init(); }
});
function init() { C = []; for (let i = 0; i < K.v.n; i++) C.push({ x: rnd(0, S.W), y: rnd(0, S.H), r: rnd(K.v.size * .2, K.v.size), a: rnd(0, 6.28), w: rnd(-.02, .02), s: rnd(.4, 1.2), ph: rnd(0, 6.28), f: rnd(.5, 1.5), rgb: hexRgb(pick(PALETTES[K.v.pal])) }); }
S = K.canvas(); S.onResize(() => { S.ctx.fillStyle = '#000'; S.ctx.fillRect(0, 0, S.W, S.H); }); init();
K.loop((dt, t) => {
  const v = K.v, g = S.ctx, f = dt * 60, P = K.ptr;
  g.globalCompositeOperation = 'source-over'; g.fillStyle = `rgba(0,0,0,${1 - v.trail})`; g.fillRect(0, 0, S.W, S.H);
  g.globalCompositeOperation = v.glow ? 'lighter' : 'source-over';
  for (const c of C) {
    c.w += rnd(-.004, .004); c.w *= .98; c.a += c.w * f;
    let vx = Math.cos(c.a) * c.s * v.speed, vy = Math.sin(c.a) * c.s * v.speed;
    if (P.active && v.pull > 0) { const dx = P.x - c.x, dy = P.y - c.y, d = Math.hypot(dx, dy) || 1; const k = v.pull * Math.min(1, 220 / d) * 2; vx += (dx / d * .6 - dy / d) * k; vy += (dy / d * .6 + dx / d) * k; }
    c.x += vx * f; c.y += vy * f;
    const m = c.r; if (c.x < -m) c.x = S.W + m; if (c.x > S.W + m) c.x = -m; if (c.y < -m) c.y = S.H + m; if (c.y > S.H + m) c.y = -m;
    const o = .15 + .55 * (.5 + .5 * Math.sin(t * v.breath * c.f + c.ph)), rr = c.r * (.85 + .15 * Math.sin(t * v.breath * c.f + c.ph)), [r, gg, b] = c.rgb;
    const gr = g.createRadialGradient(c.x, c.y, 0, c.x, c.y, rr); gr.addColorStop(0, `rgba(${r},${gg},${b},${o})`); gr.addColorStop(.7, `rgba(${r},${gg},${b},${o * .6})`); gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(c.x, c.y, rr, 0, 6.2832); g.fill();
  }
});

</script>
</body>
</html>
