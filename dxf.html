        if (e.type === 'MTEXT') {

          const dx = g1(e, 11, NaN), dy = g1(e, 21, NaN); if (!isNaN(dx) && !isNaN(dy) && (dx || dy)) rot = Math.atan2(dy, dx);
          const ap = g1(e, 71, 1); align = ['left', 'center', 'right'][(ap - 1) % 3]; base = ['top', 'middle', 'bottom'][Math.floor((ap - 1) / 3)];

/* ---------------- view ---------------- */
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage');
let autoFit = true, model = null, view = { s: 1, x: 0, y: 0 }, W = 1, H = 1, DPR = 1, layerState = {}, paths = {}, vertices = [];
function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = stage.clientWidth; H = stage.clientHeight; cv.width = W * DPR; cv.height = H * DPR; if (autoFit) fit(); else draw(); }
const toScreen = (x, y) => [x * view.s + view.x, -y * view.s + view.y];
const toWorld = (sx, sy) => [(sx - view.x) / view.s, -(sy - view.y) / view.s];

function prepare() {
  paths = {}; vertices = [];

    const key = p.layer + '|' + p.color;
    const P = paths[key] || (paths[key] = { layer: p.layer, color: p.color, path: new Path2D() });
    P.path.moveTo(p.pts[0][0], p.pts[0][1]);
    for (let k = 1; k < p.pts.length; k++) P.path.lineTo(p.pts[k][0], p.pts[k][1]);
    if (p.pts.length <= 64) for (const q of p.pts) vertices.push(q[0], q[1], p.layer);
    else { vertices.push(p.pts[0][0], p.pts[0][1], p.layer, p.pts[p.pts.length - 1][0], p.pts[p.pts.length - 1][1], p.layer); }
  }
}
function extents() {

  const vis = l => !layerState[l] || layerState[l].on;
  for (const p of model.polys) if (vis(p.layer)) for (const q of p.pts) { if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }
  for (const t of model.texts) if (vis(t.layer)) { x0 = Math.min(x0, t.x); x1 = Math.max(x1, t.x); y0 = Math.min(y0, t.y); y1 = Math.max(y1, t.y + t.h); }

}
function fit() {
  if (!model) return;

  view.s = Math.min((W - 40) / w, (H - 40) / h);

}
function draw() {
  const dark = document.documentElement.dataset.mode === 'dark';

    const [sx, sy] = toScreen(t.x, t.y); if (sx < -2000 || sx > W + 2000 || sy < -2000 || sy > H + 2000) continue;

}

/* ---------------- layers panel ---------------- */
function paintLayers() {
  const dark = document.documentElement.dataset.mode === 'dark';
  const counts = {};
  model.polys.forEach(p => counts[p.layer] = (counts[p.layer] || 0) + 1);
  model.texts.forEach(t => counts[t.layer] = (counts[t.layer] || 0) + 1);
  const names = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'tr'));
  $('layers').innerHTML = names.map(n => {
    const st = layerState[n], col = aci((model.doc.layers[n] || {}).color ?? 7, dark);
    return `<label class="lyr${st.on ? '' : ' off'}"><input type="checkbox" data-l="${encodeURIComponent(n)}" ${st.on ? 'checked' : ''}><i style="background:${col}"></i><span title="${n.replace(/"/g, '&quot;')}">${n.replace(/</g, '&lt;')}</span><small>${counts[n]}</small></label>`;
  }).join('');
}
$('layers').addEventListener('change', e => { const n = decodeURIComponent(e.target.dataset.l || ''); if (layerState[n]) { layerState[n].on = e.target.checked; paintLayers(); draw(); } });
$('allOn').addEventListener('click', () => { for (const k in layerState) layerState[k].on = true; paintLayers(); draw(); });
$('allOff').addEventListener('click', () => { for (const k in layerState) layerState[k].on = false; paintLayers(); draw(); });
$('sideT').addEventListener('click', () => $('side').classList.toggle('collapsed'));

function paintInfo() {
  const t = T[lang], d = model.doc, u = d.header.$INSUNITS ? UNITS[d.header.$INSUNITS[70]] || d.header.$INSUNITS[70] : '–';
  const [x0, y0, x1, y1] = extents(), sk = Object.entries(model.stats.skipped).map(([k, v]) => `${k}×${v}`).join(', ');
  const f = v => (Math.round(v * 100) / 100).toLocaleString(lang === 'tr' ? 'tr-TR' : 'en-GB');
  $('info').innerHTML = `<b>${model.stats.count}</b> ${t.ents} · ${t.units}: <b>${u}</b><br>${t.ext}: <b>${f(x1 - x0)} × ${f(y1 - y0)}</b>${sk ? `<br>${t.skipped}: ${sk}` : ''}`;
}

/* ---------------- load ---------------- */
function msg(text, err) { const m = $('msg'); m.textContent = text; m.classList.toggle('err', !!err); m.hidden = !text; clearTimeout(m._t); if (text && !err) m._t = setTimeout(() => { m.hidden = true; }, 6000); }
function loadText(text, name) {
  if (/^AC10\d\d/.test(text.slice(0, 6))) { msg(T[lang].dwg, true); return; }
  if (text.startsWith('AutoCAD Binary DXF')) { msg(T[lang].bin, true); return; }
  let doc;
  try { doc = parseDXF(text); } catch (e) { msg(T[lang].bad + ' ' + e.message, true); return; }
  const built = build(doc);
  if (!built.polys.length && !built.texts.length) { msg(T[lang].empty, true); return; }
  model = { doc, ...built };
  layerState = {};
  for (const p of model.polys) layerState[p.layer] = layerState[p.layer] || { on: !(doc.layers[p.layer] || {}).off };
  for (const t of model.texts) layerState[t.layer] = layerState[t.layer] || { on: !(doc.layers[t.layer] || {}).off };
  $('fname').textContent = name || '';
  meas.a = meas.b = null; $('meas').hidden = true;
  prepare(); paintLayers(); paintInfo(); fit();
  if (name) msg(`${name} ${T[lang].loaded}`);
}
async function loadFile(f) {
  const buf = await f.arrayBuffer();
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder('windows-1254').decode(buf); }
  loadText(text, f.name);
}
$('file').addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); e.target.value = ''; });
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('drop').hidden = false; });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('drop').hidden = true; const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

/* ---------------- interaction ---------------- */
const meas = { a: null, b: null, hover: null };
let measOn = false, snapPt = null;
const ptrs = new Map(); let gest = null;
function nearest(sx, sy) {
  const [wx, wy] = toWorld(sx, sy), r = 12 / view.s; let best = null, bd = r * r;
  for (let k = 0; k < vertices.length; k += 3) {
    if (layerState[vertices[k + 2]] && !layerState[vertices[k + 2]].on) continue;
    const dx = vertices[k] - wx, dy = vertices[k + 1] - wy, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = [vertices[k], vertices[k + 1]]; }
  }
  return best;
}
function showMeas() {
  const t = T[lang], el = $('meas');
  if (!meas.a) { el.innerHTML = `<span>${t.m1}</span>`; el.hidden = false; return; }
  const b = meas.b || meas.hover;
  if (!b) { el.innerHTML = `<span>${t.m2}</span>`; return; }
  const dx = b[0] - meas.a[0], dy = b[1] - meas.a[1], d = Math.hypot(dx, dy), ang = Math.atan2(dy, dx) * 180 / Math.PI;
  const f = v => (Math.round(v * 100) / 100).toLocaleString(lang === 'tr' ? 'tr-TR' : 'en-GB');
  el.innerHTML = `<span>${t.dist}</span><br><b>${f(d)}</b><br><span>Δx ${f(dx)} · Δy ${f(dy)} · ${t.ang} ${f(ang)}°</span>`;
}
$('measBtn').addEventListener('click', () => {
  measOn = !measOn; $('measBtn').classList.toggle('on', measOn); cv.classList.toggle('measure', measOn);
  meas.a = meas.b = meas.hover = null; snapPt = null;
  if (measOn) showMeas(); else $('meas').hidden = true; draw();
});
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; gest = { kind: 'pinch', d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: view.s, vx: view.x, vy: view.y, m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] }; return; }

});
cv.addEventListener('pointermove', e => {
  const sx = e.offsetX, sy = e.offsetY;
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, [sx, sy]);
  const [wx, wy] = toWorld(sx, sy), f = v => (Math.round(v * 100) / 100).toLocaleString(lang === 'tr' ? 'tr-TR' : 'en-GB');
  $('hud').textContent = `x ${f(wx)} · y ${f(wy)}`;
  if (gest && gest.kind === 'pinch' && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), ns = gest.s * d / gest.d;
    view.x = gest.m[0] - (gest.m[0] - gest.vx) * ns / gest.s; view.y = gest.m[1] - (gest.m[1] - gest.vy) * ns / gest.s; view.s = ns; autoFit = false; draw(); return;
  }

    const dx = sx - gest.sx, dy = sy - gest.sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) gest.moved = true;
    if (gest.moved) { view.x = gest.vx + dx; view.y = gest.vy + dy; autoFit = false; draw(); return; }
  }

});

  ptrs.delete(e.pointerId);

    const p = nearest(e.offsetX, e.offsetY) || toWorld(e.offsetX, e.offsetY);
    if (!meas.a || meas.b) { meas.a = p; meas.b = null; } else { meas.b = p; }

cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0015), sx = e.offsetX, sy = e.offsetY;
  view.x = sx - (sx - view.x) * f; view.y = sy - (sy - view.y) * f; view.s *= f; autoFit = false; draw();
}, { passive: false });
cv.addEventListener('dblclick', fit);
$('fitBtn').addEventListener('click', fit);
addEventListener('keydown', e => { if (e.key === 'Escape' && measOn) { meas.a = meas.b = meas.hover = null; showMeas(); draw(); } });

/* ---------------- sample drawing (a facade elevation) ---------------- */
function sampleDXF() {
  const out = [];
  const P = (...a) => { for (let k = 0; k < a.length; k += 2) out.push(String(a[k]), String(a[k + 1])); };
  P(0, 'SECTION', 2, 'HEADER', 9, '$INSUNITS', 70, 4, 0, 'ENDSEC');
  P(0, 'SECTION', 2, 'TABLES', 0, 'TABLE', 2, 'LAYER');
  [['AKS', 1], ['DIKME', 7], ['KAYIT', 8], ['CAM', 4], ['OLCU', 2], ['YAZI', 3], ['DETAY', 6]].forEach(([n, c]) => P(0, 'LAYER', 2, n, 70, 0, 62, c));
  P(0, 'ENDTAB', 0, 'ENDSEC');
  P(0, 'SECTION', 2, 'ENTITIES');
  const Wd = 9000, Hd = 9600, mx = 1500, my = 3200, pw = 50;
  const line = (l, x1, y1, x2, y2) => P(0, 'LINE', 8, l, 10, x1, 20, y1, 11, x2, 21, y2);
  const rect = (l, x, y, w, h, closed = 1) => P(0, 'LWPOLYLINE', 8, l, 90, 4, 70, closed, 10, x, 20, y, 10, x + w, 20, y, 10, x + w, 20, y + h, 10, x, 20, y + h);
  for (let x = 0; x <= Wd; x += mx) { line('AKS', x, -600, x, Hd + 600); rect('DIKME', x - pw / 2, 0, pw, Hd); }
  for (let y = 0; y <= Hd; y += my) { line('AKS', -600, y, Wd + 600, y); rect('KAYIT', 0, y - pw / 2, Wd, pw); }
  for (let x = 0; x < Wd; x += mx) for (let y = 0; y < Hd; y += my) { rect('CAM', x + 40, y + 40, mx - 80, my - 80); line('CAM', x + 40, y + 40, x + mx / 2, y + my - 40); line('CAM', x + mx / 2, y + my - 40, x + mx - 40, y + 40); }
  for (let x = 0; x < Wd; x += mx) { line('OLCU', x, -900, x + mx, -900); line('OLCU', x, -980, x, -820); P(0, 'TEXT', 8, 'OLCU', 10, x + mx / 2, 20, -820, 40, 120, 1, mx, 72, 1, 11, x + mx / 2, 21, -820); }
  line('OLCU', Wd, -980, Wd, -820);
  P(0, 'TEXT', 8, 'YAZI', 10, 0, 20, Hd + 900, 40, 300, 1, 'ÖRNEK CEPHE GÖRÜNÜŞÜ · 1:50');
  P(0, 'MTEXT', 8, 'YAZI', 10, Wd + 900, 20, Hd, 40, 140, 71, 1, 1, 'Dikme: 50 mm\\PKayıt: 50 mm\\PAks: 1500 × 3200');
  // a free-form detail: arc, circle, bulged polyline
  P(0, 'CIRCLE', 8, 'DETAY', 10, Wd + 2200, 20, 3000, 40, 600);
  P(0, 'ARC', 8, 'DETAY', 10, Wd + 2200, 20, 3000, 40, 900, 50, 20, 51, 160);
  P(0, 'LWPOLYLINE', 8, 'DETAY', 90, 3, 70, 0, 10, Wd + 1300, 20, 1200, 42, 0.6, 10, Wd + 3100, 20, 1200, 42, -0.6, 10, Wd + 3100, 20, 300);
  P(0, 'ENDSEC', 0, 'EOF');
  return out.join('\n');
}

/* ---------------- boot ---------------- */
function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-k]').forEach(el => { if (t[el.dataset.k]) el.textContent = t[el.dataset.k]; });
  $('langBtn').textContent = t.btn;
  if (model) paintInfo();
  if (measOn) showMeas();
}
$('langBtn').addEventListener('click', () => { lang = lang === 'tr' ? 'en' : 'tr'; render(); });
const applyMode = () => { document.documentElement.dataset.mode = mode; $('modeBtn').textContent = mode === 'dark' ? 'LIGHT' : 'DARK'; if (model) paintLayers(); draw(); };
$('modeBtn').addEventListener('click', () => { mode = mode === 'dark' ? 'light' : 'dark'; store.set('erdevelop-mode', mode); applyMode(); });
new ResizeObserver(resize).observe(stage);
applyMode(); render(); resize();
loadText(sampleDXF(), ''); msg(T[lang].sample);
})();
