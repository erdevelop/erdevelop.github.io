<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<script src="kilit.js" data-gate></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DXF Görüntüleyici | erdevelop</title>
<meta name="description" content="DXF çizimini tarayıcıda aç: katmanlar, blok sayımı, metraj, cam listesi, akıllı ölçü, işaretleme, PDF/SVG çıktı ve iki çizimi karşılaştırma. Dosya bilgisayardan çıkmaz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #eef2f6; --panel: #ffffff; --panel-2: #f5f7f9; --grid: #e3e8ed; --line: #cfd8e1;
    --fg: #1c2833; --text: #45535f; --muted: #74838f; --accent: #2f6fb5; --accent-dim: rgba(47,111,181,.12); --hot: #c8731f;
    --canvas: #f7f8fa; --add: #1f9d4c; --rem: #d93a2f; --mk: #e0402f;
    --f-display: 'Chakra Petch', 'Segoe UI', sans-serif; --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; --f-mono: 'IBM Plex Mono', Consolas, monospace;
    color-scheme: light;
  }
  :root[data-mode="dark"] {
    --bg: #0c1015; --panel: #131921; --panel-2: #10151c; --grid: #1a212a; --line: #26303b;
    --fg: #dfe6ed; --text: #a9b5c1; --muted: #75838f; --accent: #5aa9ff; --accent-dim: rgba(90,169,255,.14); --hot: #f0a04b;
    --canvas: #1d2228; --add: #3fd37a; --rem: #ff5f52; --mk: #ff5a48;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; display: flex; flex-direction: column; overflow: hidden; }
  a { color: inherit; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .topbar { flex: none; border-bottom: 1px solid var(--line); background: var(--bg); padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: relative; z-index: 5; }
  .brand { font: 700 15px var(--f-display); letter-spacing: 1px; text-transform: uppercase; text-decoration: none; }
  .brand span { color: var(--accent); }
  .crumb { font: 400 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
  .crumb a { text-decoration: none; } .crumb a:hover { color: var(--accent); }
  .sp { flex: 1; }
  .tb { font: 500 12px var(--f-mono); color: var(--accent); padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); cursor: pointer; white-space: nowrap; }
  .tb:hover { border-color: var(--accent); }
  .tb.on, .tb.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tgroup { display: inline-flex; }
  .tgroup .tb { border-radius: 0; margin-left: -1px; }
  .tgroup .tb:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .tgroup .tb:last-child { border-radius: 0 4px 4px 0; }
  .fname { font: 400 12px var(--f-mono); color: var(--muted); max-width: 34ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menuwrap { position: relative; }
  .menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 6px; display: flex; flex-direction: column; z-index: 20; }
  .menu label, .menu button { display: block; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 4px; cursor: pointer; font: 400 13px var(--f-body); color: var(--fg); }
  .menu label:hover, .menu button:hover { background: var(--accent-dim); color: var(--accent); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu small { display: block; color: var(--muted); font: 400 11px var(--f-mono); margin-top: 1px; }

  .main { flex: 1; display: flex; min-height: 0; }
  .side { width: 310px; flex: none; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 7px 7px; font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: 0; color: var(--muted); cursor: pointer; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:hover { color: var(--fg); }
  .tabs #sideT { margin-left: auto; display: none; }
  .pane { flex: 1; overflow: auto; min-height: 0; font: 400 12px var(--f-mono); }
  .ptools { min-height: 41px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel-2); position: sticky; top: 0; z-index: 2; }
  .ptools select, .ptools input { font: 400 12px var(--f-mono); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; min-width: 0; }
  .ptools input[type=search] { flex: 1; }
  .ptools .sp { flex: 1; }
  .pbtn { font: 500 11px var(--f-mono); color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; cursor: pointer; white-space: nowrap; }
  .pbtn:hover { border-color: var(--accent); }
  .pnote { padding: 8px 10px; color: var(--muted); font: 400 11.5px/1.5 var(--f-body); }
  .pnote b { color: var(--fg); font-weight: 600; }
  .tbl { width: 100%; border-collapse: collapse; font: 400 11.5px var(--f-mono); font-variant-numeric: tabular-nums; }
  .tbl th { position: sticky; top: 41px; background: var(--panel); text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); z-index: 1; }
  .tbl td { padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
  .tbl .r { text-align: right; white-space: nowrap; }
  .tbl tr.clk { cursor: pointer; }
  .tbl tr.clk:hover td { background: var(--accent-dim); }
  .tbl tr.on td { background: var(--accent-dim); color: var(--accent); }
  .tbl tfoot td { font-weight: 600; color: var(--fg); border-top: 1px solid var(--line); border-bottom: 0; }
  .tbl .nm { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lyr { display: grid; grid-template-columns: 18px 12px 1fr auto; gap: 8px; align-items: center; padding: 4px 12px; cursor: pointer; font: 400 12.5px var(--f-mono); }
  .lyr:hover { background: var(--accent-dim); }
  .lyr input { margin: 0; accent-color: var(--accent); }
  .lyr i { width: 12px; height: 12px; border-radius: 2px; border: 1px solid var(--line); }
  .lyr span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lyr small { color: var(--muted); font-size: 11px; }
  .lyr.off span { color: var(--muted); text-decoration: line-through; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; padding: 10px 12px; }
  .kv span { color: var(--muted); }
  .kv b { font-weight: 500; text-align: right; overflow-wrap: anywhere; }
  .info { border-top: 1px solid var(--line); padding: 8px 12px; font: 400 11.5px/1.6 var(--f-mono); color: var(--muted); flex: none; }
  .info b { color: var(--fg); font-weight: 500; }

  .stage { position: relative; flex: 1; min-width: 0; background: var(--canvas); touch-action: none; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #cv.cross { cursor: crosshair; }
  #cv.pick { cursor: default; }
  .hud { position: absolute; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font: 400 12px var(--f-mono); color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; pointer-events: none; font-variant-numeric: tabular-nums; }
  .card { position: absolute; right: 10px; top: 10px; font: 400 12px/1.5 var(--f-mono); background: var(--panel); border: 1px solid var(--accent); border-radius: 6px; padding: 10px 12px; width: 270px; max-width: calc(100% - 20px); font-variant-numeric: tabular-nums; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: calc(100% - 20px); overflow: auto; }
  .card .big { color: var(--accent); font-size: 20px; font-weight: 500; line-height: 1.3; }
  .card .sub { color: var(--muted); font-size: 11.5px; }
  .card .row { display: flex; justify-content: space-between; gap: 10px; }
  .card .row span { color: var(--muted); }
  .card .row b { font-weight: 500; text-align: right; overflow-wrap: anywhere; }
  .card hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
  .card .hint { color: var(--muted); font-size: 11px; margin-top: 6px; font-family: var(--f-body); }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { font: 500 11px var(--f-mono); padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); cursor: pointer; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips.sm .chip { padding: 2px 6px; font-size: 10px; }
  .fbar { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.18); font: 500 12px var(--f-mono); max-width: calc(100% - 20px); flex-wrap: wrap; justify-content: center; }
  .fbar.top { top: 10px; }
  .fbar.bot { bottom: calc(44px + env(safe-area-inset-bottom, 0px)); }
  .fbar button { font: 500 12px var(--f-mono); background: none; border: 1px solid transparent; border-radius: 4px; padding: 5px 9px; cursor: pointer; color: var(--fg); }
  .fbar button:hover { border-color: var(--line); }
  .fbar button.on { background: var(--mk); color: #fff; }
  .fbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
  .fbar .lg { padding: 0 6px; white-space: nowrap; }
  .fbar .lg.a { color: var(--add); } .fbar .lg.r { color: var(--rem); }
  .fbar #cPos { color: var(--muted); min-width: 52px; text-align: center; }
  .noteIn { position: absolute; z-index: 6; font: 500 14px var(--f-body); color: var(--mk); background: var(--panel); border: 1px solid var(--mk); border-radius: 4px; padding: 4px 6px; width: 220px; }
  .dlg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; width: 320px; max-width: calc(100% - 20px); box-shadow: 0 16px 40px rgba(0,0,0,.3); z-index: 8; display: grid; gap: 10px; font: 400 12.5px var(--f-mono); }
  .dlg h3 { margin: 0; font: 700 15px var(--f-display); text-transform: uppercase; letter-spacing: 1px; }
  .dlg label { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 8px; color: var(--muted); }
  .dlg select, .dlg input { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: 400 12.5px var(--f-mono); width: 100%; }
  .dlg .scl { display: flex; gap: 6px; align-items: center; }
  .dlg .scl input { width: 90px; }
  .dlg .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .dlg .note { color: var(--muted); font: 400 11.5px/1.5 var(--f-body); }
  .drop { position: absolute; inset: 14px; border: 2px dashed var(--accent); border-radius: 10px; background: var(--accent-dim); display: grid; place-items: center; font: 600 16px var(--f-mono); color: var(--accent); pointer-events: none; }
  .msg { position: absolute; left: 50%; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; font: 400 12.5px var(--f-mono); max-width: calc(100% - 28px); box-shadow: 0 6px 18px rgba(0,0,0,.15); z-index: 7; }
  .msg.err { border-color: var(--rem); color: var(--rem); }

  @media (max-width: 760px) {
    .main { flex-direction: column-reverse; }
    .side { width: auto; height: 38vh; flex: none; border-right: 0; border-top: 1px solid var(--line); }
    .side.collapsed { height: auto; }
    .side.collapsed .pane, .side.collapsed .info { display: none; }
    .tabs #sideT { display: block; }
    .fname, .crumb { display: none; }
    .side { height: 34vh; }
    .card { width: auto; left: 8px; right: 8px; top: 8px; padding: 8px 10px; max-height: 46%; font-size: 11.5px; }
    .card hr { margin: 6px 0; }
    .card .big { font-size: 17px; }
    .card .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .card .snl { display: none; }
    .card.mkc { display: none; }
    .msg { bottom: calc(44px + env(safe-area-inset-bottom, 0px)); font-size: 11.5px; }
    .info { display: none; }
  }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="./">erdevelop<span>_</span></a>
  <span class="crumb">/ <a href="Tools.html">tools</a> / dxf</span>
  <div class="menuwrap">
    <button class="tb primary" type="button" id="fileBtn" aria-haspopup="true" aria-expanded="false"><span data-k="file">Dosya</span> ▾</button>
    <div class="menu" id="menu" hidden>
      <label for="file"><span data-k="open">DXF aç…</span><small data-k="openS">ya da dosyayı ekrana sürükle</small></label>
      <label for="file2"><span data-k="cmpOpen">Karşılaştır…</span><small data-k="cmpOpenS">açık çizimi yeni bir DXF ile kıyasla</small></label>
      <hr>
      <button type="button" data-x="png"><span data-k="xPng">PNG kaydet</span><small data-k="xPngS">ekrandaki görünüm</small></button>
      <button type="button" data-x="svg"><span data-k="xSvg">SVG kaydet</span><small data-k="xSvgS">açık katmanlar, vektör</small></button>
      <button type="button" data-x="pdf"><span data-k="xPdf">PDF…</span><small data-k="xPdfS">kağıt boyu ve ölçekle</small></button>
    </div>
  </div>
  <input type="file" id="file" accept=".dxf,application/dxf,image/vnd.dxf" hidden>
  <input type="file" id="file2" accept=".dxf,application/dxf,image/vnd.dxf" hidden>
  <span class="fname" id="fname"></span>
  <span class="sp"></span>
  <button class="tb" type="button" id="fitBtn" data-k="fit">Sığdır</button>
  <span class="tgroup" role="group">
    <button class="tb" type="button" data-mode="pick" data-k="pick">Seç</button>
    <button class="tb" type="button" data-mode="measure" data-k="measure">Ölç</button>
    <button class="tb" type="button" data-mode="markup" data-k="markup">İşaretle</button>
  </span>
  <button class="tb" type="button" id="modeBtn">DARK</button>
  <button class="tb" type="button" id="langBtn">EN</button>
</div>
<div class="main">
  <aside class="side" id="side">
    <div class="tabs" id="tabs" role="tablist">
      <button type="button" data-tab="lay" data-k="tLay">Katman</button>
      <button type="button" data-tab="blk" data-k="tBlk">Blok</button>
      <button type="button" data-tab="sum" data-k="tSum">Metraj</button>
      <button type="button" data-tab="pan" data-k="tPan">Panel</button>
      <button type="button" data-tab="txt" data-k="tTxt">Yazı</button>
      <button type="button" data-tab="sel" data-k="tSel">Seçim</button>
      <button type="button" data-tab="dif" data-k="tDif" hidden>Fark</button>
      <button type="button" id="sideT" aria-label="Paneli aç/kapa">▾</button>
    </div>
    <div class="pane" id="pane"></div>
    <div class="info" id="info"></div>
  </aside>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud" id="hud">x 0 · y 0</div>
    <div class="card" id="card" hidden></div>
    <div class="fbar top" id="mkbar" hidden>
      <button type="button" data-mt="note" data-k="mNote">Not</button>
      <button type="button" data-mt="cloud" data-k="mCloud">Bulut</button>
      <button type="button" data-mt="arrow" data-k="mArrow">Ok</button>
      <span class="sep"></span>
      <button type="button" data-mt="undo" data-k="mUndo">Geri al</button>
      <button type="button" data-mt="clear" data-k="mClear">Temizle</button>
    </div>
    <div class="fbar bot" id="cmpbar" hidden>
      <span class="lg a" id="cAdd">+0</span><span class="lg r" id="cRem">−0</span>
      <span class="sep"></span>
      <button type="button" id="cPrev" aria-label="önceki fark">◀</button><span id="cPos">–</span><button type="button" id="cNext" aria-label="sonraki fark">▶</button>
      <span class="sep"></span>
      <button type="button" id="cClose" data-k="cClose">Kapat</button>
    </div>
    <input class="noteIn" id="noteIn" hidden autocomplete="off">
    <form class="dlg" id="pdfDlg" hidden>
      <h3>PDF</h3>
      <label><span data-k="pPaper">Kağıt</span><select id="pPaper"><option>A4</option><option selected>A3</option><option>A2</option><option>A1</option></select></label>
      <label><span data-k="pOrient">Yön</span><select id="pOrient"><option value="l" data-k="pLand">Yatay</option><option value="p" data-k="pPort">Dikey</option></select></label>
      <label><span data-k="pScope">Kapsam</span><select id="pScope"><option value="view" data-k="pView">Ekrandaki görünüm</option><option value="all" data-k="pAll">Tüm çizim</option></select></label>
      <label><span data-k="pScale">Ölçek</span><span class="scl"><select id="pScaleMode"><option value="fit" data-k="pFit">Sığdır</option><option value="n">1 :</option></select><input type="number" id="pScale" value="50" min="1" step="1" inputmode="numeric" hidden></span></label>
      <div class="note" id="pNote"></div>
      <div class="btns"><button class="tb" type="button" id="pCancel" data-k="cancel">İptal</button><button class="tb primary" type="submit" id="pGo" data-k="pGo">PDF oluştur</button></div>
    </form>
    <div class="drop" id="drop" hidden data-k="drop">DXF dosyasını bırak</div>
    <div class="msg" id="msg" hidden></div>
  </div>
</div>

/* ---------------- tools & card ---------------- */
function setTool(m) {
  if (toolMode === m) m = 'pan';
  commitNote();
  toolMode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  cv.className = m === 'measure' ? 'cross' : m === 'pick' ? 'pick' : m === 'markup' ? 'cross' : '';
  $('mkbar').hidden = m !== 'markup';
  meas.pts = []; meas.hover = null; meas.done = false; snapRes = null; winRect = null;
  showCard(); draw();
}
function measResult() {
  const tt = t(), P = meas.pts.concat(!meas.done && meas.hover ? [meas.hover] : []);

    if (P.length < 2) return `<div class="sub">${tt.d2}</div>`;
    const [a, b] = P, dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy);
    return `<div class="sub">${tt.dist}</div><div class="big">${L(d)}</div><div class="sub">Δx ${nf(dx)} · Δy ${nf(dy)} · ${tt.ang} ${nf(Math.atan2(dy, dx) * 180 / Math.PI)}°</div>`;
  }
  if (meas.mode === 'area') {
    if (P.length < 3) return `<div class="sub">${P.length ? tt.a2 : tt.a1}</div>${P.length === 2 ? `<div class="sub">${tt.dist}: ${L(Math.hypot(P[1][0] - P[0][0], P[1][1] - P[0][1]))}</div>` : ''}`;
    let per = 0; for (let k = 0; k < P.length; k++) { const p = P[k], q = P[(k + 1) % P.length]; per += Math.hypot(q[0] - p[0], q[1] - p[1]); }
    return `<div class="sub">${tt.area}</div><div class="big">${A2(polyArea(P))}</div><div class="sub">${tt.perim} ${L(per)} · ${P.length} ${tt.pts}</div>${meas.done ? '' : `<div class="hint">${tt.a2}</div>`}`;
  }
  if (P.length < 3) return `<div class="sub">${[tt.g1, tt.g2, tt.g3][P.length]}</div>`;
  const [a, b, c] = P, v1 = [a[0] - b[0], a[1] - b[1]], v2 = [c[0] - b[0], c[1] - b[1]];
  const ang = Math.acos(Math.max(-1, Math.min(1, (v1[0] * v2[0] + v1[1] * v2[1]) / (Math.hypot(...v1) * Math.hypot(...v2) || 1)))) * 180 / Math.PI;
  return `<div class="sub">${tt.ang}</div><div class="big">${nf(ang)}°</div><div class="sub">360° − ${nf(ang)}° = ${nf(360 - ang)}°</div>`;
}
function showCard() {

      `<div id="mres">${measResult()}</div><hr><div class="sub snl" style="margin-bottom:4px">${tt.snaps}</div><div class="chips sm">${['end', 'mid', 'int', 'cen', 'per', 'nea'].map(k => `<button type="button" class="chip${snapOn.has(k) ? ' on' : ''}" data-sn="${k}">${tt.sn[k]}</button>`).join('')}</div>`;

function updateMeasCard() { const r = $('mres'); if (r) r.innerHTML = measResult(); }
$('card').addEventListener('click', e => {

  else if (b.dataset.sn) { const k = b.dataset.sn; snapOn.has(k) ? snapOn.delete(k) : snapOn.add(k); showCard(); }

document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.mode)));
function addMeasPt(p) {

function openNote(sx, sy) {
  const inp = $('noteIn'); inp.value = ''; inp.style.left = Math.min(sx, W - 230) + 'px'; inp.style.top = Math.max(0, sy - 30) + 'px'; inp.hidden = false;
  noteAt = { p: toWorld(sx, sy), h: 16 / view.s }; setTimeout(() => inp.focus(), 0);
}
function commitNote() {
  const inp = $('noteIn'); if (inp.hidden) return; inp.hidden = true;
  const v = inp.value.trim(); if (v && noteAt) { mk.list.push({ t: 'note', p: noteAt.p, h: noteAt.h, str: v }); saveMk(); }

$('noteIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commitNote(); } else if (e.key === 'Escape') { $('noteIn').hidden = true; noteAt = null; } e.stopPropagation(); });

/* ---------------- pointer interaction ---------------- */
const ptrs = new Map(); let gest = null;
cv.addEventListener('pointerdown', e => {
  commitNote(); closeMenu();
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; gest = { kind: 'pinch', d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, s: view.s, vx: view.x, vy: view.y, m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2] }; winRect = null; mk.draft = null; draw(); return; }
  if (ptrs.size > 2) return;
  const sx = e.offsetX, sy = e.offsetY;
  if (e.button === 1 || toolMode === 'pan') { e.preventDefault(); gest = { kind: 'pan', sx, sy, vx: view.x, vy: view.y, moved: false, click: false }; return; }
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (toolMode === 'pick') gest = { kind: 'win', sx, sy, moved: false, shift: e.shiftKey };
  else if (toolMode === 'measure') gest = { kind: 'pan', sx, sy, vx: view.x, vy: view.y, moved: false, click: true };
  else if (toolMode === 'markup') gest = mk.tool === 'note' ? { kind: 'pan', sx, sy, vx: view.x, vy: view.y, moved: false, note: true } : { kind: 'mk', sx, sy, a: toWorld(sx, sy), moved: false };
});
cv.addEventListener('pointermove', e => {
  const sx = e.offsetX, sy = e.offsetY;
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, [sx, sy]);
  const [wx, wy] = toWorld(sx, sy);
  $('hud').textContent = `x ${nf(wx)} · y ${nf(wy)}`;
  if (gest && gest.kind === 'pinch') {
    if (ptrs.size < 2) return;
    const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), ns = gest.s * d / gest.d, m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    view.x = m[0] - (gest.m[0] - gest.vx) * ns / gest.s; view.y = m[1] - (gest.m[1] - gest.vy) * ns / gest.s; view.s = ns; autoFit = false; draw(); return;
  }
  if (gest && ptrs.has(e.pointerId)) {
    const dx = sx - gest.sx, dy = sy - gest.sy;
    if (!gest.moved && Math.abs(dx) + Math.abs(dy) > 5) gest.moved = true;
    if (gest.moved) {
      if (gest.kind === 'pan') { view.x = gest.vx + dx; view.y = gest.vy + dy; autoFit = false; draw(); return; }
      if (gest.kind === 'win') { winRect = [gest.sx, gest.sy, sx, sy]; draw(); return; }
      if (gest.kind === 'mk') { mk.draft = { t: mk.tool, a: gest.a, b: [wx, wy], s: (mk.tool === 'cloud' ? 22 : 16) / view.s }; draw(); return; }
    }
  }
  if (toolMode === 'measure' && model && e.pointerType === 'mouse') {
    const from = meas.done ? null : meas.pts[meas.pts.length - 1];
    snapRes = snap(sx, sy, from); meas.hover = snapRes ? snapRes.p : [wx, wy];
    if (!meas.done) updateMeasCard();
    draw();
  }
});
function up(e, cancel) {
  ptrs.delete(e.pointerId);
  const g = gest; if (ptrs.size === 0) gest = null;
  if (!g || g.kind === 'pinch' || cancel || !model) return;
  const sx = e.offsetX, sy = e.offsetY;
  if (g.kind === 'pan' && !g.moved && g.click) { const from = meas.done ? null : meas.pts[meas.pts.length - 1]; const s = snap(sx, sy, from); snapRes = s; addMeasPt(s ? s.p : toWorld(sx, sy)); }
  else if (g.kind === 'pan' && !g.moved && g.note) openNote(sx, sy);
  else if (g.kind === 'win') {
    if (!g.moved) { const id = pickAt(sx, sy), add = g.shift || e.shiftKey; if (!add) sel.clear(); if (id != null) { if (add && sel.has(id)) sel.delete(id); else sel.add(id); } selChanged(); }
    else windowSelect(g.sx, g.sy, sx, sy, g.shift || e.shiftKey);
    winRect = null; draw();
  } else if (g.kind === 'mk') {
    if (g.moved && mk.draft) { const d = mk.draft, a = toScreen(...d.a), b = toScreen(...d.b); if (Math.hypot(a[0] - b[0], a[1] - b[1]) > 8) { mk.list.push(d); saveMk(); } }

}
cv.addEventListener('pointerup', e => up(e, false)); cv.addEventListener('pointercancel', e => up(e, true));
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0015), sx = e.offsetX, sy = e.offsetY;
  view.x = sx - (sx - view.x) * f; view.y = sy - (sy - view.y) * f; view.s *= f; autoFit = false; draw();
}, { passive: false });
cv.addEventListener('dblclick', () => { if (toolMode === 'measure' && meas.mode === 'area') finishArea(); else if (toolMode === 'pan' || toolMode === 'pick') fit(); });
cv.addEventListener('pointerleave', () => { if (toolMode === 'measure') { snapRes = null; draw(); } });
$('fitBtn').addEventListener('click', fit);
addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input, select, textarea')) return;
  if (e.key === 'Escape') { if (toolMode === 'measure') { meas.pts = []; meas.done = false; updateMeasCard(); draw(); } else if (sel.size) { sel.clear(); selChanged(); } closeMenu(); $('pdfDlg').hidden = true; }

/* ---------------- compare ---------------- */
function compareModels(A, B) {
  const ea = A.ext, eb = B.ext, diag = Math.hypot(Math.max(ea[2], eb[2]) - Math.min(ea[0], eb[0]), Math.max(ea[3], eb[3]) - Math.min(ea[1], eb[1])) || 1;

    for (let a = -1; a <= 1 && found < 0; a++) for (let b = -1; b <= 1 && found < 0; b++) { const L2 = G.get((ix + a) + ',' + (iy + b)); if (!L2) continue; for (const i of L2) { if (used[i]) continue; const q = add[i]; if ((Math.abs(q[0] - s[0]) < t3 && Math.abs(q[1] - s[1]) < t3 && Math.abs(q[2] - s[2]) < t3 && Math.abs(q[3] - s[3]) < t3) || (Math.abs(q[0] - s[2]) < t3 && Math.abs(q[1] - s[3]) < t3 && Math.abs(q[2] - s[0]) < t3 && Math.abs(q[3] - s[1]) < t3)) { found = i; break; } } }

  }

  const tk = x => x.str + '@' + Math.round(x.x / (tol * 50)) + ',' + Math.round(x.y / (tol * 50));
  const TA = new Map(); A.texts.forEach(x => { const k = tk(x); TA.set(k, (TA.get(k) || 0) + 1); });
  const TB = new Map(); B.texts.forEach(x => { const k = tk(x); TB.set(k, (TB.get(k) || 0) + 1); });
  const seenB = new Map(); B.texts.forEach(x => { const k = tk(x), c = (seenB.get(k) || 0) + 1; seenB.set(k, c); x._cmp = c > (TA.get(k) || 0); });

  const PM = new Map(), push = (s, st) => { const k = s[4] + '|' + st; let P = PM.get(k); if (!P) PM.set(k, P = { layer: s[4], st, path: new Path2D() }); P.path.moveTo(s[0], s[1]); P.path.lineTo(s[2], s[3]); };

  });

function render() {
  const tt = t();
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-k]').forEach(el => { if (typeof tt[el.dataset.k] === 'string') el.textContent = tt[el.dataset.k]; });
  $('langBtn').textContent = tt.btn;
  if (model) { paintInfo(); paintPane(); }
  showCard(); pdfNote();
}
$('langBtn').addEventListener('click', () => { lang = lang === 'tr' ? 'en' : 'tr'; render(); draw(); });
const applyMode = () => { document.documentElement.dataset.mode = mode; $('modeBtn').textContent = mode === 'dark' ? 'LIGHT' : 'DARK'; if (model && tab === 'lay') paintPane(); draw(); };
$('modeBtn').addEventListener('click', () => { mode = mode === 'dark' ? 'light' : 'dark'; store.set('erdevelop-mode', mode); applyMode(); });
new ResizeObserver(resize).observe(stage);
paintMkBar(); applyMode(); render(); resize();
loadText(sampleDXF(), ''); msg(t().sample);
window.__dxf = { get model() { return model; }, get cmp() { return cmp; }, get view() { return view; }, sel, snap, toScreen, toWorld, loadText, startCompare: txt => startCompare(makeModel(txt, 'yeni.dxf')), sampleDXF, setTool, meas, mk };
})();
</script>
