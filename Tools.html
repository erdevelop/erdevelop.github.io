<style>
  /* Layout: same family as the home page — CAD "layers", cards with a drawn icon, file name in mono */
  :root {
    --bg: #eef2f6; --panel: #ffffff; --panel-2: #f5f7f9; --grid: #e3e8ed; --line: #cfd8e1;
    --fg: #1c2833; --text: #45535f; --muted: #74838f; --accent: #2f6fb5; --accent-dim: rgba(47,111,181,.12); --hot: #c8731f;
    --f-display: 'Chakra Petch', 'Segoe UI', sans-serif; --f-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; --f-mono: 'IBM Plex Mono', Consolas, monospace;
    color-scheme: light;
  }
  :root[data-mode="dark"] {
    --bg: #0c1015; --panel: #131921; --panel-2: #10151c; --grid: #1a212a; --line: #26303b;
    --fg: #dfe6ed; --text: #a9b5c1; --muted: #75838f; --accent: #5aa9ff; --accent-dim: rgba(90,169,255,.14); --hot: #f0a04b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); } body { background: transparent; }
  body { margin: 0; color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); }
  .topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
  .brand { font: 700 15px var(--f-display); letter-spacing: 1px; text-transform: uppercase; text-decoration: none; }
  .brand span { color: var(--accent); }
  .crumb { font: 400 12px var(--f-mono); color: var(--muted); }
  .sp { flex: 1; }
  .tb { font: 500 12px var(--f-mono); color: var(--accent); padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; text-transform: uppercase; text-decoration: none; }
  .tb:hover { border-color: var(--accent); }

  header.head { padding-block: 34px 6px; }
  .head h1 { font: 700 clamp(1.9rem, 5vw, 2.8rem)/1.05 var(--f-display); margin: 0; text-transform: uppercase; letter-spacing: -.5px; }
  .head p { margin: 10px 0 0; color: var(--text); max-width: 62ch; }
  .search { margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .search input { flex: 1; min-width: 220px; max-width: 420px; font: 400 14px var(--f-mono); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px; }
  .search input:focus { outline: none; border-color: var(--accent); }
  .search .count { font: 400 12px var(--f-mono); color: var(--muted); }

  .layer { margin-top: 40px; }
  .layer-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .layer-head h2 { font: 700 1.35rem var(--f-display); margin: 0; text-transform: uppercase; letter-spacing: .5px; }
  .layer-head .meta { font: 400 11px var(--f-mono); color: var(--muted); }
  .swatch { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); align-self: center; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .card { display: grid; grid-template-columns: 52px 1fr; gap: 4px 14px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; text-decoration: none; min-width: 0; transition: border-color .2s, transform .2s; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card[hidden] { display: none; }
  .ico { grid-row: span 3; width: 52px; height: 52px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--accent); display: grid; place-items: center;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 8px 8px; }
  .ico svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .card h3 { margin: 0; font: 600 1.02rem var(--f-body); min-width: 0; }
  .card p { margin: 0; color: var(--text); font-size: .88rem; }
  .card .file { font: 400 11px var(--f-mono); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; overflow-wrap: anywhere; min-width: 0; }
  .card .file b { font-weight: 500; color: var(--accent); }

  details.lab { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 10px; }
  details.lab summary { cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 6px 0 12px; }
  details.lab summary::-webkit-details-marker { display: none; }
  details.lab summary h2 { font: 700 1.35rem var(--f-display); margin: 0; text-transform: uppercase; letter-spacing: .5px; }
  details.lab summary .meta { font: 400 11px var(--f-mono); color: var(--muted); }
  details.lab summary .tw { font: 500 12px var(--f-mono); color: var(--accent); }
  details.lab[open] summary .tw::after { content: ' ▲'; } details.lab:not([open]) summary .tw::after { content: ' ▼'; }
  .empty { display: none; color: var(--muted); font: 400 13px var(--f-mono); margin-top: 24px; }

  footer { margin-top: 56px; border-top: 1px solid var(--line); padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px)); font: 400 12px var(--f-mono); color: var(--muted); }
  footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  footer a:hover { color: var(--accent); }

  .layer.priv .swatch { background: var(--hot); }
  .layer-head .lk { width: 18px; height: 18px; fill: none; stroke: var(--hot); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; align-self: center; }
  .relock { margin-left: auto; font: 500 11px var(--f-mono); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; text-transform: uppercase; }
  .relock:hover { color: var(--hot); border-color: var(--hot); }
  .gate { margin-top: 40px; display: flex; }
  .gate input { width: 180px; font: 400 13px var(--f-mono); color: var(--fg); background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 6px 2px; opacity: .55; transition: opacity .2s, border-color .2s; }
  .gate input::placeholder { color: var(--muted); }
  .gate input:focus { outline: none; opacity: 1; border-color: var(--accent); }
  .gate.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  /* --- motion: drifting blueprint grid, slow scan line, card reveal, cursor glow, icon draw --- */
  .bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .bg .gridf { position: absolute; inset: -80px; opacity: .55;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      linear-gradient(color-mix(in srgb, var(--grid) 60%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--grid) 60%, transparent) 1px, transparent 1px);
    background-size: 80px 80px, 80px 80px, 16px 16px, 16px 16px;
    -webkit-mask-image: radial-gradient(ellipse at 70% 0%, #000 0%, rgba(0,0,0,.5) 45%, transparent 80%); mask-image: radial-gradient(ellipse at 70% 0%, #000 0%, rgba(0,0,0,.5) 45%, transparent 80%);
    animation: drift 40s linear infinite; }
  .bg .scan { position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(transparent, var(--accent-dim), transparent); opacity: .5; animation: scan 14s ease-in-out infinite; }
  .bg .glow { position: absolute; width: 520px; height: 520px; left: calc(var(--gx, 70vw) - 260px); top: calc(var(--gy, 10vh) - 260px); border-radius: 50%;
    background: radial-gradient(closest-side, var(--accent-dim), transparent); transition: left .6s ease-out, top .6s ease-out; }
  @keyframes drift { to { transform: translate(80px, 80px); } }
  @keyframes scan { 0% { transform: translateY(-140px); } 100% { transform: translateY(110vh); } }

  .card { position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s;
    background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), var(--accent-dim), transparent 70%); }
  .card:hover::before { opacity: 1; }
  .card > * { position: relative; }
  .card.rv { opacity: 0; transform: translateY(14px); }
  .card.rv.in { opacity: 1; transform: none; transition: opacity .5s ease, transform .5s cubic-bezier(.2,.7,.2,1), border-color .2s; transition-delay: var(--d, 0s); }
  .ico svg [pathLength] { stroke-dasharray: 1; stroke-dashoffset: 0; }
  .card:hover .ico svg [pathLength] { animation: draw .9s ease forwards; }
  @keyframes draw { 0% { stroke-dashoffset: 1; } 100% { stroke-dashoffset: 0; } }
  .swatch { animation: blink 3.2s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .head h1::after { content: "_"; color: var(--accent); margin-left: 4px; animation: caret 1.1s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bg .gridf, .bg .scan, .swatch, .head h1::after, .card:hover .ico svg [pathLength] { animation: none !important; } .card.rv { opacity: 1; transform: none; } }

</style>

    document.title = (lang === 'tr' ? 'Araçlar' : 'Tools') + ' | erdevelop';
    document.querySelectorAll('[data-k]').forEach(el => { if (t[el.dataset.k]) el.textContent = t[el.dataset.k]; });
    $('q').placeholder = t.ph; $('langBtn').textContent = t.btn;
    const open = $('lab') ? $('lab').open : false;
    const unlocked = window.erLock && erLock.ok();
    $('groups').innerHTML = G.map((g, n) => {
      const locked = g.lock && !unlocked;
      if (locked) return `<form class="gate" id="gate" data-g data-locked autocomplete="off"><input type="password" id="pw" placeholder="password" aria-label="password"><span data-n hidden>0</span></form>`;
      return `<section class="layer${g.lock ? ' priv' : ''}" data-g>
        <div class="layer-head"><span class="swatch"></span><h2>${g.h[lang]}</h2><span class="meta">LAYER 0${n + 1} · <span data-n>${g.items.length}</span></span>
          ${g.lock ? `<button class="relock" type="button" id="relock">${t.relock}</button>` : ''}</div>
        <div class="grid">${g.items.map(card).join('')}</div>
      </section>`; }).join('') +
      `<details class="lab" id="lab" data-g ${open ? 'open' : ''}><summary><span class="swatch"></span><h2>${LAB.h[lang]}</h2><span class="meta">LAYER 0${G.length + (unlocked ? 1 : 0)} · <span data-n>${LAB.items.length}</span></span><span class="tw">${t.show}</span></summary>
        <div class="grid">${LAB.items.map(card).join('')}</div></details>`;
    filter(); animateCards();
    if ($('gate')) $('gate').addEventListener('submit', e => { e.preventDefault();
      if (erLock.check($('pw').value)) { render(); }
      else { $('pw').value = ''; const g = $('gate'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); } });
    if ($('relock')) $('relock').addEventListener('click', () => { erLock.lock(); render(); });
  }
  function filter() {
    const q = fold($('q').value.trim()), qs = q.split(/\s+/).filter(Boolean);
    let total = 0;
    document.querySelectorAll('[data-g]').forEach(sec => {
      let n = 0;
      sec.querySelectorAll('.card').forEach(c => { const ok = !qs.length || qs.every(w => c.dataset.s.includes(w)); c.hidden = !ok; if (ok) n++; });
      if (sec.hasAttribute('data-locked')) { sec.hidden = !!q; return; }
      sec.hidden = n === 0; sec.querySelector('[data-n]').textContent = n; total += n;
      if (q && n && sec.tagName === 'DETAILS') sec.open = true;
    });
    $('count').textContent = `${total} ${T[lang].items}`;
    $('empty').style.display = total ? 'none' : 'block';
  }

  // motion helpers
  let firstPaint = true;
  function animateCards() {
    document.querySelectorAll('.ico svg').forEach(svg => svg.querySelectorAll('path, rect, circle, line, polyline, polygon, ellipse').forEach(el => { if (!el.hasAttribute('stroke-dasharray')) el.setAttribute('pathLength', '1'); }));
    if (!firstPaint) return; firstPaint = false;
    const cards = [...document.querySelectorAll('#groups .layer .card')];
    cards.forEach((c, i) => { c.classList.add('rv'); c.style.setProperty('--d', Math.min(i * 0.045, 0.6) + 's'); });
    requestAnimationFrame(() => requestAnimationFrame(() => cards.forEach(c => c.classList.add('in'))));
    setTimeout(() => cards.forEach(c => { c.classList.remove('rv', 'in'); c.style.removeProperty('--d'); }), 1400);
  }
  document.addEventListener('pointermove', e => {
    const c = e.target.closest && e.target.closest('.card');
    if (c) { const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px'); }
    if (e.pointerType === 'mouse') { const g = $('glow').style; g.setProperty('--gx', e.clientX + 'px'); g.setProperty('--gy', e.clientY + 'px'); }
  }, { passive: true });
  $('q').addEventListener('input', filter);
  /* hızlı arama: Ctrl+K, / ya da doğrudan yazmaya başla · Enter ilk sonucu açar · Esc temizler */
  document.addEventListener('keydown', e => {
    const q = $('q'), inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); q.focus(); q.select(); return; }
    if (e.key === '/' && !inField) { e.preventDefault(); q.focus(); return; }
    if (!inField && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && /[\p{L}\p{N}]/u.test(e.key)) { q.focus(); return; }
  });
  $('q').addEventListener('keydown', e => {
    if (e.key === 'Escape') { $('q').value = ''; filter(); $('q').blur(); }
    if (e.key === 'Enter') { const c = [...document.querySelectorAll('.card')].find(x => !x.hidden && !x.closest('[hidden]')); if (c) { e.preventDefault(); location.href = c.getAttribute('href'); } }
    if (e.key === 'ArrowDown') { const c = [...document.querySelectorAll('.card')].find(x => !x.hidden && !x.closest('[hidden]')); if (c) { e.preventDefault(); c.focus(); } }
  });
  $('langBtn').addEventListener('click', () => { lang = lang === 'tr' ? 'en' : 'tr'; render(); });
  $('modeBtn').addEventListener('click', () => { mode = mode === 'dark' ? 'light' : 'dark'; store.set('erdevelop-mode', mode); applyMode(); });
  applyMode(); render();
})();
</script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => { }));</script>
</body>
