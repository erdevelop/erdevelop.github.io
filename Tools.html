    { id: 'facadeedu', h: { tr: 'Cephe Bilgisi', en: 'Facade Know-how' }, items: [
      { f: 'egitimler/cephe-temelleri/index.html', i: 'fcd', t: { tr: 'Cephe Tasarımının Temelleri', en: 'Facade Design Fundamentals' }, d: { tr: 'Bol şemalı 7 günlük program: giydirme cephe tipleri, profil kesitleri, cam ve ısıcam, ankraj ve yük yolu, su yalıtımı ve basınç eşitleme, hareketler, yangın durdurucu, arayüzler, proje süreci ve mockup testi.', en: 'A 7-day program full of diagrams: curtain wall types, profile sections, glass and IGUs, anchors and load paths, water tightness and pressure equalisation, movements, fire stops, interfaces, project process and mock-up testing. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/statik-temelleri/index.html', i: 'fstat', t: { tr: 'Statiğin Temelleri', en: 'Structural Basics for Facades' }, d: { tr: 'Şemalar ve çözümlü örneklerle 7 gün: kuvvet ve yük yolu, moment ve mesnetler, kesme ve moment diyagramları, atalet momenti, gerilme ve güvenlik katsayıları, sehim, cıvata ve braket, baştan sona dikme kontrolü.', en: 'Seven days of diagrams and worked examples: forces and load paths, moments and supports, shear and moment diagrams, second moment of area, stress and safety factors, deflection, bolts and brackets, a complete mullion check. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/sonlu-elemanlar/index.html', i: 'ffem', t: { tr: 'Sonlu Elemanlara Giriş', en: 'Introduction to FEM for Facades' }, d: { tr: 'Statiğin bir üst basamağı, 7 gün: K × u = F, kiriş elemanla dikme ve yakınsama, ağ ve tekillikler, camın kabuk modeli ve büyük sehim, braketin katı modeli ve von Mises, sonuç kontrol listesi, küçük bir Python FEM programı.', en: 'The next step after structural basics, seven days: K × u = F, mullions with beam elements and convergence, meshes and singularities, glass shell models and large deflection, solid bracket models and von Mises, result checklists, a small Python FEM program. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/cephe-fizigi/index.html', i: 'fphys', t: { tr: 'Cephe Fiziği Hesapları', en: 'Facade Physics Calculations' }, d: { tr: 'Şemalar ve çözümlü örneklerle 7 gün: U değeri, Ug, Uf ve ψ, Ucw (EN ISO 12631), çiğ noktası ve fRsi, g değeri ve seçicilik, rüzgâr yükü ve dikme statiği, yapısal silikon, ısıl genleşme, cam ağırlığı ve ses.', en: 'Seven days of diagrams and worked examples: U-values, Ug, Uf and psi, Ucw (EN ISO 12631), dew point and fRsi, g-value and selectivity, wind load and mullion checks, structural silicone, thermal expansion, glass weight and acoustics. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/cam-tasarimi/index.html', i: 'fglass', t: { tr: 'Cam Tasarımı ve Statiği', en: 'Glass Design and Statics' }, d: { tr: 'Şemalar ve çözümlü örneklerle 7 gün: cam türleri, yükler, gerilme ve sehim, yalıtım camında yük paylaşımı, lamine cam, kenar ve takoz detayları, kırılma ve kontrol.', en: 'Seven days of diagrams and worked examples: glass types, loads, stress and deflection, load sharing in IGUs, laminated glass, edge and setting block details, breakage and checks. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/aluminyum-profil/index.html', i: 'falu', t: { tr: 'Alüminyum Profil ve İmalat', en: 'Aluminium Profiles and Fabrication' }, d: { tr: 'Şemalarla 7 gün: alaşım ve ekstrüzyon, kesit özellikleri, yüzey işlemleri, ısı bariyeri, kesim optimizasyonu ve fire, CNC işleme, birleşim ve imalat kalite kontrolü.', en: 'Seven days with diagrams: alloys and extrusion, section properties, surface finishes, thermal breaks, cutting optimisation and scrap, CNC machining, joints and fabrication QC. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/cephe-malzemeleri/index.html', i: 'fmat', t: { tr: 'Cephe Malzemeleri', en: 'Facade Materials' }, d: { tr: 'Şemalarla 7 gün: malzeme özellikleri, alüminyum alaşımları ve temper (6060, 6063, 6082, T6, T66), yapı çeliği ve galvaniz, korozyon kategorileri, paslanmaz ve PREN, A2/A4 cıvatalar, galvanik korozyon, eloksal ve toz boya, poliamid, kompozit panel, EN 10204.', en: 'Seven days with diagrams: material properties, aluminium alloys and tempers, structural steel and galvanizing, corrosivity categories, stainless steel and PREN, A2/A4 bolts, galvanic corrosion, anodizing and powder coating, polyamide, composite panels, EN 10204. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/sac-metal/index.html', i: 'fsheet', t: { tr: 'Sac Metal ve Büküm', en: 'Sheet Metal & Bending' }, d: { tr: 'Şemalarla 7 gün: sac malzemeler ve yüzey işlemleri, K faktörü ve büküm payı, L profil ve kaset panel açınımı, abkant ve V kalıp, denizlik ve takviye detayları, SolidWorks sac levha ve DXF, deneme bükümüyle K doğrulama.', en: 'Seven days with diagrams: sheet materials and finishes, K-factor and bend allowance, flat patterns for angles and cassettes, press brakes and V-dies, sill and stiffener details, SolidWorks sheet metal and DXF, test bends. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/havalandirmali-cephe/index.html', i: 'fvent', t: { tr: 'Havalandırmalı Cephe ve Kaplama', en: 'Ventilated Facades & Cladding' }, d: { tr: 'Şemalarla 7 gün: yağmur perdesi ve havalandırma, kompozit panel, seramik, taş ve HPL kaplamalar, sabit ve kayar braketler, ısıl genleşme, sabitleme, boşluk bariyerleri, detaylar, metraj ve montaj.', en: 'Seven days with diagrams: rainscreen and ventilation, composite, ceramic, stone and HPL claddings, fixed and sliding brackets, thermal movement, fixings, cavity barriers, details, quantities and installation. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/pencere-kapi/index.html', i: 'fwin', t: { tr: 'Pencere, Kapı ve Açılır Kanatlar', en: 'Windows, Doors & Vents' }, d: { tr: 'Şemalarla 7 gün: açılım tipleri, hava, su ve rüzgâr sınıfları, Uw hesabı, donanım ve kanat ağırlığı, RC sınıfları, kaçış yolu donanımı, yangın ve duman kapıları, duman tahliye kanatları, montaj.', en: 'Seven days with diagrams: opening types, air, water and wind classes, Uw calculation, hardware and sash weight, RC classes, escape hardware, fire and smoke doors, smoke vents and installation. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/derz-sizdirmazlik/index.html', i: 'fseal', t: { tr: 'Derz ve Sızdırmazlık', en: 'Joints & Sealing' }, d: { tr: 'Şemalarla 7 gün: suyu içeri iten kuvvetler, iki savunma hattı, derz hareketi ve genişlik hesabı, mastik türleri ve fitil, EPDM contalar, yapısal silikon bite hesabı, membranlar, denizlik, uygulama ve şantiye yapışma testi.', en: 'Seven days with diagrams: forces that drive water in, two lines of defence, joint movement and width, sealant types and backer rods, EPDM gaskets, structural silicone bite, membranes, sills, application and site adhesion tests. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/cephe-metraj/index.html', i: 'fqty', t: { tr: 'Cephe Metrajı ve Maliyet', en: 'Facade Quantities and Costing' }, d: { tr: 'Şemalar ve çözümlü örneklerle 7 gün: metraj kuralları, örnek cephe metrajı, malzeme fiyatı ve fire, birim fiyat analizi, teklif ve fiyat farkı, kümülatif hakediş, maliyet takibi.', en: 'Seven days of diagrams and worked examples: take-off rules, a sample facade take-off, material prices and scrap, unit rate analysis, tenders and price escalation, cumulative progress payments, cost tracking. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/cephe-montaj/index.html', i: 'fmount', t: { tr: 'Cephe Uygulama ve Montaj', en: 'Facade Installation' }, d: { tr: 'Şemalarla 7 gün: montaj programı, rölöve ve sapma raporu, ankraj ve kimyasal dübel, stick ve unitized montaj, ITP ve şantiye su testi, silikon uygulaması, İSG ve teslim.', en: 'Seven days with diagrams: installation programme, site survey and deviation report, anchors and chemical anchoring, stick and unitised installation, ITP and site water testing, sealant application, safety and handover. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/yangin-yonetmelik/index.html', i: 'ffire', t: { tr: 'Yangın ve Yönetmelikler', en: 'Fire Safety and Regulations' }, d: { tr: 'Şemalarla 7 gün: cephede yangın yayılımı, TS EN 13501-1 sınıfları, yangın yönetmeliğinin cephe hükümleri, yangın durdurucu ve bariyerler, TS 825 (2024), EKB, CE ve uygunluk matrisi.', en: 'Seven days with diagrams: fire spread on facades, EN 13501-1 classes, Turkish fire code facade rules, fire stops and cavity barriers, TS 825 (2024), energy certificates, CE marking and a compliance matrix. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/mockup-test/index.html', i: 'ftest', t: { tr: 'Mockup ve Performans Testleri', en: 'Mock-ups & Performance Testing' }, d: { tr: 'Şemalarla 7 gün: mockup tasarımı ve test kabini, hava (A1-AE) ve su (R4-RE) sınıfları, dinamik su, rüzgâr tasarım ve güvenlik yükü, darbe, öteleme, test sırası, sızıntı kaynağı bulma ve şantiye testleri.', en: 'Seven days with diagrams: mock-up design and test chambers, air (A1-AE) and water (R4-RE) classes, dynamic water, design and safety wind loads, impact, racking, test sequences, leak tracing and site testing. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/cephe-proje-yonetimi/index.html', i: 'fpm', t: { tr: 'Cephe Proje Yönetimi', en: 'Facade Project Management' }, d: { tr: 'Şemalarla 7 gün: proje yaşam döngüsü ve RACI, iş kırılımı ve tedarik süreleri, kritik yol (CPM), onay ve numune takibi, sipariş ve S-eğrisi, sözleşme değişiklikleri ve risk, toplantı, rapor ve kapanış.', en: 'Seven days with diagrams: project life cycle and RACI, work breakdown and lead times, critical path (CPM), submittal and sample tracking, procurement and S-curves, variations and risk, meetings, reports and close-out. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/surdurulebilir-cephe/index.html', i: 'feco', t: { tr: 'Sürdürülebilir Cephe', en: 'Sustainable Facades' }, d: { tr: 'Şemalarla 7 gün: işletme ve gömülü karbon, yaşam döngüsü modülleri, EPD okumak, alüminyumun karbonu, m² başına cephe karbonu hesabı, U ve g değeri dengesi, sökülebilir tasarım, LEED, BREEAM, DGNB, YeS-TR ve şartname dili.', en: 'Seven days with diagrams: operational and embodied carbon, life-cycle modules, reading EPDs, aluminium carbon, facade carbon per m², balancing U and g values, design for disassembly, green building ratings and specification wording. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/imalat-resmi/index.html', i: 'shopdr', t: { tr: 'İmalat Resmi (Shop Drawing)', en: 'Shop Drawings' }, d: { tr: 'Bol şemalı 7 gün: pafta ve poz düzeni, ölçülendirme ve tolerans, profil işleme, cam ve panel ölçüleri, ankraj ve montaj paftaları, listeler ve revizyon.', en: '7 days with diagrams: sheets and part marks, dimensioning and tolerances, machining, glass and panel sizes, anchor and installation drawings, schedules and revisions. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/ankraj-braket/index.html', i: 'brk', t: { tr: 'Ankraj ve Braket Tasarımı', en: 'Anchors & Brackets' }, d: { tr: 'Bol şemalı 7 gün: yük yolu, sabit ve kayar mesnet, yükler ve birleşimler, ayar ve tolerans, ankraj kanalı ve dübel, braket hesabı, hareket ve deprem.', en: '7 days with diagrams: load path, fixed and sliding supports, loads and combinations, adjustment, cast-in channels and anchors, bracket checks, movement and seismic drift. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/gunes-kirici/index.html', i: 'louvre', t: { tr: 'Güneş Kırıcı ve Gölgeleme', en: 'Solar Shading' }, d: { tr: 'Bol şemalı 7 gün: g ve Fc, güneş açıları ve profil açısı, saçak ve kanat hesabı, sistem türleri, lamel tasarımı ve statik, otomasyon, batı cephesi projesi.', en: '7 days with diagrams: g-value and Fc, sun angles and profile angle, overhang and fin sizing, system types, louvre design and statics, automation, a west facade project. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
    ] },
    { id: 'code', h: { tr: 'Yazılım', en: 'Software' }, items: [
      { f: 'Code.html', i: 'code', t: { tr: 'CODE', en: 'CODE' }, d: { tr: 'Tarayıcıda 16 dilde kod yaz ve çalıştır (Python, JS, C/C++, Go, R, SQL…): çok dosyalı projeler, Excel/CSV verisi, Jupyter benzeri defter, paylaşım linki, Claude ile açıklama. Kurulum yok.', en: 'Write and run code in 16 languages in the browser (Python, JS, C/C++, Go, R, SQL…): multi-file projects, Excel/CSV data, notebooks, share links, Claude explanations. Nothing to install.' }, tag: { tr: 'yeni', en: 'new' } },
      { f: 'egitimler/programlama-temelleri/index.html', i: 'prog', t: { tr: 'Programlama Temelleri', en: 'Programming Basics' }, d: { tr: 'Hiç kod yazmamış olanlar için şemalarla 7 gün: program nedir, değişken ve tipler, koşullar, döngüler, fonksiyonlar, liste, sözlük ve dosyalar, hata ayıklama; bitiş projesi harcama takip programı. Python ile.', en: 'Seven days for absolute beginners: what a program is, variables and types, conditions, loops, functions, lists, dictionaries and files, debugging, and an expense tracker project. With Python. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/algoritmalar/index.html', i: 'algo', t: { tr: 'Algoritmalar', en: 'Algorithms' }, d: { tr: 'Şemalar ve çıktılarla 7 gün: sözde kod, Big-O, doğrusal ve ikili arama, sıralama algoritmaları, özyineleme ve memoization, açgözlü yöntem ve dinamik programlama, BFS, DFS ve Dijkstra.', en: 'Seven days with diagrams and outputs: pseudocode, Big-O, linear and binary search, sorting, recursion and memoization, greedy methods and dynamic programming, BFS, DFS and Dijkstra. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/veri-yapilari/index.html', i: 'dstr', t: { tr: 'Veri Yapıları', en: 'Data Structures' }, d: { tr: 'Şemalarla 7 gün: bellek ve diziler, bağlı liste, yığın ve kuyruk, hash tablosu, ağaçlar ve ikili arama ağacı, heap ve öncelik kuyruğu, graflar ve trie; hepsi Python ile sıfırdan.', en: 'Seven days with diagrams: memory and arrays, linked lists, stacks and queues, hash tables, trees and BSTs, heaps and priority queues, graphs and tries, all built from scratch in Python. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/bilgi-teknolojileri/index.html', i: 'chip', t: { tr: 'Bilgi Teknolojileri', en: 'Information Technology' }, d: { tr: 'Şemalarla 7 gün: bilgisayarın parçaları, bit ve bayt, ikilik sayılar, UTF-8 ve Türkçe karakter sorunları, işletim sistemi ve komut satırı, lisanslar, 3-2-1 yedek, internet ve bulut, sorun giderme.', en: 'Seven days with diagrams: computer parts, bits and bytes, binary, UTF-8 and Turkish character issues, operating systems and the command line, licences, 3-2-1 backups, the internet and cloud, troubleshooting. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/bilgisayar-aglari/index.html', i: 'netw', t: { tr: 'Bilgisayar Ağları', en: 'Computer Networks' }, d: { tr: 'Şemalarla 7 gün: OSI ve TCP/IP, Ethernet, Wi-Fi ve MAC, IP ve alt ağ hesabı, NAT, TCP ve UDP, DNS, DHCP, HTTP, ev ve ofis ağı kurma, ping ve tracert, güvenlik duvarı, VPN ve Wireshark.', en: 'Seven days with diagrams: OSI and TCP/IP, Ethernet, Wi-Fi and MAC, IP and subnetting, NAT, TCP and UDP, DNS, DHCP, HTTP, home and office networks, ping and tracert, firewalls, VPNs and Wireshark. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/autolisp/index.html', i: 'lisp', t: { tr: 'AutoLISP Eğitimi', en: 'AutoLISP Course' }, d: { tr: 'AutoCAD kullanıcıları için 7 günlük yoğun AutoLISP: ilk komut, kullanıcı girdisi, döngüler ve listeler, seçim ve entget, ActiveX ile blok nitelikleri, hata yönetimi ve CSV, ekibe dağıtılan bir Cephe Kiti.', en: 'A 7-day intensive AutoLISP course for AutoCAD users: first commands, user input, loops and lists, selection sets and entget, block attributes via ActiveX, error handling and CSV, and a facade toolkit you deploy to your team. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/python-masaustu/index.html', i: 'pydesk', t: { tr: 'Python ile Masaüstü Programı', en: 'Desktop Apps with Python' }, d: { tr: 'Çalışan bir Cam Listesi programıyla 7 gün: katmanlı mimari ve test, tkinter ve Treeview, SQLite, ezdxf ile DXF okuma ve yazma, Excel ve PDF rapor, hata kaydı ve PyInstaller ile exe.', en: 'Seven days building a working glass list app: layered architecture and tests, tkinter and Treeview, SQLite, reading and writing DXF with ezdxf, Excel and PDF reports, logging and a PyInstaller exe. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/solidworks-vba/index.html', i: 'vba', t: { tr: 'SolidWorks VBA Eğitimi', en: 'SolidWorks VBA Course' }, d: { tr: 'SolidWorks kullanıcıları için 7 günlük yoğun makro programı: VBA editörü, nesne modeli, özel özellikler, ölçü tablosundan parça ailesi, makroyla plaka modelleme, montaj metrajı, toplu PDF, kullanıcı formu ve makro kiti.', en: 'A 7-day intensive macro course for SolidWorks users: the VBA editor, object model, custom properties, part families from a size table, modeling a plate by macro, assembly quantities, batch PDF export, user forms and a macro toolkit. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/excel-vba/index.html', i: 'xlvba', t: { tr: 'Excel VBA Eğitimi', en: 'Excel VBA Course' }, d: { tr: 'Excel kullanıcıları için 7 günlük yoğun makro programı: kaydedici ve editör, Range ve hücreler, dizilerle hızlı metraj, özel formüller, dosya birleştirme ve metraj-sipariş karşılaştırması, olaylar, giriş formu, PDF/CSV ve eklenti.', en: 'A 7-day intensive macro course for Excel users: recorder and editor, ranges and cells, fast quantity summaries with arrays, custom functions, merging files and quantity vs order checks, events, entry forms, PDF/CSV output and add-ins. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/excel-ileri/index.html', i: 'xl2', t: { tr: 'Excel İleri (Makrosuz)', en: 'Advanced Excel (No Macros)' }, d: { tr: 'Örnek cephe dosyasıyla 7 gün: tablolar ve ÇAPRAZARA, dinamik diziler (FİLTRE, BENZERSİZ, SIRALA), LET, LAMBDA ile kendi fonksiyonların, Power Query ile veri temizleme ve klasör birleştirme, özet tablo ve tek sayfa rapor.', en: 'Seven days with a sample facade workbook: tables and XLOOKUP, dynamic arrays, LET, LAMBDA custom functions, Power Query cleaning and folder merges, pivot tables and a one-page report. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/rhino-csharp/index.html', i: 'csharp', t: { tr: 'Rhino ve Grasshopper için C#', en: 'C# for Rhino & Grasshopper' }, d: { tr: 'Cephe tasarımcıları için 7 günlük yoğun C#: RhinoCommon geometrisi, Grasshopper C# Script, veri ağaçları, düzlemsellik ve ankraj kontrolleri, Visual Studio ile kendi .gha bileşenin, Rhino komutu ve Package Manager ile dağıtım.', en: 'A 7-day intensive C# course for facade designers: RhinoCommon geometry, the Grasshopper C# Script component, data trees, planarity and anchor checks, your own .gha components in Visual Studio, a Rhino command and distribution via Package Manager. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/web-araclari/index.html', i: 'web', t: { tr: 'Web Araçları (HTML, CSS, JS)', en: 'Web Tools (HTML, CSS, JS)' }, d: { tr: 'Şemalarla 7 gün: HTML formları, CSS grid ve koyu tema, JavaScript ile hesap, olaylar, localStorage, CSV ve paylaşılabilir bağlantı, SVG çizim, yazdırma, GitHub Pages ve PWA; tek dosyalık bir Cam Ağırlığı aracıyla.', en: 'Seven days with diagrams: HTML forms, CSS grid and dark mode, calculations in JavaScript, events, localStorage, CSV and shareable links, SVG drawings, printing, GitHub Pages and PWAs, built around a single-file glass weight tool. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/internet-programciligi/index.html', i: 'globe', t: { tr: 'İnternet Programcılığı', en: 'Web Programming' }, d: { tr: 'Şemalarla 7 gün: HTTP, HTML ve CSS, JavaScript ve fetch, Python Flask, SQLite ve REST API, oturum, parola hash ve web güvenliği, yayına alma; bitiş projesi not defteri uygulaması.', en: 'Seven days with diagrams: HTTP, HTML and CSS, JavaScript and fetch, Python Flask, SQLite and REST APIs, sessions, password hashing and web security, deployment, and a notes app project. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/git-github-pages/index.html', i: 'git', t: { tr: 'Git ve GitHub Pages', en: 'Git & GitHub Pages' }, d: { tr: 'Şemalarla kısa 4 gün: commit ve geçmiş, .gitignore, push ve pull, dallar ve çakışma, GitHub Pages ile yayım, alan adı ve önbellek, hatalardan dönmek ve güvenli ortak çalışma.', en: 'A short four days with diagrams: commits and history, .gitignore, push and pull, branches and conflicts, publishing with GitHub Pages, custom domains and caching, undoing mistakes and safe collaboration. In Turkish.' }, tag: { tr: '4 gün', en: '4 days' } },
      { f: 'egitimler/sql-veri/index.html', i: 'sql', t: { tr: 'SQL ve Veri', en: 'SQL & Data' }, d: { tr: 'Şemalar ve gerçek sorgu sonuçlarıyla 7 gün: SQLite ve tablolar, SELECT, GROUP BY, JOIN, kısıtlar ve işlemler, pencere fonksiyonlarıyla hakediş, Python ve Excel raporu; örnek cephe veritabanıyla.', en: 'Seven days with diagrams and real query results: SQLite and tables, SELECT, GROUP BY, JOIN, constraints and transactions, window functions for progress payments, Python and Excel reports, using a sample facade database. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/yapay-zeka/index.html', i: 'aibot', t: { tr: 'Yapay Zekâ ile Çalışmak', en: 'Working with AI' }, d: { tr: '7 günde güvenli ve verimli yapay zekâ kullanımı: dil modelleri nasıl çalışır, uydurma riski, iyi komut yazmak, şartname özetleme ve doğrulama, kod ürettirip test etmek, hesap kontrolü, gizlilik ve sorumluluk, komut kütüphanesi.', en: 'Safe and effective AI use in seven days: how language models work, hallucination, good prompts, summarising and checking specifications, generating and testing code, checking calculations, privacy and responsibility, prompt libraries. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/siber-guvenlik/index.html', i: 'shield', t: { tr: 'Siber Güvenlik', en: 'Cybersecurity' }, d: { tr: 'Savunma odaklı 7 gün: risk ve CIA, parolalar ve iki adımlı doğrulama, oltalamayı tanımak, şifreleme ve sertifikalar, cihaz ve ağ güvenliği, OWASP ve web açıkları, fidye yazılımı, yedek, olay müdahalesi ve KVKK.', en: 'Seven defensive days: risk and the CIA triad, passwords and 2FA, spotting phishing, encryption and certificates, device and network security, OWASP and web flaws, ransomware, backups, incident response and data protection law. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/linux-komut-satiri/index.html', i: 'lnx', t: { tr: 'Linux ve Komut Satırı', en: 'Linux & the Command Line' }, d: { tr: 'Bol şemalı 7 gün: dosya sistemi, grep, sed, awk ve borular, izinler, süreçler, bash betikleri, ssh, cron ve log analizi projesi. Her komutun gerçek çıktısı.', en: '7 illustrated days: file system, grep, sed, awk and pipes, permissions, processes, bash scripts, ssh, cron and a log analysis project. Real output for every command.' } },
      { f: 'egitimler/python-veri-analizi/index.html', i: 'pdx', t: { tr: 'Python ile Veri Analizi (pandas)', en: 'Data Analysis with Python (pandas)' }, d: { tr: 'Bol şemalı 7 gün: DataFrame, Türkçe CSV okuma, temizlik, groupby ve pivot, merge, zaman serileri, grafik ve çok sayfalı Excel maliyet raporu projesi.', en: '7 illustrated days: DataFrames, reading Turkish CSVs, cleaning, groupby and pivot, merge, time series, charts and a multi-sheet Excel cost report project.' } },
      { f: 'egitimler/docker/index.html', i: 'dkr', t: { tr: 'Docker', en: 'Docker' }, d: { tr: 'Bol şemalı 7 gün: imaj ve kapsayıcı, Dockerfile, katmanlar, volume, ağlar, Docker Compose, root olmayan kullanıcı ve iki servisli sipariş projesi. Komutlar çıktılarıyla.', en: '7 illustrated days: images and containers, Dockerfile, layers, volumes, networks, Docker Compose, non-root users and a two-service order project. Commands with output.' } },
      { f: 'egitimler/react/index.html', i: 'rct', t: { tr: 'React', en: 'React' }, d: { tr: 'Bol şemalı 7 gün: modern JavaScript, JSX, props, state, formlar, useEffect ile veri çekme, useReducer ve Context; cephe paneli takip uygulaması projesi.', en: '7 illustrated days: modern JavaScript, JSX, props, state, forms, data fetching with useEffect, useReducer and Context; a facade panel tracker project.' } },
      { f: 'egitimler/makine-ogrenmesi/index.html', i: 'mlr', t: { tr: 'Makine Öğrenmesine Giriş', en: 'Introduction to Machine Learning' }, d: { tr: 'Bol şemalı 7 gün: scikit-learn, Pipeline, regresyon, sınıflandırma, karar ağaçları ve rastgele orman, çapraz doğrulama, kümeleme ve üretim süresi tahmin projesi.', en: '7 illustrated days: scikit-learn, pipelines, regression, classification, decision trees and random forests, cross-validation, clustering and a production time prediction project.' } },
    ] },

    { id: 'plang', h: { tr: 'Programlama Dilleri', en: 'Programming Languages' }, items: [

      { f: 'egitimler/java/index.html', i: 'ljava', t: { tr: 'Java Programlama', en: 'Java Programming' }, d: { tr: 'Bol şemalı 7 gün: JDK 21, tipler, metotlar, ArrayList ve HashMap, Stream API, sınıflar, kalıtım, arayüzler, record ve istisnalar.', en: '7 days with diagrams: JDK 21, types, methods, ArrayList and HashMap, Stream API, classes, inheritance, interfaces, records and exceptions. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
{ f: 'egitimler/python/index.html', i: 'py', t: { tr: 'Python Eğitimi', en: 'Python Course' }, d: { tr: 'Tasarımcılar için 7 günlük yoğun Python: temel söz dizimi, CSV ve Excel, pandas ile metraj ve sipariş karşılaştırması, DXF okuyup panel numaralama, pencereli araç, Rhino 8 ve Grasshopper otomasyonu.', en: 'A 7-day intensive Python course for designers: core syntax, CSV and Excel, quantity vs order checks with pandas, reading DXF and numbering panels, a desktop tool, and Rhino 8 / Grasshopper automation. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/javascript-typescript/index.html', i: 'ljs', t: { tr: 'JavaScript ve TypeScript', en: 'JavaScript & TypeScript' }, d: { tr: 'Bol şemalı 7 gün: Node.js, tipler, fonksiyonlar, diziler ve nesneler, sınıflar, Promise ve async/await, sonra TypeScript ile tipler.', en: '7 days with diagrams: Node.js, types, functions, arrays and objects, classes, promises and async/await, then typing it with TypeScript. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },
      { f: 'egitimler/go/index.html', i: 'lgo', t: { tr: 'Go Programlama', en: 'Go Programming' }, d: { tr: 'Bol şemalı 7 gün: tipler, for ve switch, çoklu dönüş ve error değerleri, slice ve map, struct, interface, goroutine ve channel.', en: '7 days with diagrams: types, for and switch, multiple returns and error values, slices and maps, structs, interfaces, goroutines and channels. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },

      { f: 'egitimler/kotlin/index.html', i: 'lkt', t: { tr: 'Kotlin Programlama', en: 'Kotlin Programming' }, d: { tr: 'Bol şemalı 7 gün: null güvenliği, when, lambda ve eklenti fonksiyonları, koleksiyon işlemleri, data class, sealed class, coroutine.', en: '7 days with diagrams: null safety, when, lambdas and extension functions, collection operations, data classes, sealed classes, coroutines. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },

    { id: 'edu', h: { tr: 'Eğitimler', en: 'Courses' }, items: [
      { f: 'egitimler/teknik-resim/index.html', i: 'draft', t: { tr: 'Teknik Resim', en: 'Technical Drawing' }, d: { tr: 'Bol şemalı 7 günlük temel program: kâğıt, antet ve çizgiler, birinci ve üçüncü açı izdüşüm, kesitler, ölçülendirme, tolerans ve alıştırmalar, geometrik tolerans, montaj resmi, mimari ve cephe çizimleri, revizyon.', en: 'A 7-day fundamentals program full of diagrams: sheets, title blocks and line types, first and third angle projection, sections, dimensioning, tolerances and fits, geometric tolerancing, assembly drawings, architectural and facade drawings, revisions. In Turkish.' }, tag: { tr: '7 gün', en: '7 days' } },

      if (locked) return `<form class="gate" id="gate" data-g data-locked autocomplete="off"><input type="password" id="pw" placeholder="password" aria-label="password"><span data-n hidden>0</span></form>`;
      return `<details class="layer${g.lock ? ' priv' : ''}" data-g data-id="${g.id}" id="${g.id}" ${OPEN[g.id] ? 'open' : ''}>
        <summary class="layer-head"><span class="swatch"></span><h2>${g.h[lang]}</h2><span class="meta">LAYER ${String(n + 1).padStart(2, '0')} · <span data-n>${g.items.length}</span></span>
          <span class="tw" data-a="${t.hide}" data-b="${t.show}"></span>
          ${g.lock ? `<button class="relock" type="button" id="relock">${t.relock}</button>` : ''}</summary>
        <div class="grid">${g.items.map(card).join('')}</div>
      </details>`; }).join('') +
      `<details class="lab" id="lab" data-g data-id="lab" ${OPEN.lab ? 'open' : ''}><summary><span class="swatch"></span><h2>${LAB.h[lang]}</h2><span class="meta">LAYER ${String(G.length + 1).padStart(2, '0')} · <span data-n>${LAB.items.length}</span></span><span class="tw" data-a="${t.hide}" data-b="${t.show}"></span></summary>
        <p class="lab-d">${LAB.d[lang]}</p><div class="grid">${LAB.items.map(card).join('')}</div></details>`;
    document.querySelectorAll('#groups details[data-id]').forEach(d => d.addEventListener('toggle', () => { if (!searching) saveOpen(); tglLabel(); }));
    $('tglAll').onclick = () => { const ds = [...document.querySelectorAll('#groups details[data-id]')], any = ds.some(d => !d.open); ds.forEach(d => d.open = any); saveOpen(); tglLabel(); };
    const fi = FEAT.map(findItem).filter(Boolean);
    $('feat').innerHTML = `<div class="layer-head"><span class="swatch"></span><h2>${t.featH}</h2><span class="meta">${fi.length}</span></div><div class="grid">${fi.map(card).join('')}</div>`;
    const gc = id => (G.find(g => g.id === id) || { items: [] }).items.length;
    const box = (id, ic, h, d, n) => `<a class="card big" href="#${id}" data-open="${id}"><span class="ico"><svg viewBox="0 0 32 32" aria-hidden="true">${ICON[ic]}</svg></span><h3>${h}</h3><p>${d}</p><span class="file">${n} <b>${t.open2}</b></span></a>`;
    $('learn').innerHTML = `<div class="layer-head"><span class="swatch"></span><h2>${t.learnH}</h2></div><div class="grid">${box('edu', 'edu', t.eduT, t.eduD, gc('edu') + ' ' + t.courses)}${box('plang', 'prog', t.plangT, t.plangD, gc('plang') + ' ' + t.courses)}${box('lang', 'chat', t.langT, t.langD, gc('lang'))}</div>`;
    document.querySelectorAll('#learn [data-open]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); history.replaceState(null, '', '#' + a.dataset.open); openHash(); }));
    filter(); animateCards(); tglLabel();
    if ($('gate')) $('gate').addEventListener('submit', e => { e.preventDefault();
      if (erLock.check($('pw').value)) { render(); }
      else { $('pw').value = ''; const g = $('gate'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake'); } });
    if ($('relock')) $('relock').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); erLock.lock(); render(); });
  }
  /* hangi grubun açık olduğu bu tarayıcıda hatırlanır; ilk ziyarette hepsi kapalı başlar (başlık listesi gibi) */
  const OK = 'erdevelop-tools-acik';
  let searching = false;
  function openState() { try { return JSON.parse(localStorage.getItem(OK) || '{}') || {}; } catch (e) { return {}; } }
  function saveOpen() { const o = {}; document.querySelectorAll('#groups details[data-id]').forEach(d => { if (d.open) o[d.dataset.id] = 1; }); try { localStorage.setItem(OK, JSON.stringify(o)); } catch (e) { } }
  function tglLabel() { const ds = [...document.querySelectorAll('#groups details[data-id]')]; if ($('tglAll')) $('tglAll').textContent = ds.some(d => !d.open) ? T[lang].all : T[lang].none2; }
  function openHash() { const id = decodeURIComponent(location.hash.slice(1)); const d = id && document.querySelector(`#groups details[data-id="${CSS.escape(id)}"]`); if (d) { d.open = true; saveOpen(); tglLabel(); setTimeout(() => d.scrollIntoView({ block: 'start' }), 50); } }
  addEventListener('hashchange', openHash);
  function filter() {
    const q = fold($('q').value.trim()), qs = q.split(/\s+/).filter(Boolean);
    let total = 0;
    document.querySelectorAll('[data-g]').forEach(sec => {
      let n = 0;
      sec.querySelectorAll('.card').forEach(c => { const ok = !qs.length || qs.every(w => c.dataset.s.includes(w)); c.hidden = !ok; if (ok) n++; });
      if (sec.hasAttribute('data-locked')) { sec.hidden = !!q; return; }
      sec.hidden = n === 0; sec.querySelector('[data-n]').textContent = n; total += n;
      if (sec.tagName === 'DETAILS') { if (q) { if (n) sec.open = true; } else if (searching) sec.open = !!openState()[sec.dataset.id]; }
    });
    $('feat').hidden = $('learn').hidden = !!q;
    searching = !!q; tglLabel();
    $('count').textContent = `${total} ${T[lang].items}`;
    $('empty').style.display = total ? 'none' : 'block';
  }

  // motion helpers
  let firstPaint = true;
  function animateCards() {
    document.querySelectorAll('.ico svg').forEach(svg => svg.querySelectorAll('path, rect, circle, line, polyline, polygon, ellipse').forEach(el => { if (!el.hasAttribute('stroke-dasharray')) el.setAttribute('pathLength', '1'); }));
    if (!firstPaint) return; firstPaint = false;
    const cards = [...document.querySelectorAll('#groups .layer .card')];
    cards.forEach((c, i) => { c.classList.add('rv'); c.style.setProperty('--d', Math.min(i * 0.045, 0.6) + 's'); });
    requestAnimationFrame(() => requestAnimationFrame(() => cards.forEach(c => c.classList.add('in'))));
    setTimeout(() => cards.forEach(c => { c.classList.remove('rv', 'in'); c.style.removeProperty('--d'); }), 1400);
  }
  document.addEventListener('pointermove', e => {
    const c = e.target.closest && e.target.closest('.card');
    if (c) { const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px'); }
    if (e.pointerType === 'mouse') { const g = $('glow').style; g.setProperty('--gx', e.clientX + 'px'); g.setProperty('--gy', e.clientY + 'px'); }
  }, { passive: true });
  $('q').addEventListener('input', filter);
  /* hızlı arama: Ctrl+K, / ya da doğrudan yazmaya başla · Enter ilk sonucu açar · Esc temizler */
  document.addEventListener('keydown', e => {
    const q = $('q'), inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); q.focus(); q.select(); return; }
    if (e.key === '/' && !inField) { e.preventDefault(); q.focus(); return; }
    if (!inField && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey && /[\p{L}\p{N}]/u.test(e.key)) { q.focus(); return; }
  });
  $('q').addEventListener('keydown', e => {
    if (e.key === 'Escape') { $('q').value = ''; filter(); $('q').blur(); }
    if (e.key === 'Enter') { const c = [...document.querySelectorAll('.card')].find(x => !x.hidden && !x.closest('[hidden]')); if (c) { e.preventDefault(); location.href = c.getAttribute('href'); } }
    if (e.key === 'ArrowDown') { const c = [...document.querySelectorAll('.card')].find(x => !x.hidden && !x.closest('[hidden]')); if (c) { e.preventDefault(); c.focus(); } }
  });
  $('langBtn').addEventListener('click', () => { lang = lang === 'tr' ? 'en' : 'tr'; render(); });
  $('modeBtn').addEventListener('click', () => { mode = mode === 'dark' ? 'light' : 'dark'; store.set('erdevelop-mode', mode); store.set('erdevelop-mode-gun', new Date().toDateString()); applyMode(); });
  applyMode(); render(); openHash();
})();
</script>
