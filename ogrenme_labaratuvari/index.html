<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Öğrenme Laboratuvarı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Yerleşim: üstte ad + sekme şeridi; her sekmede solda sahne (tuvaller), sağda kontrol paneli, altta açıklama */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --sunk:#eaeef2; --ink:#1b2530; --muted:#5b6876; --line:#d9e0e7;
  --accent:#0d7a78; --accent-ink:#ffffff; --accent-soft:#d8eeec;
  --orange:#e07b32; --blue:#3672c9; --good:#2e8b57; --bad:#c4453c;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171c; --surface:#192128; --sunk:#141b21; --ink:#e4eaef; --muted:#93a1ae; --line:#2b3540;
  --accent:#3bb3ad; --accent-ink:#0b1416; --accent-soft:#1d3b3b;
  --orange:#ec9150; --blue:#5b93e3; --good:#4cb37a; --bad:#e2675e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171c; --surface:#192128; --sunk:#141b21; --ink:#e4eaef; --muted:#93a1ae; --line:#2b3540;
  --accent:#3bb3ad; --accent-ink:#0b1416; --accent-soft:#1d3b3b;
  --orange:#ec9150; --blue:#5b93e3; --good:#4cb37a; --bad:#e2675e; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:1320px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:14px}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3vw,32px);letter-spacing:-.01em;margin:0;line-height:1.1}
header.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
nav.tabs button{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;
  padding:8px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;min-width:0}
nav.tabs button b{font-family:var(--f-display);font-weight:600;font-size:15px}
nav.tabs button small{color:var(--muted);font-size:12px}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs button[aria-selected="true"] small{color:var(--accent-ink);opacity:.85}
nav.tabs button:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
@media (max-width:900px){.lab{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.row>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:600;font-size:15px;margin:0 0 2px}
.card .sub{color:var(--muted);font-size:12px;margin:0 0 8px}
canvas{display:block;width:100%;height:auto;max-width:100%;border-radius:6px;background:var(--surface);touch-action:none}
canvas.framed{border:1px solid var(--line)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.group{display:flex;flex-direction:column;gap:8px}
.group h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.field{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:13px}
.field output{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.field input[type=range],.field select{grid-column:1/-1;width:100%}
select{font:inherit;font-size:13px;padding:5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
input[type=range]{accent-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:7px;padding:8px 10px;cursor:pointer;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);grid-column:1/-1}
.btn.wide{grid-column:1/-1}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.stat span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--f-mono);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.explain{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px;max-width:none;min-height:3.2em}
.explain b{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.dots i{width:10px;height:10px;border-radius:50%}
.note{font-size:12px;color:var(--muted);margin:0}
.digits{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.digits .btn{padding:6px 0;font-family:var(--f-mono)}
table.race{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.race td{padding:3px 4px;border-bottom:1px solid var(--line)}
table.race td:last-child{text-align:right;font-family:var(--f-mono)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg .btn{padding:5px 9px;font-weight:500}
.savebar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:-6px 0 14px}
.savebar .btn{padding:5px 10px;font-weight:500;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.w-main{flex:1 1 440px;max-width:560px}
.w-side{flex:1 1 300px}
.w-full{flex:1 1 100%}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap" lang="tr">
<header class="top">
  <div>
    <h1>Öğrenme Laboratuvarı</h1>
    <p>Makine öğrenmesinin on bir farklı yüzü ve cephe tasarımından beş uygulama. Her sekmede bir model sıfırdan öğreniyor; sen ayarlarla oynayıp öğrenmenin nasıl ilerlediğini izliyorsun.</p>
  </div>
</header>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="siniflandirma"><b>Sınıflandırma</b><small>Sinir ağı sınır çiziyor</small></button>
  <button role="tab" data-tab="gradyan"><b>Gradyan İnişi</b><small>Optimizasyon yarışı</small></button>
  <button role="tab" data-tab="kume"><b>Kümeleme</b><small>Etiketsiz gruplama</small></button>
  <button role="tab" data-tab="rakam"><b>Rakam Tanıma</b><small>Çiz, ağ tanısın</small></button>
  <button role="tab" data-tab="cnn"><b>Görüntü Tanıma</b><small>Evrişimli ağ (CNN)</small></button>
  <button role="tab" data-tab="kamera"><b>Kamera ile Tanıma</b><small>Göster, tahmin etsin</small></button>
  <button role="tab" data-tab="agac"><b>Karar Ağacı</b><small>Soru sora sora bölmek</small></button>
  <button role="tab" data-tab="dil"><b>Mini Dil Modeli</b><small>Harf harf yazmayı öğrenir</small></button>
  <button role="tab" data-tab="araba"><b>Araba Sürme</b><small>Evrimle öğrenme</small></button>
  <button role="tab" data-tab="ajan"><b>Oyun Ajanı</b><small>Ödül ve ceza ile öğrenme</small></button>
  <button role="tab" data-tab="yilan"><b>Yılan</b><small>Derin Q-ağı</small></button>
  <button role="tab" data-tab="cephe"><b>Cephe Atölyesi</b><small>İşe yakın 5 örnek</small></button>
</nav>
<div class="savebar" id="savebar">
  <span class="note" style="font-weight:700;color:var(--ink)">Bu sekmenin modeli ve ayarları:</span>
  <button class="btn" id="sv-save">Tarayıcıya kaydet</button><button class="btn" id="sv-load">Kayıttan yükle</button>
  <button class="btn" id="sv-down">Dosyaya indir</button><button class="btn" id="sv-open">Dosyadan aç</button>
  <input type="file" id="sv-file" accept=".json,application/json" hidden>
  <span class="note" id="sv-msg"></span>
</div>
<main>
  <section class="tab" id="tab-siniflandirma" hidden></section>
  <section class="tab" id="tab-gradyan" hidden></section>
  <section class="tab" id="tab-kume" hidden></section>
  <section class="tab" id="tab-rakam" hidden></section>
  <section class="tab" id="tab-cnn" hidden></section>
  <section class="tab" id="tab-kamera" hidden></section>
  <section class="tab" id="tab-agac" hidden></section>
  <section class="tab" id="tab-dil" hidden></section>
  <section class="tab" id="tab-araba" hidden></section>
  <section class="tab" id="tab-ajan" hidden></section>
  <section class="tab" id="tab-yilan" hidden></section>
  <section class="tab" id="tab-cephe" hidden></section>
</main>
</div>
<script>
// ===================================================================== ortak araçlar
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
function gauss() {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const fmt = (v, d = 3) => (v == null || !isFinite(v) ? "–" : v.toFixed(d));
const pct = (v) => (v == null || !isFinite(v) ? "–" : "%" + Math.round(v * 100));

// ---------------------------------------------------------------- tema renkleri
function hexRGB(h) {
  h = h.trim().replace("#", "");
  if (h.length === 3) h = h.split("").map((c) => c + c).join("");
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const mix = (a, b, k) => [0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * k));
const rgbStr = (c, a = 1) => (a === 1 ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${a})`);

const Theme = {
  c: {}, rgb: {}, div: [], divStr: [],
  refresh() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ["bg", "surface", "sunk", "ink", "muted", "line", "accent", "orange", "blue", "good", "bad"]) {
      this.c[k] = cs.getPropertyValue("--" + k).trim() || "#888888";
      this.rgb[k] = hexRGB(this.c[k]);
    }
    // ıraksak palet: 0 = mavi, 0.5 = zemin, 1 = turuncu (yumuşatılmış)
    const dark = (this.rgb.surface[0] + this.rgb.surface[1] + this.rgb.surface[2]) / 3 < 100, k = dark ? 0.4 : 0.58;
    const s = this.rgb.surface, o = mix(s, this.rgb.orange, k), b = mix(s, this.rgb.blue, k);
    this.div = []; this.divStr = [];
    for (let i = 0; i <= 255; i++) {
      const p = i / 255;
      const c = p < 0.5 ? mix(b, s, p / 0.5) : mix(s, o, (p - 0.5) / 0.5);
      this.div.push(c); this.divStr.push(rgbStr(c));
    }
    // güçlü ıraksak palet (ağırlık resimleri için)
    const o2 = this.rgb.orange, b2 = this.rgb.blue;
    this.divS = [];
    for (let i = 0; i <= 255; i++) {
      const p = i / 255;
      this.divS.push(p < 0.5 ? mix(b2, s, p / 0.5) : mix(s, o2, (p - 0.5) / 0.5));
    }
  },
  d(p) { return this.div[p !== p ? 128 : Math.round(clamp(p, 0, 1) * 255)]; },
  ds(p) { return this.divStr[p !== p ? 128 : Math.round(clamp(p, 0, 1) * 255)]; },
  dS(p) { return this.divS[p !== p ? 128 : Math.round(clamp(p, 0, 1) * 255)]; },
};

// ---------------------------------------------------------------- tuval yardımcıları
function setupCanvas(cv, w, h) {
  const d = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * d); cv.height = Math.round(h * d);
  cv.style.aspectRatio = w + " / " + h;
  cv._w = w; cv._h = h;
  const ctx = cv.getContext("2d");
  ctx.setTransform(d, 0, 0, d, 0, 0);
  return ctx;
}
function canvasPos(cv, e) {
  const r = cv.getBoundingClientRect();
  return [((e.clientX - r.left) * cv._w) / r.width, ((e.clientY - r.top) * cv._h) / r.height];
}
function offscreen(w, h, read) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  return [c, c.getContext("2d", read ? { willReadFrequently: true } : undefined)];
}

// Basit çizgi grafiği
function drawChart(cv, ctx, series, o = {}) {
  const W = cv._w, H = cv._h, L = o.left ?? 42, R = 10, T = 10, B = 22;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = Theme.c.surface; ctx.fillRect(0, 0, W, H);
  let n = 0, mx = -Infinity, mn = Infinity;
  for (const s of series) {
    n = Math.max(n, s.data.length);
    for (const v of s.data) if (v != null && isFinite(v)) { mx = Math.max(mx, v); mn = Math.min(mn, v); }
  }
  let ymin = o.ymin ?? Math.min(0, mn), ymax = o.ymax ?? mx;
  if (o.ycap != null) ymax = Math.min(ymax, o.ycap);
  if (!isFinite(ymax) || ymax <= ymin) ymax = ymin + 1;
  ctx.font = "10px " + getComputedStyle(document.body).getPropertyValue("--f-mono");
  ctx.textBaseline = "middle";
  for (let k = 0; k <= 4; k++) {
    const y = T + ((H - T - B) * k) / 4, v = ymax - ((ymax - ymin) * k) / 4;
    ctx.strokeStyle = Theme.c.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke();
    ctx.fillStyle = Theme.c.muted; ctx.textAlign = "right";
    ctx.fillText(o.yfmt ? o.yfmt(v) : (Math.abs(v) >= 10 ? v.toFixed(0) : v.toFixed(2)), L - 5, y);
  }
  ctx.textAlign = "left"; ctx.fillText("0", L, H - 9);
  ctx.textAlign = "right"; ctx.fillText(o.xlabel ? `${o.xlabel} ${Math.max(0, n - 1)}` : String(Math.max(0, n - 1)), W - R, H - 9);
  if (n === 0) {
    ctx.textAlign = "center"; ctx.fillText(o.empty || "Henüz veri yok", W / 2, H / 2);
    return;
  }
  for (const s of series) {
    const d = s.data; if (!d.length) continue;
    const step = Math.max(1, Math.floor(d.length / (W - L)));
    ctx.beginPath(); let started = false;
    for (let i = 0; i < d.length; i += step) {
      const v = d[i]; if (v == null || !isFinite(v)) { started = false; continue; }
      const x = L + (i / Math.max(n - 1, 1)) * (W - L - R);
      const y = T + (1 - (clamp(v, ymin, ymax) - ymin) / (ymax - ymin)) * (H - T - B);
      if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width || 2; ctx.setLineDash(s.dash || []);
    ctx.globalAlpha = s.alpha ?? 1; ctx.stroke(); ctx.globalAlpha = 1; ctx.setLineDash([]);
  }
}

// Ağ şeması: düğümler (küçük resim veya aktivasyon dairesi) ve ağırlık çizgileri
function drawNet(ctx, box, sizes, W, opt = {}) {
  const { x, y, w, h } = box, ns = sizes.length;
  const node = opt.node || 26, gap = opt.gap || 6;
  const pos = [];
  for (let l = 0; l < ns; l++) {
    const n = sizes[l];
    const cx = x + (ns === 1 ? w / 2 : (l * (w - node)) / (ns - 1));
    const tot = n * node + (n - 1) * gap, y0 = y + (h - tot) / 2;
    const col = [];
    for (let k = 0; k < n; k++) col.push([cx, y0 + k * (node + gap)]);
    pos.push(col);
  }
  for (let l = 0; l < ns - 1; l++) {
    const ni = sizes[l], Wl = W[l];
    for (let j = 0; j < sizes[l + 1]; j++) for (let i = 0; i < ni; i++) {
      const wv = Wl[j * ni + i];
      const [xa, ya] = pos[l][i], [xb, yb] = pos[l + 1][j];
      ctx.strokeStyle = wv > 0 ? Theme.c.orange : Theme.c.blue;
      ctx.globalAlpha = clamp(0.15 + Math.abs(wv) * 0.35, 0.15, 0.9);
      ctx.lineWidth = clamp(Math.abs(wv) * 1.4, 0.4, 5);
      ctx.beginPath(); ctx.moveTo(xa + node, ya + node / 2); ctx.lineTo(xb, yb + node / 2); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  for (let l = 0; l < ns; l++) for (let k = 0; k < sizes[l]; k++) {
    const [nx, ny] = pos[l][k];
    if (opt.thumb) opt.thumb(l, k, nx, ny, node);
    else {
      const a = opt.act ? opt.act[l][k] : 0;
      ctx.fillStyle = Theme.ds((a + 1) / 2);
      ctx.beginPath(); ctx.arc(nx + node / 2, ny + node / 2, node / 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = opt.hover && opt.hover[0] === l && opt.hover[1] === k ? Theme.c.ink : Theme.c.muted;
    ctx.lineWidth = opt.hover && opt.hover[0] === l && opt.hover[1] === k ? 2 : 1;
    if (opt.thumb) ctx.strokeRect(nx + 0.5, ny + 0.5, node - 1, node - 1);
    else { ctx.beginPath(); ctx.arc(nx + node / 2, ny + node / 2, node / 2, 0, Math.PI * 2); ctx.stroke(); }
  }
  if (opt.labels) {
    ctx.fillStyle = Theme.c.muted; ctx.font = "11px " + getComputedStyle(document.body).getPropertyValue("--f-body");
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    for (let l = 0; l < ns; l++) if (opt.labels[l]) ctx.fillText(opt.labels[l], pos[l][0][0] + node / 2, y + h + 14);
  }
  if (opt.side) {
    ctx.font = "11px " + getComputedStyle(document.body).getPropertyValue("--f-mono");
    ctx.fillStyle = Theme.c.muted; ctx.textBaseline = "middle";
    opt.side.forEach((lab, l) => lab && lab.forEach((t, k) => {
      if (!t) return;
      const [nx, ny] = pos[l][k];
      ctx.textAlign = l === 0 ? "right" : "left";
      ctx.fillText(t, l === 0 ? nx - 5 : nx + node + 5, ny + node / 2);
    }));
  }
  return pos;
}

// ---------------------------------------------------------------- sinir ağı (çok katmanlı algılayıcı)
const sig = (z) => 1 / (1 + Math.exp(-clamp(z, -40, 40)));
class MLP {
  constructor(sizes, act = "tanh", out = "sigmoid") {
    this.sizes = sizes.slice(); this.act = act; this.out = out; this.L = sizes.length - 1; this.t = 0;
    this.W = []; this.b = []; this.gW = []; this.gb = []; this.mW = []; this.vW = []; this.mb = []; this.vb = [];
    for (let l = 0; l < this.L; l++) {
      const ni = sizes[l], no = sizes[l + 1], hidden = l < this.L - 1;
      const s = act === "relu" && hidden ? Math.sqrt(2 / ni) : Math.sqrt(2 / (ni + no));
      const W = new Float64Array(ni * no);
      for (let k = 0; k < W.length; k++) W[k] = gauss() * s;
      const b = new Float64Array(no);
      if (act === "relu" && hidden) b.fill(0.05);
      this.W.push(W); this.b.push(b);
      for (const arr of [this.gW, this.mW, this.vW]) arr.push(new Float64Array(ni * no));
      for (const arr of [this.gb, this.mb, this.vb]) arr.push(new Float64Array(no));
    }
  }
  f(z) { return this.act === "tanh" ? Math.tanh(z) : this.act === "relu" ? (z > 0 ? z : 0) : sig(z); }
  df(a, z) { return this.act === "tanh" ? 1 - a * a : this.act === "relu" ? (z > 0 ? 1 : 0) : a * (1 - a); }
  forward(x) {
    const A = [x], Z = []; let a = x;
    for (let l = 0; l < this.L; l++) {
      const ni = this.sizes[l], no = this.sizes[l + 1], W = this.W[l], b = this.b[l];
      const z = new Float64Array(no), na = new Float64Array(no);
      if (ni > 100) { // seyrek girdi (rakam resmi): sadece sıfır olmayan pikselleri dolaş
        const nz = []; for (let i = 0; i < ni; i++) if (a[i] !== 0) nz.push(i);
        for (let j = 0; j < no; j++) { let s = b[j]; const o = j * ni; for (const i of nz) s += W[o + i] * a[i]; z[j] = s; }
      } else {
        for (let j = 0; j < no; j++) { let s = b[j]; const o = j * ni; for (let i = 0; i < ni; i++) s += W[o + i] * a[i]; z[j] = s; }
      }
      if (l === this.L - 1) {
        if (this.out === "softmax") {
          let m = -Infinity; for (let j = 0; j < no; j++) m = Math.max(m, z[j]);
          let t = 0; for (let j = 0; j < no; j++) { na[j] = Math.exp(z[j] - m); t += na[j]; }
          for (let j = 0; j < no; j++) na[j] /= t;
        } else if (this.out === "sigmoid") for (let j = 0; j < no; j++) na[j] = sig(z[j]);
        else for (let j = 0; j < no; j++) na[j] = z[j];
      } else for (let j = 0; j < no; j++) na[j] = this.f(z[j]);
      Z.push(z); A.push(na); a = na;
    }
    return { A, Z };
  }
  predict(x) { return this.forward(x).A[this.L]; }
  // Bir örnek için hatayı geriye yayar ve gradyanları biriktirir
  backward(x, target) {
    const { A, Z } = this.forward(x), L = this.L, out = A[L];
    let delta = new Float64Array(out.length), loss;
    if (this.out === "softmax") {
      for (let j = 0; j < out.length; j++) delta[j] = out[j] - (j === target ? 1 : 0);
      loss = -Math.log(Math.max(out[target], 1e-9));
    } else if (this.out === "sigmoid") {
      const p = clamp(out[0], 1e-7, 1 - 1e-7);
      delta[0] = out[0] - target; loss = -(target * Math.log(p) + (1 - target) * Math.log(1 - p));
    } else { delta[0] = out[0] - target; loss = 0.5 * delta[0] * delta[0]; }
    this._bp(A, Z, delta);
    return { loss, out };
  }
  // Q-öğrenme için: yalnızca seçilen çıkışın hatası geriye yayılır (doğrusal çıkış)
  backwardIdx(x, idx, target) {
    const { A, Z } = this.forward(x), out = A[this.L], delta = new Float64Array(out.length);
    let d = out[idx] - target; d = clamp(d, -5, 5); delta[idx] = d;
    this._bp(A, Z, delta);
    return 0.5 * d * d;
  }
  _bp(A, Z, delta) {
    const L = this.L;
    for (let l = L - 1; l >= 0; l--) {
      const ni = this.sizes[l], no = this.sizes[l + 1], a = A[l], W = this.W[l], gW = this.gW[l], gb = this.gb[l];
      const sparse = ni > 100; let nz = null;
      if (sparse) { nz = []; for (let i = 0; i < ni; i++) if (a[i] !== 0) nz.push(i); }
      for (let j = 0; j < no; j++) {
        const d = delta[j]; if (d === 0) continue;
        gb[j] += d; const o = j * ni;
        if (sparse) for (const i of nz) gW[o + i] += d * a[i];
        else for (let i = 0; i < ni; i++) gW[o + i] += d * a[i];
      }
      if (l > 0) {
        const nd = new Float64Array(ni);
        for (let j = 0; j < no; j++) { const d = delta[j]; if (d === 0) continue; const o = j * ni; for (let i = 0; i < ni; i++) nd[i] += W[o + i] * d; }
        const z = Z[l - 1];
        for (let i = 0; i < ni; i++) nd[i] *= this.df(a[i], z[i]);
        delta = nd;
      }
    }
  }
  // Biriken gradyanlarla ağırlıkları günceller
  step(n, lr, opt = "sgd", l2 = 0) {
    this.t++;
    const b1 = 0.9, b2 = 0.999, eps = 1e-8, c1 = 1 - Math.pow(b1, this.t), c2 = 1 - Math.pow(b2, this.t);
    for (let l = 0; l < this.L; l++) {
      for (const [P, G, M, V, reg] of [[this.W[l], this.gW[l], this.mW[l], this.vW[l], l2], [this.b[l], this.gb[l], this.mb[l], this.vb[l], 0]]) {
        for (let k = 0; k < P.length; k++) {
          const g = G[k] / n + reg * P[k];
          if (opt === "sgd") P[k] -= lr * g;
          else if (opt === "momentum") { M[k] = 0.9 * M[k] + g; P[k] -= lr * M[k]; }
          else { M[k] = b1 * M[k] + (1 - b1) * g; V[k] = b2 * V[k] + (1 - b2) * g * g; P[k] -= (lr * (M[k] / c1)) / (Math.sqrt(V[k] / c2) + eps); }
          G[k] = 0;
        }
      }
    }
  }
  healthy() { for (const W of this.W) for (let k = 0; k < W.length; k += 7) if (!isFinite(W[k])) return false; return true; }
}

// ---------------------------------------------------------------- kaydetme yardımcıları
const arr7 = (a) => Array.from(a, (v) => +(+v).toPrecision(7));
const mlpToJSON = (n) => ({ sizes: n.sizes, act: n.act, out: n.out, W: n.W.map(arr7), b: n.b.map(arr7) });
function mlpFromJSON(o) { const n = new MLP(o.sizes, o.act, o.out); o.W.forEach((w, l) => n.W[l].set(w)); o.b.forEach((b, l) => n.b[l].set(b)); return n; }

const Saver = {
  key: (id) => "ogrlab:" + id,
  snapshot(id) {
    const controls = {};
    $$("input,select,textarea", $("#tab-" + id)).forEach((el) => { if (el.id && el.type !== "file") controls[el.id] = el.type === "checkbox" ? el.checked : el.value; });
    return { app: "ogrenme-laboratuvari", v: 1, tab: id, time: new Date().toISOString(), controls, model: Modules[id].save ? Modules[id].save() : null };
  },
  restore(snap) {
    if (!snap || snap.app !== "ogrenme-laboratuvari" || !Modules[snap.tab]) throw new Error("Bu dosya Öğrenme Laboratuvarı kaydı değil.");
    if (activeMod !== Modules[snap.tab]) { try { history.replaceState(null, "", "#" + snap.tab); } catch (e) {} showTab(snap.tab); }
    if (Modules[snap.tab].prepare) Modules[snap.tab].prepare(snap.model || {});
    for (const [id, v] of Object.entries(snap.controls || {})) {
      const el = document.getElementById(id); if (!el) continue;
      if (el.type === "checkbox") el.checked = !!v;
      else {
        if (el.tagName === "SELECT" && ![...el.options].some((o) => o.value === String(v))) continue;
        el.value = v;
      }
      if (el.type === "range") { const o = document.getElementById(id + "-o"); if (o) o.textContent = UI.fmt[id] ? UI.fmt[id](+el.value) : el.value; }
    }
    if (Modules[snap.tab].load) Modules[snap.tab].load(snap.model || {});
  },
  stamp(t) { try { return new Date(t).toLocaleString("tr-TR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } },
  say(msg, bad) { const s = $("#sv-msg"); if (s) { s.textContent = msg; s.style.color = bad ? "var(--bad)" : ""; } },
  status(id) {
    let t = null; try { const r = localStorage.getItem(this.key(id)); if (r) t = JSON.parse(r).time; } catch (e) {}
    this.say(t ? "Bu sekmenin kaydı var: " + this.stamp(t) : "Bu sekme için kayıt yok");
    const b = $("#sv-load"); if (b) b.disabled = !t;
  },
  save() {
    const id = activeId; let txt;
    try { txt = JSON.stringify(this.snapshot(id)); } catch (e) { return this.say("Kaydedilemedi: " + e.message, true); }
    try { localStorage.setItem(this.key(id), txt); this.say("Tarayıcıya kaydedildi: " + this.stamp(Date.now()) + ` (${Math.round(txt.length / 1024)} KB)`); $("#sv-load").disabled = false; }
    catch (e) { this.say("Tarayıcı belleği kullanılamıyor ya da dolu. “Dosyaya indir” ile kaydet.", true); }
  },
  load() {
    try { const r = localStorage.getItem(this.key(activeId)); if (!r) return this.say("Bu sekme için kayıt yok.", true); this.restore(JSON.parse(r)); this.say("Kayıt yüklendi."); }
    catch (e) { this.say("Yüklenemedi: " + e.message, true); }
  },
  download() {
    try {
      const txt = JSON.stringify(this.snapshot(activeId)), blob = new Blob([txt], { type: "application/json" });
      const a = document.createElement("a"), d = new Date();
      a.href = URL.createObjectURL(blob); a.download = `ogrenme-lab-${activeId}-${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      this.say(`Dosya hazırlandı (${Math.round(txt.length / 1024)} KB). İndirilmediyse bu ortam indirmeyi engelliyor olabilir.`);
    } catch (e) { this.say("İndirilemedi: " + e.message, true); }
  },
  openFile(file) {
    const r = new FileReader();
    r.onload = () => { try { this.restore(JSON.parse(r.result)); this.say("Dosyadan yüklendi: " + file.name); } catch (e) { this.say("Açılamadı: " + e.message, true); } };
    r.readAsText(file);
  },
};

const UI = {
  fmt: {},

  },
  select(id, label, opts, val) {

      .map((o) => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${v}"${String(v) === String(val) ? " selected" : ""}>${t}</option>`; })
      .join("")}</select></label>`;
  },
  check(id, label, on) { return `<label class="check"><input type="checkbox" id="${id}"${on ? " checked" : ""}><span>${label}</span></label>`; },
  group(title, inner) { return `<div class="group"><h3>${title}</h3>${inner}</div>`; },
  stat(id, label) { return `<div class="stat"><span>${label}</span><b id="${id}">–</b></div>`; },

document.addEventListener("input", (e) => {

});
const val = (id) => document.getElementById(id).value;
const num = (id) => +document.getElementById(id).value;
const on = (id) => document.getElementById(id).checked;

// ---------------------------------------------------------------- sekmeler ve ana döngü
const Modules = {};
let activeMod = null, activeId = null;
function showTab(id) {
  if (!Modules[id]) id = "siniflandirma";
  $$("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === id ? "true" : "false"));
  $$("section.tab").forEach((s) => (s.hidden = s.id !== "tab-" + id));
  if (activeMod && activeMod.deactivate) activeMod.deactivate();
  activeMod = Modules[id]; activeId = id;
  if (!activeMod._ready) { activeMod.init($("#tab-" + id)); activeMod._ready = true; }
  if (activeMod.activate) activeMod.activate();
  Saver.status(id);
}
function boot() {
  Theme.refresh();
  $$("#tabs button").forEach((b) => b.addEventListener("click", () => {
    try { history.replaceState(null, "", "#" + b.dataset.tab); } catch (e) { location.hash = b.dataset.tab; }
    showTab(b.dataset.tab);
  }));
  window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));
  const retheme = () => { Theme.refresh(); for (const m of Object.values(Modules)) if (m._ready && m.onTheme) m.onTheme(); };
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme); } catch (e) {}
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  $("#sv-save").onclick = () => Saver.save(); $("#sv-load").onclick = () => Saver.load();
  $("#sv-down").onclick = () => Saver.download(); $("#sv-open").onclick = () => $("#sv-file").click();
  $("#sv-file").onchange = (e) => { const f = e.target.files[0]; if (f) Saver.openFile(f); e.target.value = ""; };
  showTab(location.hash.slice(1) || "siniflandirma");
  const loop = () => { try { if (activeMod && activeMod.frame) activeMod.frame(); } catch (e) { console.error(e); } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
// ===================================================================== 1) SINIFLANDIRMA
Modules.siniflandirma = (() => {
  const S = 440, GRID = 70, TH = 14; // ana alan, karar ızgarası, nöron küçük resmi
  const FEATS = [
    ["x", "x", (x, y) => x], ["y", "y", (x, y) => y],
    ["x2", "x²", (x, y) => x * x], ["y2", "y²", (x, y) => y * y], ["xy", "x·y", (x, y) => x * y],
    ["sx", "sin x", (x, y) => Math.sin(Math.PI * x)], ["sy", "sin y", (x, y) => Math.sin(Math.PI * y)],
  ];
  const st = { run: false, epoch: 0, hist: [], histT: [], train: [], test: [], net: null, feats: [], hover: null, blown: false, add: 1 };
  let cv, ctx, ncv, nctx, gcv, gctx, gridC, gridX, thumbC, thumbX;

  function data(type, n, noise) {
    const P = [], G = () => gauss() * noise;
    if (type === "daire") for (let i = 0; i < n; i++) {
      const inn = i < n / 2, r = inn ? rand(0, 0.38) : rand(0.62, 0.92), a = rand(0, 2 * Math.PI);
      P.push([r * Math.cos(a) + G() * 0.25, r * Math.sin(a) + G() * 0.25, inn ? 1 : 0]);
    } else if (type === "xor") for (let i = 0; i < n; i++) {
      let x = rand(-0.85, 0.85), y = rand(-0.85, 0.85); x += x > 0 ? 0.07 : -0.07; y += y > 0 ? 0.07 : -0.07;
      P.push([x + G() * 0.3, y + G() * 0.3, x * y > 0 ? 1 : 0]);
    } else if (type === "kume") for (let i = 0; i < n; i++) {
      const t = i % 2, c = t ? 0.42 : -0.42, s = 0.16 + noise * 0.4;
      P.push([c + gauss() * s, c + gauss() * s, t]);
    } else if (type === "spiral") for (let t = 0; t < 2; t++) for (let i = 0; i < n / 2; i++) {
      const k = i / (n / 2), r = 0.06 + k * 0.84, a = k * 3 * Math.PI + t * Math.PI;
      P.push([r * Math.sin(a) + G() * 0.15, r * Math.cos(a) + G() * 0.15, t]);
    } else if (type === "ay") for (let i = 0; i < n; i++) {
      const t = i % 2, a = rand(0, Math.PI);
      const x = t ? Math.cos(a) : 1 - Math.cos(a), y = t ? Math.sin(a) : 0.5 - Math.sin(a);
      P.push([(x - 0.5) * 0.62 + G() * 0.3, (y - 0.25) * 0.85 + G() * 0.3, t]);
    }
    const RF = { "r-sin": (x) => 0.7 * Math.sin(2.6 * x), "r-adim": (x) => (x < -0.3 ? -0.6 : x < 0.35 ? 0.3 : -0.2), "r-dalga": (x) => 0.45 * Math.sin(7 * x) + 0.3 * x, "r-kup": (x) => 1.6 * x * x * x - 0.9 * x };
    if (RF[type]) for (let i = 0; i < n; i++) { const x = rand(-1, 1), y = RF[type](x) + gauss() * noise * 0.5; P.push([x, y, y]); }
    return P.map(([x, y, t]) => [clamp(x, -1, 1), clamp(y, -1, 1), RF[type] ? clamp(t, -1, 1) : t]);
  }
  const inp = (x, y) => st.feats.map((f) => f[2](x, y));
  window.Data2D = data; // Karar Ağacı sekmesi de aynı veri setlerini kullanır
  const isReg = () => val("c-data").startsWith("r-");
  const inpP = (x, y) => (st.reg ? inp(x, 0) : inp(x, y)); // regresyonda girdi yalnızca x

  function newData() {
    const P = shuffle(data(val("c-data"), 300, num("c-noise") / 100));
    const k = Math.round((P.length * num("c-ratio")) / 100);
    st.train = P.slice(0, k); st.test = P.slice(k);
    reset();
  }
  function reset() {
    st.reg = isReg();
    for (const f of FEATS) { const yf = /y/.test(f[0]); $("#c-f-" + f[0]).disabled = st.reg && yf; $("#c-f-" + f[0]).parentElement.style.opacity = st.reg && yf ? 0.4 : 1; }
    st.feats = FEATS.filter((f) => on("c-f-" + f[0]) && !(st.reg && /y/.test(f[0])));
    if (!st.feats.length) { $("#c-f-x").checked = true; st.feats = [FEATS[0]]; }
    const hidden = Array(num("c-layers")).fill(num("c-neurons"));
    st.net = new MLP([st.feats.length, ...hidden, 1], val("c-act"), st.reg ? "linear" : "sigmoid");
    $("#c-s-a").previousElementSibling.textContent = st.reg ? "Eğitim R²" : "Eğitim doğruluğu";
    $("#c-s-at").previousElementSibling.textContent = st.reg ? "Test R²" : "Test doğruluğu";
    st.epoch = 0; st.hist = []; st.histT = []; st.blown = false; st.hover = null;
    measure(); draw();
  }
  function loss(set) {
    if (!set.length) return [null, null];
    let L = 0, ok = 0;
    if (st.reg) { // ortalama kare hata ve R²
      const m = set.reduce((s, p) => s + p[2], 0) / set.length; let sst = 0;
      for (const [x, , t] of set) { const p = st.net.predict(inp(x, 0))[0]; if (!isFinite(p)) return [NaN, 0]; L += (p - t) ** 2; sst += (t - m) ** 2; }
      return [L / set.length, Math.max(0, 1 - L / Math.max(sst, 1e-9))];
    }
    for (const [x, y, t] of set) {
      const p = st.net.predict(inp(x, y))[0];
      if (p !== p) return [NaN, 0];
      const q = clamp(p, 1e-7, 1 - 1e-7); L += -(t * Math.log(q) + (1 - t) * Math.log(1 - q));
      if ((p > 0.5) === (t === 1)) ok++;
    }
    return [L / set.length, ok / set.length];
  }
  function measure() {
    const [a, b] = loss(st.train), [c, d] = loss(st.test);
    st.hist.push(a); st.histT.push(c); st.acc = b; st.accT = d;
    if (st.hist.length > 4000) { st.hist.splice(0, 2000); st.histT.splice(0, 2000); }
  }
  function epoch() {
    if (!st.train.length || st.blown) return;
    const set = shuffle(st.train.slice()), bs = val("c-batch") === "all" ? set.length : +val("c-batch");
    const lr = +val("c-lr"), opt = val("c-opt"), l2 = +val("c-l2");
    for (let i = 0; i < set.length; i += bs) {
      const part = set.slice(i, i + bs);
      for (const [x, y, t] of part) st.net.backward(inpP(x, y), t);
      st.net.step(part.length, lr, opt, l2);
    }
    st.epoch++;
    if (!st.net.healthy()) st.blown = true;
    measure();
    if (st.blown || !isFinite(st.hist[st.hist.length - 1])) { st.blown = true; setRun(false); }
  }
  function setRun(v) {
    st.run = v; const b = $("#c-run"); if (b) b.textContent = v ? "⏸ Duraklat" : "▶ Başlat";
  }

  // --------------------------------------------- çizim
  function neuronVals(l, k, pts) { // ızgara noktalarında bir nöronun çıkışı (0..1 aralığına ölçekli)
    const out = new Float64Array(pts.length);
    for (let i = 0; i < pts.length; i++) {
      const A = st.net.forward(inp(pts[i][0], pts[i][1])).A;
      out[i] = A[l][k];
    }
    return scaleVals(out, l);
  }
  function scaleVals(v, l) {
    const last = l === st.net.L;
    if (l === 0) { let m = 1e-9; for (const a of v) m = Math.max(m, Math.abs(a)); return v.map((a) => (a / m + 1) / 2); }
    if (last || st.net.act === "sigmoid") return v;
    if (st.net.act === "tanh") return v.map((a) => (a + 1) / 2);
    let m = 1e-9; for (const a of v) m = Math.max(m, a); return v.map((a) => 0.5 + (a / m) * 0.5);
  }
  const gridPts = []; for (let i = 0; i < GRID; i++) for (let j = 0; j < GRID; j++) gridPts.push([((j + 0.5) / GRID) * 2 - 1, 1 - ((i + 0.5) / GRID) * 2]);
  const thPts = []; for (let i = 0; i < TH; i++) for (let j = 0; j < TH; j++) thPts.push([((j + 0.5) / TH) * 2 - 1, 1 - ((i + 0.5) / TH) * 2]);

  function drawReg() {
    ctx.fillStyle = Theme.c.surface; ctx.fillRect(0, 0, S, S);
    ctx.strokeStyle = Theme.c.line; ctx.lineWidth = 1;
    for (let k = 1; k < 8; k++) { ctx.beginPath(); ctx.moveTo((k * S) / 8, 0); ctx.lineTo((k * S) / 8, S); ctx.moveTo(0, (k * S) / 8); ctx.lineTo(S, (k * S) / 8); ctx.stroke(); }

Modules.yilan = (() => {
  const G = 20, CS = 22, DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // sağ, aşağı, sol, yukarı (saat yönü)

  function newNet() {

  }
  function newGame() {

  }
  function placeFood() {

  }
  const hit = ([x, y], body) => x < 0 || y < 0 || x >= G || y >= G || body.some(([a, b]) => a === x && b === y);

      d === 0, d === 1, d === 2, d === 3,

Cephe.pb = (() => {

    const pop = st.pop, avg = st.S / nPan(), next = pop.slice(0, 3);

      for (let i = 0; i < ch.length; i++) if (Math.random() < 0.12) ch[i] += gauss() * avg * 0.12;

    const b = st.best; if (!b) return;

    const xs = st.pts.map((p) => p[0]), ys = st.pts.map((p) => p[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const sc = Math.min((W - 40) / (x1 - x0), (H - 160) / Math.max(y1 - y0, 1)), ox = (W - (x1 - x0) * sc) / 2, oy = 30 + (H - 160 - (y1 - y0) * sc) / 2;

      const X = bx + u * bw, Y = by - v * sc * ex; k === i0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y); } ctx.stroke();

// ------------------------------------------------------------------ 2) DİKME KESİTİ
Cephe.dk = (() => {
  const E = 70000, RHO = 0.0027; // MPa, kg/m per mm²

  let scv, sctx, pcv, pctx, gcv, gctx, bcv, bctx;
  const lim = () => ({ h: [50, num("dk-hmax")], b: [40, 90], tw: [1.6, 6], tf: [1.6, 8] });

  function reset() { st.pop = Array.from({ length: 50 }, () => calc(fix(rnd()))); st.pop.sort((a, b) => a.cost - b.cost); st.best = st.pop[0]; st.gen = 0; st.hist = [st.best.kg]; draw(); }
  function generation() {
    const pop = st.pop, B = lim(), next = pop.slice(0, 2);
    const pick = () => { let b = pop[randInt(0, pop.length - 1)]; for (let k = 0; k < 2; k++) { const c = pop[randInt(0, pop.length - 1)]; if (c.cost < b.cost) b = c; } return b; };
    while (next.length < pop.length) {

    const W = b * sc, Hh = h * sc, ox = x0 + (size - W) / 2, oy = y0 + 26 + (size - Hh) / 2;
    sctx.fillStyle = r.ok ? Theme.c.accent : Theme.c.bad; sctx.fillRect(ox, oy, W, Hh);
    sctx.fillStyle = Theme.c.surface; sctx.fillRect(ox + tw * sc, oy + tf * sc, W - 2 * tw * sc, Hh - 2 * tf * sc);
    sctx.fillStyle = Theme.c.ink; sctx.font = "600 12px " + getComputedStyle(document.body).getPropertyValue("--f-body"); sctx.textAlign = "center"; sctx.textBaseline = "alphabetic";
    sctx.fillText(title, x0 + size / 2, y0 + 14);
    sctx.font = "11px " + f; sctx.fillStyle = Theme.c.muted;
    sctx.fillText(`${b.toFixed(0)} mm`, ox + W / 2, oy + Hh + 16);
    sctx.save(); sctx.translate(ox - 10, oy + Hh / 2); sctx.rotate(-Math.PI / 2); sctx.fillText(`${h.toFixed(0)} mm`, 0, 0); sctx.restore();
    sctx.textAlign = "left"; sctx.fillText(`et: ${tw.toFixed(1)} / ${tf.toFixed(1)} mm`, ox + W + 8, oy + 12);
    sctx.fillText("rüzgâr ↓", ox + W + 8, oy - 4 > y0 + 20 ? oy - 4 : oy + 28);
  }

  /* görüntü video öğesiyle değil tuvale çizilerek gösterilir (iPhone Safari video katmanını kutu içinde göstermiyor) */

    if (!vcv) return; const r = vcv.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1), W = Math.max(1, Math.round(r.width * d)), H = Math.max(1, Math.round(r.height * d));

  function status() {
    const s = $("#k-status"); if (!s) return;
    s.innerHTML = st.err ? `<span style="color:var(--bad)">${st.err}</span>` : st.loading ? "Model indiriliyor (yaklaşık 14 MB, ilk seferde birkaç saniye)…" : !st.stream ? "Kamera kapalı" : !st.model ? "Model hazırlanıyor…" : `Çalışıyor · ${st.fps.toFixed(1)} tahmin/sn · ${tf.getBackend() === "webgl" ? "ekran kartı" : "işlemci"}`;
    $("#k-cam").textContent = st.stream ? "■ Kamerayı kapat" : "▶ Kamerayı aç";
    $("#k-ph").style.display = st.stream ? "none" : "grid";
  }
  /* görüntüyü dondur: hareketli nesneleri incelemek için */
  function freeze() { if (!st.stream) return; st.frozen = !st.frozen; if (st.frozen) { snap.width = video.videoWidth; snap.height = video.videoHeight; sctx.drawImage(video, 0, 0); view(true); } $("#k-freeze").textContent = st.frozen ? "▶ Devam" : "❚❚ Dondur"; }
  const src = () => (st.frozen ? snap : video);

  /* ---- k-en yakın komşu (kosinüs benzerliği) ---- */

  function knn(e) {
    const k = Math.max(1, Math.min(num("k-k"), st.samples.length)); if (!st.samples.length || st.classes.length < 1) return [];
    const d = st.samples.map((s) => { let dot = 0; for (let i = 0; i < e.length; i++) dot += e[i] * s.e[i]; return [dot, s.c]; }).sort((a, b) => b[0] - a[0]).slice(0, k);

  }
  function thumb() { const c = document.createElement("canvas"); c.width = c.height = 56; const x = c.getContext("2d"), v = src(), w = v.videoWidth || v.width, h = v.videoHeight || v.height, m = Math.min(w, h); x.drawImage(v, (w - m) / 2, (h - m) / 2, m, m, 0, 0, 56, 56); return c.toDataURL("image/jpeg", 0.7); }

  }
  function hud() {

    else if (st.preds[0]) { const p = st.preds[0], t = trName(p.className); h.innerHTML = `<b>${esc(t || p.className.split(",")[0])}</b><span>%${Math.round(p.probability * 100)}${t ? " · " + esc(p.className.split(",")[0]) : ""}</span>`; }
    else h.innerHTML = "";
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function bars(ctx, cv, rows) {
    const W = cv._w, H = cv._h, rh = Math.min(34, H / Math.max(rows.length, 1)); ctx.clearRect(0, 0, W, H);
    rows.forEach((r, i) => { const y = i * rh + 4, bw = W - 70;
      ctx.fillStyle = Theme.c.sunk; ctx.fillRect(0, y + 14, bw, 10); ctx.fillStyle = r.color || Theme.c.accent; ctx.fillRect(0, y + 14, Math.max(2, bw * r.p), 10);
      ctx.fillStyle = Theme.c.ink; ctx.font = "600 12px " + getComputedStyle(document.body).fontFamily; ctx.textBaseline = "alphabetic"; ctx.fillText(r.label.length > 46 ? r.label.slice(0, 45) + "…" : r.label, 0, y + 11);
      ctx.fillStyle = Theme.c.muted; ctx.font = "500 12px " + "JetBrains Mono, monospace"; ctx.textAlign = "right"; ctx.fillText("%" + (r.p * 100).toFixed(r.p < 0.1 ? 1 : 0), W, y + 24); ctx.textAlign = "left"; });
    if (!rows.length) { ctx.fillStyle = Theme.c.muted; ctx.font = "13px sans-serif"; ctx.fillText("Kamera açılınca tahminler burada görünür.", 0, 20); }
  }
  function drawPreds() { bars(pctx, pcv, st.preds.map((p) => { const t = trName(p.className), en = p.className.split(",")[0]; return { label: t ? `${t} (${en})` : en, p: p.probability }; })); }
  function drawKnn() {
    if (!st.samples.length) { kctx.clearRect(0, 0, kcv._w, kcv._h); kctx.fillStyle = Theme.c.muted; kctx.font = "13px sans-serif"; kctx.fillText("Önce her sınıfa birkaç örnek ekle.", 0, 20); return; }
    bars(kctx, kcv, st.classes.map((c, i) => ({ label: `${c.name} · ${st.samples.filter((s) => s.c === i).length} örnek`, p: (st.knn.find((x) => x.c === i) || { p: 0 }).p, color: c.color })));
  }
  /* ---- örnek haritası: 1280 boyutlu özellikleri iki ana bileşene (PCA) indir ---- */
  function pca2(X) {
    const n = X.length, d = X[0].length, mu = new Float32Array(d); X.forEach((x) => { for (let j = 0; j < d; j++) mu[j] += x[j] / n; });

  function renderClasses() {
    const box = $("#k-classes");

      return `<div class="card" style="padding:10px;border-left:4px solid ${c.color}">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input value="${esc(c.name)}" data-n="${i}" aria-label="Sınıf adı" style="flex:1;min-width:120px;font:inherit;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--sunk);color:var(--ink)">
          <button class="btn" data-add="${i}" style="touch-action:none">● Basılı tut: örnek ekle</button><span class="note">${ss.length} örnek</span>
          <button class="btn" data-clr="${i}" title="Bu sınıfın örneklerini sil">Temizle</button>${st.classes.length > 2 ? `<button class="btn" data-del="${i}" title="Sınıfı kaldır">×</button>` : ""}</div>
        <div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:6px">${ss.slice(-24).map((s) => `<img src="${s.t}" alt="" width="34" height="34" style="border-radius:4px">`).join("")}</div></div>`; }).join("");

  function explain() {

    e.innerHTML = `<b>Hazır model</b>, ImageNet adlı 1,2 milyon fotoğraflık veri setinde önceden eğitilmiş MobileNet ağı. 1000 sınıfı tanır: kupa, klavye, muz, makas gibi. "İnsan" diye bir sınıfı yoktur; yüzünü gösterirsen en çok benzediği nesneyi söyler (gözlük, takım elbise, maske…). Ağ yalnızca bildiği sınıflar arasından seçim yapabilir.<br><br>
      <b>Kendi nesnelerin</b> bölümü <i>aktarım öğrenmesi</i> kullanır. Ağın son katmanını atıp bir önceki katmandan 1280 sayılık bir "özellik vektörü" alır; bu vektör görüntünün kenar, doku ve şekil özetidir. Her örnek bir nokta olarak saklanır. Yeni bir kare geldiğinde en benzer <b>k</b> örneğe bakılır ve hangi sınıftan çok varsa o seçilir (<i>k-en yakın komşu</i>). Ağ yeniden eğitilmez; bu yüzden birkaç saniyede öğrenir.<br><br>
      <b>Örnek haritası</b>, 1280 boyutlu noktaları ana bileşen analiziyle (PCA) iki boyuta indirip gösterir. Sınıfların renkleri ayrı öbekler oluşturuyorsa model onları kolay ayırır; iç içe geçiyorsa daha çeşitli açı, ışık ve arka planla örnek ekle. Artı işaretli halka, kameradaki şu anki görüntü.<br><br>
      <span class="note">Görüntüler bilgisayarından çıkmaz; model tarayıcında çalışır. Yalnızca model dosyası ilk açılışta internetten indirilir.</span>`;
  }
  function init(root) {
    if (!st.classes.length) { newClass("Nesne 1"); newClass("Nesne 2"); }
    root.innerHTML = `
    <div class="lab">
      <div class="stage">
        <div class="row">
          <div class="card" style="flex:1 1 360px"><h2>Kamera</h2><p class="sub">Bir nesneyi kameraya göster. <span id="k-status"></span></p>

            </div>

        </div>
        <div class="card"><h2>Kendi nesnelerini öğret</h2><p class="sub">Her sınıf için nesneyi kameraya tutup düğmeye basılı tut; 15–30 örnek yeterli. Nesneyi biraz döndür ve uzaklaştır ki çeşitli örnekler toplansın.</p>
          <div id="k-classes" style="display:flex;flex-direction:column;gap:8px"></div>
          <div style="margin-top:8px"><button class="btn" id="k-addc">+ Sınıf ekle</button></div></div>
        <div class="row">
          <div class="card" style="flex:1 1 300px"><h2>Senin modelinin tahmini</h2><p class="sub">En yakın k örneğin oyları.</p><canvas id="k-knn"></canvas></div>
          <div class="card" style="flex:1 1 300px"><h2>Örnek haritası</h2><p class="sub">Örneklerin 1280 boyuttan 2 boyuta indirilmiş hâli (PCA).</p><canvas id="k-map"></canvas></div>
        </div>
        <div class="explain" id="k-explain"></div>
      </div>
      <aside class="panel">
        <div class="btns"><button class="btn primary" id="k-cam">▶ Kamerayı aç</button><button class="btn" id="k-flip">⟲ Ön / arka</button><button class="btn" id="k-freeze">❚❚ Dondur</button></div>
        ${UI.group("Ekrandaki büyük etiket", UI.select("k-mode", "Gösterilen tahmin", [["hazir", "Hazır model (1000 sınıf)"], ["ozel", "Kendi sınıflarım"]], "hazir"))}
        ${UI.group("Ayarlar", UI.range("k-k", "k (komşu sayısı)", 1, 15, 1, 5) + UI.range("k-rate", "Tahmin sıklığı (sn'de)", 1, 15, 1, 6) + UI.check("k-mirror", "Ön kamerada ayna görüntü", true))}
        <div class="btns"><button class="btn wide" id="k-reset">Sınıfları ve örnekleri sıfırla</button></div>
        <p class="note">İpucu: arka planı sade tut. Bir sınıfı "hiçbiri" olarak bırakıp boş masayı öğretirsen model nesne yokken de doğru cevap verir.</p>

    $("#k-freeze").onclick = freeze;

})();

boot();
