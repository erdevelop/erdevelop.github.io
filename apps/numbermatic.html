<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Numbermatic</title>
<meta name="description" content="Numbermatic — hedef sayıyı süre bitmeden bul. erdevelop">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<style>
  :root {
    --ink: #24333d;
    --ink-soft: rgba(36,51,61,.7);
    --glass: rgba(235,245,250,.42);
    --glass-line: rgba(255,255,255,.55);
    --ok: #3bd13f;
    --bad: #e05656;
    --font: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #3d5560; font-family: var(--font); color: var(--ink); overflow: hidden; user-select: none; touch-action: manipulation; }
  #app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden;
    background: linear-gradient(170deg, #6f6b8f 0%, #6d8a95 38%, #5fb39b 78%, #7cc9a4 100%); }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .hud { position: absolute; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 0; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  .hud .score { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .hud .sub { font-size: 13px; color: var(--ink-soft); }
  .hud .count { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; transition: color .2s; }
  .hud .count.low { color: var(--bad); }
  .top-btns { position: absolute; left: 16px; top: calc(78px + env(safe-area-inset-top, 0px)); display: flex; gap: 6px; }
  .mini { pointer-events: auto; background: var(--glass); border: 1px solid var(--glass-line); color: var(--ink); border-radius: 10px; padding: 3px 9px; font: 700 12px var(--font); cursor: pointer; }
  .mini.home { text-decoration: none; }

  .target { position: absolute; right: 0; top: calc(76px + env(safe-area-inset-top, 0px)); width: 42%; padding: 6px 10px 10px; background: rgba(235,245,250,.5); border-radius: 0 0 0 28px; text-align: center; }
  .target small { display: block; font-size: 12px; color: var(--ink-soft); }
  .target b { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
  .target b::before { content: '›'; font-size: 22px; margin-right: 14px; opacity: .6; vertical-align: 5px; }
  .target b::after { content: '‹'; font-size: 22px; margin-left: 14px; opacity: .6; vertical-align: 5px; }
  .target.pop b { animation: pop .4s; }
  @keyframes pop { 40% { transform: scale(1.25); } }

  .key { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; border: 0; cursor: pointer;
    font: 700 18px var(--font); color: var(--ink);
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(190,230,240,.75) 45%, rgba(110,190,210,.55) 75%, rgba(80,160,190,.35));
    box-shadow: 0 0 0 2px rgba(255,255,255,.35), 0 0 14px rgba(150,230,255,.55), inset 0 -3px 6px rgba(40,110,140,.35);
    transition: transform .08s; transform: scale(var(--s, 1)); }
  .key:active, .key.hit { transform: scale(calc(var(--s, 1) * .86)); }
  .key.op { font-size: 20px; }
  .key.back { width: 64px; height: 50px; margin: -25px 0 0 -32px; border-radius: 40%; font-size: 20px; }

  .bubble-wrap { position: absolute; left: 55%; top: 57%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .bubble { min-width: 72px; height: 72px; padding: 0 14px; border-radius: 40px; display: grid; place-items: center; font-size: 26px; font-weight: 700;
    background: rgba(220,235,240,.55); box-shadow: 0 6px 20px rgba(30,60,70,.15); transition: background .2s, transform .2s; white-space: nowrap; }
  .bubble.ok { background: var(--ok); color: #fff; transform: scale(1.12); }
  .bubble.bad { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .stem { width: 2px; height: 18px; background: rgba(255,255,255,.6); }
  .orb { width: 38px; height: 38px; border-radius: 50%; background: rgba(240,245,248,.85); display: grid; place-items: center; font-size: 13px; color: #555; box-shadow: 0 2px 8px rgba(0,0,0,.15); animation: bob 2.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(5px); } }
  .preview { margin-top: 8px; font-size: 13px; color: var(--ink-soft); min-height: 18px; }

  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(40,60,70,.45); backdrop-filter: blur(3px); z-index: 5; padding: 24px; }
  .overlay[hidden] { display: none; }
  .card { width: 100%; max-width: 340px; background: rgba(245,250,252,.92); border-radius: 22px; padding: 24px 22px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .card h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: .5px; }
  .card h1 span { color: #3a9e8a; }
  .card p { margin: 10px 0 0; color: #4b5d68; font-size: 15px; line-height: 1.5; }
  .card .ex { margin: 14px auto 0; display: inline-flex; gap: 8px; align-items: center; font-weight: 700; }
  .card .ex i { font-style: normal; background: #dbe9ee; border-radius: 14px; padding: 4px 10px; }
  .card .ex i.g { background: var(--ok); color: #fff; }
  .card .big { margin-top: 12px; font-size: 44px; font-weight: 800; }
  .card .best { color: #6a7c86; font-size: 14px; margin-top: 4px; }
  .play { margin-top: 20px; border: 0; border-radius: 16px; padding: 14px 34px; font: 800 18px var(--font); color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #4cc79a, #2f9f84); box-shadow: 0 6px 16px rgba(47,159,132,.4); }
  .play:active { transform: translateY(1px); }
  .back-link { display: block; margin-top: 14px; color: #5f7480; font-size: 13px; }
</style>
</head>
<body>
<div id="app">
  <canvas id="fx"></canvas>
  <div class="hud">
    <div><div class="score">Skor: <span id="score">0</span></div><div class="sub">Seviye <span id="level">1</span> · <span id="clock">00m00s</span></div></div>
    <div class="count" id="count">10</div>
  </div>
  <div class="top-btns">
    <a class="mini home" href="../" aria-label="Ana sayfa">⌂</a>
    <button class="mini" id="soundBtn" type="button" aria-label="Ses">♪ açık</button>
  </div>
  <div class="target" id="targetBox"><small>Hedef sayı</small><b id="target">3</b></div>

  <div id="keys"></div>
  <div class="bubble-wrap">
    <div class="bubble" id="bubble">&nbsp;</div>
    <div class="stem"></div>
    <div class="orb">✥</div>
    <div class="preview" id="preview"></div>
  </div>

  <div class="overlay" id="start">
    <div class="card">
      <h1>Number<span>matic</span></h1>
      <p>Rakamlara ve işlemlere dokunarak <b>hedef sayıyı</b> veren işlemi kur. Süre bitmeden bulursan kalan saniyeler puanına eklenir.</p>
      <div class="ex"><i>9 ÷ 3</i>→<i class="g">3</i></div>
      <div class="best" id="bestStart"></div>
      <button class="play" id="playBtn" type="button">Oyna</button>
      <a class="back-link" href="../">← erdevelop</a>
    </div>
  </div>
  <div class="overlay" id="over" hidden>
    <div class="card">
      <h1>Süre doldu</h1>
      <p id="overText"></p>
      <div class="big" id="overScore">0</div>
      <div class="best" id="bestOver"></div>
      <button class="play" id="againBtn" type="button">Tekrar oyna</button>
      <a class="back-link" href="../">← erdevelop</a>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const app = $('app'), keys = $('keys');
  const OPS = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  let expr = '', target = 3, score = 0, level = 1, left = 10, roundTime = 10, playing = false, tick = null, startedAt = 0, clockT = null, locked = false;
  let sound = true;
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  if (store.get('nm-sound') === '0') sound = false;
  const best = () => +(store.get('nm-best') || 0);

  // ---- layout: digit arc on the left, operators on the right ----
  function layout() {
    keys.innerHTML = '';
    const W = app.clientWidth, H = app.clientHeight;
    const s = Math.min(1, W / 380);
    // sample the arc densely, then place digits at equal arc length
    const pts = [], N = 200;
    for (let i = 0; i <= N; i++) { const th = i / N * Math.PI / 2; pts.push([0.09 * W + 0.44 * W * (1 - Math.cos(th)), 0.88 * H - 0.62 * H * Math.sin(th)]); }
    const acc = [0]; for (let i = 1; i <= N; i++) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    for (let d = 0, j = 0; d <= 9; d++) {
      const L = acc[N] * d / 9; while (j < N && acc[j] < L) j++;
      addKey(String(d), pts[j][0], pts[j][1], '', s);
    }
    ['+', '-', '*', '/'].forEach((o, i) => addKey(o, 0.87 * W, (0.42 + i * 0.1) * H, 'op', s));
    addKey('<<', 0.55 * W, 0.9 * H, 'back', s);
  }
  function addKey(k, x, y, cls, s) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'key ' + cls; b.dataset.k = k;
    b.textContent = k === '<<' ? '‹‹' : OPS[k] || k;
    b.style.left = x + 'px'; b.style.top = y + 'px';
    b.style.setProperty('--s', s);
    b.addEventListener('pointerdown', e => { e.preventDefault(); press(k, b); });
    keys.appendChild(b);
  }

  // ---- expression ----
  const pretty = e => e.replace(/[+\-*/]/g, m => OPS[m]);
  function evaluate(e) {
    if (!/[+\-*/]/.test(e) || /[+\-*/]$/.test(e)) return null;
    const toks = e.match(/\d+|[+\-*/]/g);
    // precedence: × ÷ first
    const st = [+toks[0]];
    for (let i = 1; i < toks.length; i += 2) {
      const op = toks[i], n = +toks[i + 1];
      if (op === '*') st.push(st.pop() * n);
      else if (op === '/') { if (n === 0) return NaN; st.push(st.pop() / n); }
      else st.push(op === '+' ? n : -n);
    }
    return st.reduce((a, b) => a + b, 0);
  }
  function press(k, btn) {
    if (!playing || locked) return;
    if (btn) { btn.classList.add('hit'); setTimeout(() => btn.classList.remove('hit'), 90); }
    if (k === '<<') expr = expr.slice(0, -1);
    else if (/\d/.test(k)) {
      const m = expr.match(/(\d+)$/);
      if (m && m[1].length >= 2) return bump();
      if (m && m[1] === '0') expr = expr.slice(0, -1);
      if (expr.length >= 11) return bump();
      expr += k;
    } else {
      if (!expr) return bump();
      if (/[+\-*/]$/.test(expr)) expr = expr.slice(0, -1);
      expr += k;
    }
    beep(/\d/.test(k) ? 520 : 380, 0.05);
    show();
    const v = evaluate(expr);
    if (v !== null && Math.abs(v - target) < 1e-9) win();
  }
  function bump() { $('bubble').classList.remove('bad'); void $('bubble').offsetWidth; $('bubble').classList.add('bad'); beep(160, 0.08); }
  function show() {
    $('bubble').textContent = expr ? pretty(expr) : ' ';
    const v = evaluate(expr);
    $('preview').textContent = v === null || isNaN(v) ? '' : '= ' + (Number.isInteger(v) ? v : v.toFixed(2));
  }

  // ---- rounds ----
  function newTarget() {
    const hi = Math.min(5 + level * 2, 60);
    let t;
    do { t = 1 + Math.floor(Math.random() * hi); } while (t === target);
    target = t;
    $('target').textContent = t;
    $('targetBox').classList.remove('pop'); void $('targetBox').offsetWidth; $('targetBox').classList.add('pop');
    roundTime = Math.max(5, 12 - Math.floor(level / 2));
    left = roundTime; paintCount();
  }
  function paintCount() { $('count').textContent = Math.ceil(left); $('count').classList.toggle('low', left <= 3); }
  function win() {
    locked = true;
    const gain = Math.ceil(left);
    score += gain; level++;
    $('bubble').textContent = target; $('bubble').classList.add('ok'); $('preview').textContent = '+' + gain;
    $('score').textContent = score; $('level').textContent = level;
    burst(); chord();
    setTimeout(() => { $('bubble').classList.remove('ok'); expr = ''; show(); newTarget(); locked = false; }, 750);
  }
  function lose() {
    playing = false; clearInterval(tick); clearInterval(clockT);
    const b = best(), rec = score > b;
    if (rec) store.set('nm-best', score);
    $('overScore').textContent = score;
    $('overText').textContent = `Hedef ${target} idi. ${level - 1} sayı buldun.`;
    $('bestOver').textContent = rec && score > 0 ? '🏆 Yeni rekor!' : 'En iyi: ' + Math.max(b, score);
    $('over').hidden = false; beep(200, 0.25, 'sawtooth');
  }
  function start() {
    $('start').hidden = true; $('over').hidden = true;
    score = 0; level = 1; expr = ''; locked = false; target = 0;
    $('score').textContent = 0; $('level').textContent = 1; show(); newTarget();
    playing = true; startedAt = Date.now();
    clearInterval(tick); clearInterval(clockT);
    let last = performance.now();
    tick = setInterval(() => { const n = performance.now(); if (!locked) left -= (n - last) / 1000; last = n; if (left <= 0) { left = 0; paintCount(); lose(); } else paintCount(); }, 100);
    clockT = setInterval(() => { const s = Math.floor((Date.now() - startedAt) / 1000); $('clock').textContent = String(Math.floor(s / 60)).padStart(2, '0') + 'm' + String(s % 60).padStart(2, '0') + 's'; }, 500);
    ctx();
  }

  // ---- sound (Web Audio, starts after first tap) ----
  let ac = null;
  function ctx() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  function beep(f, d, type = 'sine', when = 0) {
    if (!sound || !ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; o.connect(g); g.connect(ac.destination);
    const t = ac.currentTime + when; g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.start(t); o.stop(t + d);
  }
  function chord() { [523, 659, 784].forEach((f, i) => beep(f, 0.18, 'triangle', i * 0.07)); }
  $('soundBtn').textContent = sound ? '♪ açık' : '♪ kapalı';
  $('soundBtn').addEventListener('click', () => { sound = !sound; store.set('nm-sound', sound ? '1' : '0'); $('soundBtn').textContent = sound ? '♪ açık' : '♪ kapalı'; ctx(); });

  // ---- particles ----
  const cv = $('fx'), g = cv.getContext('2d');
  let parts = [];
  function sizeFx() { const r = Math.min(devicePixelRatio || 1, 2); cv.width = app.clientWidth * r; cv.height = app.clientHeight * r; g.setTransform(r, 0, 0, r, 0, 0); }
  function burst() {
    const b = $('bubble').getBoundingClientRect(), a = app.getBoundingClientRect();
    const cx = b.left - a.left + b.width / 2, cy = b.top - a.top + b.height / 2;
    for (let i = 0; i < 46; i++) { const ang = Math.random() * 6.283, sp = 2 + Math.random() * 5; parts.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1, life: 1, c: ['#3bd13f', '#b8f5c0', '#ffffff', '#ffe27a', '#9be7ff'][i % 5], r: 2 + Math.random() * 3 }); }
  }
  // drifting ambient sparks
  for (let i = 0; i < 26; i++) parts.push({ amb: true, x: Math.random() * 480, y: Math.random() * 900, vx: (Math.random() - .5) * .2, vy: -.15 - Math.random() * .3, life: 1, c: 'rgba(255,255,255,.5)', r: 1 + Math.random() * 1.5 });
  function frame() {
    g.clearRect(0, 0, cv.width, cv.height);
    const W = app.clientWidth, H = app.clientHeight;
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy;
      if (p.amb) { if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; } }
      else { p.vy += 0.12; p.life -= 0.022; }
      g.globalAlpha = p.amb ? 0.6 : Math.max(p.life, 0);
      g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.283); g.fill();
    }
    g.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  // ---- input ----
  addEventListener('keydown', e => {
    const m = { 'x': '*', 'X': '*', '÷': '/', 'Backspace': '<<' };
    const k = m[e.key] || e.key;
    if (/^[0-9+\-*/]$/.test(k) || k === '<<') { const btn = keys.querySelector(`[data-k="${CSS.escape(k)}"]`); press(k, btn); e.preventDefault(); }
    if (e.key === 'Enter' && !playing) start();
  });
  $('playBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', start);
  $('bestStart').textContent = best() ? 'En iyi skorun: ' + best() : '';
  addEventListener('resize', () => { layout(); sizeFx(); });
  layout(); sizeFx(); requestAnimationFrame(frame);
})();
</script>
<script data-goatcounter="https://erdevelop.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
