<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; height: 100%; background: #0c1015; overflow: hidden; }
    canvas { display: block; }

  <canvas id="c"></canvas>

    const c = document.getElementById('c'), g = c.getContext('2d');
    const fit = () => { c.width = innerWidth; c.height = innerHeight; };
    fit(); addEventListener('resize', fit);

    const balls = Array.from({ length: 40 }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      vx: (Math.random() - .5) * 4, vy: (Math.random() - .5) * 4,
      r: 6 + Math.random() * 14, h: Math.random() * 360
    }));

    (function loop() {
      g.fillStyle = 'rgba(12,16,21,.25)';
      g.fillRect(0, 0, c.width, c.height);
      for (const b of balls) {
        b.x += b.vx; b.y += b.vy;
        if (b.x < b.r || b.x > c.width - b.r) b.vx *= -1;
        if (b.y < b.r || b.y > c.height - b.r) b.vy *= -1;
        g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        g.fillStyle = 'hsl(' + b.h + ',80%,60%)'; g.fill();
      }
      requestAnimationFrame(loop);
    })();
  <\/script>
</body>
</html>
` },

    { n: 'Merhaba dünya', d: 'print, döngü, f-string', c: `# Python tarayıcıda çalışıyor (Pyodide)
isim = "erdevelop"
print(f"Merhaba {isim}!")

for i in range(1, 6):
    print(i, "x", i, "=", i * i)

kareler = [n ** 2 for n in range(10)]
print("kareler:", kareler)
print("toplam:", sum(kareler))
` },
    { n: 'input() ile soru', d: 'kullanıcıdan değer al', c: `ad = input("Adın ne? ")
yas = int(input("Kaç yaşındasın? "))
print(f"Merhaba {ad}, 10 yıl sonra {yas + 10} yaşında olacaksın.")
` },
    { n: 'Cam ağırlığı', d: 'fonksiyon + tablo çıktısı', c: `def cam_agirlik(gen_mm, yuk_mm, dizilim):
    """dizilim: '8+16+44.2' gibi. Boşluklar (12, 14, 16...) ağırlığa katılmaz."""
    katmanlar = [float(x) for x in dizilim.split("+")]
    cam = 0.0
    for k in katmanlar:
        if k in (6, 8, 9, 10, 12, 14, 15, 16, 18, 20, 24) and len(katmanlar) > 1 and katmanlar.index(k) % 2 == 1:
            continue  # ara boşluk
        if k > 10 and k % 1:          # 44.2 gibi lamine
            k = int(k) // 10 + int(k) % 10 + 0.38 * int(round(k % 1 * 10))
        cam += k
    m2 = gen_mm * yuk_mm / 1e6
    return m2, m2 * cam * 2.5

paneller = [("P1", 1200, 2400, "8+16+8"), ("P2", 1500, 3000, "10+16+44.2"), ("P3", 900, 2100, "6+12+6")]
print(f"{'Kod':<4} {'m²':>6} {'kg':>8}")
print("-" * 20)
toplam = 0
for kod, g, y, d in paneller:
    m2, kg = cam_agirlik(g, y, d)
    toplam += kg
    print(f"{kod:<4} {m2:>6.2f} {kg:>8.1f}")
print("-" * 20)
print(f"{'':<4} {'':>6} {toplam:>8.1f}")
` },
    { n: 'NumPy', d: 'dizi işlemleri (ilk sefer paket indirir)', c: `import numpy as np

a = np.arange(12).reshape(3, 4)
print(a)
print("satır toplamları:", a.sum(axis=1))
print("ortalama:", a.mean())

A = np.array([[2, 1], [1, 3]])
b = np.array([3, 5])
print("Ax = b çözümü:", np.linalg.solve(A, b))
` },
    { n: 'Matplotlib grafik', d: 'grafik konsolda görüntülenir', c: `import numpy as np
import matplotlib.pyplot as plt

x = np.linspace(0, 2 * np.pi, 200)
plt.figure(figsize=(7, 3.5))
plt.plot(x, np.sin(x), label="sin")
plt.plot(x, np.cos(x), label="cos")
plt.title("Trigonometri")
plt.legend()
plt.grid(alpha=.3)
plt.show()

plt.figure(figsize=(5, 3))
plt.bar(["P1", "P2", "P3", "P4"], [72, 135, 41, 98], color="#5aa9ff")
plt.title("Panel ağırlıkları (kg)")
plt.show()
` },
    { n: 'Sınıflar ve hata', d: 'class, try/except, traceback', c: `class Profil:
    def __init__(self, kod, boy):
        self.kod = kod
        self.boy = boy

    def __repr__(self):
        return f"Profil({self.kod!r}, {self.boy} mm)"

stok = [Profil("AL-120", 6000), Profil("AL-80", 6500)]
print(stok)

try:
    print(10 / 0)
except ZeroDivisionError as e:
    print("yakalandı:", e)

# Yakalanmayan hata: konsolda kırmızı görünür
stok[5]
` }
  ]
};

/* ---------- durum ---------- */
const LANG = {
  html: { file: 'index.html', mode: 'htmlmixed', ext: 'html', mime: 'text/html', indent: 2 },
  python: { file: 'main.py', mode: 'python', ext: 'py', mime: 'text/x-python', indent: 4 }
};
let lang = store.get(KEY + '-lang') || 'html';
if (!LANG[lang]) lang = 'html';
const code = {}; for (const k in LANG) code[k] = store.get(KEY + '-' + k) ?? EX[k][0].c;
let fontSize = +(store.get(KEY + '-fs') || 13.5);

/* ---------- editör ---------- */
const docs = {};
for (const k in LANG) docs[k] = CodeMirror.Doc(code[k], LANG[k].mode);
const cm = CodeMirror($('edwrap'), {
  value: docs[lang], lineNumbers: true, indentUnit: LANG[lang].indent, tabSize: 4, indentWithTabs: false,
  autoCloseBrackets: true, matchBrackets: true, autoCloseTags: true, matchTags: { bothTags: true },
  styleActiveLine: true, lineWrapping: false, viewportMargin: 50,
  extraKeys: {
    'Ctrl-Enter': () => run(), 'Cmd-Enter': () => run(), 'Shift-Enter': () => run(),
    'Ctrl-/': 'toggleComment', 'Cmd-/': 'toggleComment', 'Ctrl-S': () => (save(), false), 'Cmd-S': () => (save(), false),
    Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection(' '.repeat(c.getOption('indentUnit')), 'end'),
    'Shift-Tab': c => c.indentSelection('subtract')
  }
});
cm.swapDoc(docs[lang]);
function applyFont() { cm.getWrapperElement().style.fontSize = fontSize + 'px'; cm.refresh(); }
applyFont();
$('fmtBtn').onclick = () => { fontSize = fontSize >= 18 ? 12 : fontSize + 1.5; store.set(KEY + '-fs', fontSize); applyFont(); toast(fontSize + ' px'); };

let saveT, liveT;
cm.on('change', () => {
  clearTimeout(saveT); saveT = setTimeout(() => store.set(KEY + '-' + lang, cm.getValue()), 300);
  updMeta();
  if (lang === 'html' && $('autoRun').checked) { clearTimeout(liveT); liveT = setTimeout(runHtml, 600); }
});
function updMeta() { $('edMeta').textContent = cm.lineCount() + ' satır'; }

/* ---------- dil değiştir ---------- */
function setLang(l, first) {
  if (!first) store.set(KEY + '-' + lang, cm.getValue());
  lang = l; store.set(KEY + '-lang', l);
  cm.swapDoc(docs[l]); cm.setOption('indentUnit', LANG[l].indent);
  document.querySelectorAll('.langs button').forEach(b => { b.classList.toggle('on', b.dataset.lang === l); b.setAttribute('aria-selected', b.dataset.lang === l); });
  $('edTitle').textContent = LANG[l].file;
  $('outHtml').hidden = l !== 'html'; $('outPy').hidden = l !== 'python';
  $('autoWrap').hidden = l !== 'html';
  $('outTitle').textContent = l === 'html' ? 'Önizleme' : 'Konsol';
  buildExamples(); updMeta(); refreshStatus();
  if (l === 'python') loadPy();
  else if (!htmlRanOnce) runHtml();
  cm.focus();
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => b.dataset.lang !== lang && setLang(b.dataset.lang));

/* ---------- HTML ---------- */
let htmlRanOnce = false, runId = 0, conCount = { log: 0, err: 0 };
const BRIDGE = id => `<script>(function(){var P=function(t,a){try{parent.postMessage({__er:${id},t:t,a:a},'*')}catch(e){}};
var f=function(v){try{if(v instanceof Error)return v.name+': '+v.message;if(typeof v==='object'&&v!==null){if(v instanceof Node)return '<'+(v.nodeName||'').toLowerCase()+'>';return JSON.stringify(v,null,1).replace(/\\n\\s*/g,' ')}return String(v)}catch(e){return String(v)}};
['log','info','warn','error','debug'].forEach(function(k){var o=console[k];console[k]=function(){P(k,[].map.call(arguments,f).join(' '));o&&o.apply(console,arguments)}});
console.clear=function(){P('clear','')};
addEventListener('error',function(e){P('error',(e.message||'Hata')+(e.lineno?' (satır '+e.lineno+')':''))});
addEventListener('unhandledrejection',function(e){P('error','Promise: '+f(e.reason))});})();<\/script>`;
function injectBridge(src, id) {
  const b = BRIDGE(id);
  if (/<head[^>]*>/i.test(src)) return src.replace(/<head[^>]*>/i, m => m + b);
  if (/<html[^>]*>/i.test(src)) return src.replace(/<html[^>]*>/i, m => m + b);
  if (/^\s*<!doctype[^>]*>/i.test(src)) return src.replace(/^\s*<!doctype[^>]*>/i, m => m + b);
  return b + src;
}
function runHtml() {
  htmlRanOnce = true;
  const src = lang === 'html' ? cm.getValue() : docs.html.getValue();
  runId++;
  clearHtmlCon();
  $('frame').srcdoc = injectBridge(src, runId);
  setStatus('ok', 'çalıştı · ' + new Date().toLocaleTimeString('tr-TR'));
}
function clearHtmlCon() { $('conHtml').innerHTML = ''; conCount = { log: 0, err: 0 }; updConCount(); }
function updConCount() { $('conCount').innerHTML = (conCount.log ? `<span class="badge">${conCount.log}</span> ` : '') + (conCount.err ? `<span class="badge e">${conCount.err} hata</span>` : ''); }
addEventListener('message', e => {
  const d = e.data; if (!d || d.__er !== runId || e.source !== $('frame').contentWindow) return;
  if (d.t === 'clear') return clearHtmlCon();
  const cls = d.t === 'error' ? 'err' : d.t === 'warn' ? 'warn' : d.t === 'info' ? 'info' : '';
  addLine($('conHtml'), d.a, cls);
  if (cls === 'err') { conCount.err++; $('htmlCon').classList.remove('mini-h'); } else conCount.log++;
  updConCount();
});
$('htmlConH').onclick = () => { $('htmlCon').classList.toggle('mini-h'); $('conToggle').textContent = $('htmlCon').classList.contains('mini-h') ? '▸' : '▾'; store.set(KEY + '-conmin', $('htmlCon').classList.contains('mini-h') ? '1' : ''); };
if (store.get(KEY + '-conmin')) { $('htmlCon').classList.add('mini-h'); $('conToggle').textContent = '▸'; }
$('autoRun').checked = store.get(KEY + '-live') !== '0';
$('autoRun').onchange = () => { store.set(KEY + '-live', $('autoRun').checked ? '1' : '0'); if ($('autoRun').checked) runHtml(); };

function addLine(box, text, cls) {
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  const s = document.createElement('span'); s.className = 'ln ' + (cls || ''); s.textContent = text; box.appendChild(s);
  if (atBottom) box.scrollTop = box.scrollHeight;
  return s;
}

/* ---------- Python (Pyodide) ---------- */
let py = null, pyLoading = null, pyBusy = false, pyLine = null;
const dec = new TextDecoder();
function pyOut(text, cls) {
  const box = $('conPy');
  // Aynı türde açık satır varsa ona ekle (print(..., end='') ve input istemi için)
  const parts = text.split('\n');
  parts.forEach((p, i) => {
    if (i > 0) pyLine = null;
    if (!p && i < parts.length - 1) { if (!pyLine) addLine(box, '', cls); return; }
    if (!p) return;
    if (pyLine && pyLine.dataset.c === (cls || '')) { pyLine.appendChild(document.createTextNode(p)); }
    else if (pyLine) { const s = document.createElement('span'); s.className = 'ln ' + (cls || ''); s.style.display = 'inline'; s.textContent = p; pyLine.appendChild(s); }
    else { pyLine = addLine(box, p, cls); pyLine.dataset.c = cls || ''; }
  });
  if (text.endsWith('\n')) pyLine = null;
  box.scrollTop = box.scrollHeight;
}
function loadPy() {
  if (py || pyLoading) return pyLoading;
  setStatus('busy', 'Python yükleniyor…');
  if (!$('conPy').childNodes.length) pyOut('Python ortamı indiriliyor (ilk sefer ~10 MB, sonra tarayıcı önbelleğinden gelir)…\n', 'sys');
  pyLoading = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = PYODIDE + 'pyodide.js';
    s.onload = res; s.onerror = () => rej(new Error('pyodide.js yüklenemedi (internet bağlantısını kontrol et)'));
    document.head.appendChild(s);
  }).then(() => loadPyodide({ indexURL: PYODIDE })).then(p => {
    py = p;
    py.setStdout({ write: buf => { pyOut(dec.decode(buf, { stream: true })); return buf.length; } });
    py.setStderr({ write: buf => { pyOut(dec.decode(buf, { stream: true }), 'err'); return buf.length; } });
    py.setStdin({ stdin: () => {
      const q = pyLine ? pyLine.textContent : '';
      const v = prompt(q || 'input()', '');
      if (v === null) { pyLine = null; throw new Error('input iptal edildi'); }
      pyOut(v + '\n', 'in'); return v + '\n';
    }, isatty: true });
    py.globals.set('__er_img', src => { const box = $('conPy'); const img = new Image(); img.src = 'data:image/png;base64,' + src; img.alt = 'grafik'; box.appendChild(img); pyLine = null; img.onload = () => box.scrollTop = box.scrollHeight; });
    py.runPython(`
import sys, io, base64
def __er_figs():
    plt = sys.modules.get('matplotlib.pyplot')
    if not plt: return
    for n in plt.get_fignums():
        b = io.BytesIO(); plt.figure(n).savefig(b, format='png', dpi=110, bbox_inches='tight'); __er_img(base64.b64encode(b.getvalue()).decode())
    plt.close('all')
def __er_patch():
    plt = sys.modules.get('matplotlib.pyplot')
    if plt and getattr(plt.show, '__name__', '') != '__er_show':
        def __er_show(*a, **k): __er_figs()
        plt.show = __er_show
`);
    pyOut(`Python ${py.runPython('import sys; sys.version.split()[0]')} hazır · Pyodide ${py.version}\n`, 'sys');
    refreshStatus();
    return py;
  }).catch(e => { pyLoading = null; pyOut('Hata: ' + e.message + '\n', 'err'); setStatus('bad', 'yüklenemedi'); throw e; });
  return pyLoading;
}
function cleanTb(msg) {
  const lines = msg.split('\n');
  const i = lines.findIndex(l => l.includes('File "<exec>"'));
  if (i < 0) return msg;
  return ['Traceback (most recent call last):', ...lines.slice(i)].join('\n').trimEnd();
}
async function runPy() {
  if (pyBusy) return;
  const src = cm.getValue();
  pyBusy = true; $('runBtn').disabled = true;
  try {
    await loadPy();
    if ($('conPy').childNodes.length) pyOut('\n', 'sys');
    pyLine = null;
    const t0 = performance.now();
    setStatus('busy', 'paketler kontrol ediliyor…');
    await py.loadPackagesFromImports(src, { messageCallback: m => /Loading|Loaded/.test(m) && setStatus('busy', m.slice(0, 60)), errorCallback: m => pyOut(m + '\n', 'warn') });
    if (/\bmatplotlib\b/.test(src)) { py.runPython("import os; os.environ['MPLBACKEND']='AGG'\nimport matplotlib; matplotlib.use('AGG')\nimport matplotlib.pyplot\n__er_patch()"); }
    setStatus('busy', 'çalışıyor…');
    await new Promise(r => setTimeout(r, 20));
    const ns = py.globals.get('dict')();
    ns.set('__name__', '__main__');
    try {
      await py.runPythonAsync(src, { globals: ns, filename: '<exec>' });
      py.runPython('__er_figs()');
      pyLine = null;
      pyOut(`— bitti · ${((performance.now() - t0) / 1000).toFixed(2)} sn\n`, 'sys');
      setStatus('ok', 'tamam · ' + new Date().toLocaleTimeString('tr-TR'));
    } catch (e) {
      py.runPython('__er_figs()');
      pyLine = null;
      pyOut(cleanTb(String(e.message || e)) + '\n', 'err');
      setStatus('bad', 'hata');
    } finally { ns.destroy(); }
  } catch (e) { /* yükleme hatası zaten yazıldı */ }
  finally { pyBusy = false; $('runBtn').disabled = false; }
}

/* ---------- ortak ---------- */
function run() { store.set(KEY + '-' + lang, cm.getValue()); lang === 'html' ? runHtml() : runPy(); }
$('runBtn').onclick = run;
$('clearBtn').onclick = () => { if (lang === 'html') clearHtmlCon(); else { $('conPy').innerHTML = ''; pyLine = null; } };
function setStatus(k, t) { $('dot').className = 'dot ' + k; $('statusT').textContent = t; }
function refreshStatus() {
  if (lang === 'python') { if (py) setStatus('ok', 'Python hazır'); else if (pyLoading) setStatus('busy', 'Python yükleniyor…'); else setStatus('', ''); }
  else setStatus(htmlRanOnce ? 'ok' : '', htmlRanOnce ? 'önizleme' : '');
}

function buildExamples() {
  $('exMenu').innerHTML = `<div class="lbl">${lang === 'html' ? 'HTML' : 'Python'} örnekleri</div>` + EX[lang].map((e, i) => `<button type="button" data-i="${i}">${esc(e.n)}<small>${esc(e.d)}</small></button>`).join('');
}
$('exMenu').onclick = e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const ex = EX[lang][+b.dataset.i];
  if (cm.getValue().trim() && cm.getValue() !== ex.c && !EX[lang].some(x => x.c === cm.getValue()) && !confirm('Editördeki kod örnekle değiştirilsin mi?')) return closeMenus();
  cm.setValue(ex.c); cm.clearHistory(); closeMenus(); run();
};

function toggleMenu(btn, menu) { const open = menu.hidden; closeMenus(); menu.hidden = !open; }
function closeMenus() { $('exMenu').hidden = true; $('fileMenu').hidden = true; }
$('exBtn').onclick = e => { e.stopPropagation(); toggleMenu($('exBtn'), $('exMenu')); };
$('fileBtn').onclick = e => { e.stopPropagation(); toggleMenu($('fileBtn'), $('fileMenu')); };
document.addEventListener('click', e => { if (!e.target.closest('.dd')) closeMenus(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

function download(name, text, mime) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function save() { download(LANG[lang].file, cm.getValue(), LANG[lang].mime); toast(LANG[lang].file + ' indirildi'); }
$('fileMenu').onclick = async e => {
  const b = e.target.closest('button[data-f]'); if (!b) return; closeMenus();
  const f = b.dataset.f;
  if (f === 'save') save();
  else if (f === 'open') $('fileIn').click();
  else if (f === 'copy') { try { await navigator.clipboard.writeText(cm.getValue()); toast('kopyalandı'); } catch (err) { cm.execCommand('selectAll'); toast('Ctrl+C ile kopyala'); } }
  else if (f === 'newtab') { const w = window.open(URL.createObjectURL(new Blob([docs.html.getValue()], { type: 'text/html' })), '_blank'); if (!w) toast('açılır pencere engellendi'); }
  else if (f === 'blank') { if (confirm('Editör temizlensin mi?')) { cm.setValue(lang === 'html' ? '<!doctype html>\n<html lang="tr">\n<head>\n  <meta charset="utf-8">\n  <title></title>\n</head>\n<body>\n  \n</body>\n</html>\n' : ''); if (lang === 'html') cm.setCursor(7, 2); cm.focus(); } }
};
$('fileIn').onchange = async () => {
  const f = $('fileIn').files[0]; $('fileIn').value = ''; if (!f) return;
  const text = await f.text();
  const l = /\.py$/i.test(f.name) ? 'python' : 'html';
  if (l !== lang) setLang(l);
  cm.setValue(text); cm.clearHistory(); toast(f.name + ' açıldı'); run();
};

let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1600); }

/* ---------- bölme çubuğu ---------- */
(() => {
  const g = $('gutter'), m = $('main');
  const sv = store.get(KEY + '-split'); if (sv) m.style.setProperty('--split', sv);
  g.addEventListener('pointerdown', e => {
    g.setPointerCapture(e.pointerId); g.classList.add('drag'); $('frame').style.pointerEvents = 'none';
    const r = m.getBoundingClientRect();
    const mv = ev => { const p = Math.min(80, Math.max(20, (ev.clientX - r.left - 16) / (r.width - 32) * 100)); m.style.setProperty('--split', p.toFixed(1) + '%'); };
    const up = () => { g.classList.remove('drag'); $('frame').style.pointerEvents = ''; g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', up); store.set(KEY + '-split', m.style.getPropertyValue('--split')); cm.refresh(); };
    g.addEventListener('pointermove', mv); g.addEventListener('pointerup', up);
  });
})();

/* ---------- tema / başlat ---------- */
let mode = store.get('erdevelop-mode') || 'dark';
function applyMode() { document.documentElement.dataset.mode = mode; $('modeBtn').textContent = mode === 'dark' ? 'LIGHT' : 'DARK'; }
$('modeBtn').onclick = () => { mode = mode === 'dark' ? 'light' : 'dark'; store.set('erdevelop-mode', mode); applyMode(); };
applyMode();
setLang(lang, true);
})();
</script>
