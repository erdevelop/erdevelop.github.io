    --ok: #3fd37a; --bad: #ff5f52; --warn: #f0c04b;

  .brand { font: 700 15px var(--f-display); letter-spacing: 1px; text-transform: uppercase; text-decoration: none; color: inherit; }

  .crumb { font: 400 12px var(--f-mono); color: var(--muted); } .crumb a { color: inherit; text-decoration: none; }
  .sp { flex: 1; }

  .CodeMirror-activeline-background { background: color-mix(in srgb, var(--accent) 5%, transparent); }
  .CodeMirror-matchingbracket { color: var(--ok) !important; outline: 1px solid color-mix(in srgb, var(--ok) 50%, transparent); }
  .CodeMirror-matchingtag { background: var(--accent-dim); }

  .cm-s-default .cm-bracket { color: var(--muted); } .cm-s-default .cm-error { color: var(--bad); } .cm-s-default .cm-variable { color: var(--fg); }
  .cm-s-default .cm-header { color: var(--c-def); font-weight: 600; } .cm-s-default .cm-link, .cm-s-default .cm-url { color: var(--c-var2); } .cm-s-default .cm-quote { color: var(--c-str); }
  .cm-s-default .cm-strong { font-weight: 700; } .cm-s-default .cm-em { font-style: italic; } .cm-s-default .cm-hr { color: var(--muted); }

  .out { display: flex; flex-direction: column; min-height: 0; flex: 1; }

  .htmlcon { flex: none; height: 30%; min-height: 70px; border-top: 1px solid var(--line); display: flex; flex-direction: column; }

  .htmlcon .conh { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 12px; background: var(--panel-2); border-bottom: 1px solid var(--line); font: 500 11px var(--f-mono); color: var(--muted); text-transform: uppercase; cursor: pointer; user-select: none; }
  .htmlcon.mini-h .con { display: none; }
  .htmlcon.mini-h .conh { border-bottom: 0; }
  .ln { display: block; min-height: 1.5em; }
  .ln.err { color: var(--bad); } .ln.warn { color: var(--warn); } .ln.sys { color: var(--muted); font-style: italic; } .ln.in { color: var(--accent); } .ln.info { color: var(--c-var2); }
  .ln.ret { color: var(--c-var2); }
  .con img, .con canvas { display: block; max-width: 100%; height: auto; margin: 8px 0; border-radius: 6px; background: #fff; border: 1px solid var(--line); }
  .con .tw { overflow: auto; margin: 6px 0 10px; border: 1px solid var(--line); border-radius: 6px; max-height: 420px; white-space: normal; }
  .con table { border-collapse: collapse; font: 400 12.5px var(--f-mono); font-variant-numeric: tabular-nums; min-width: 100%; }
  .con th { position: sticky; top: 0; background: var(--panel-2); text-align: left; font-weight: 500; color: var(--muted); padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .con td { padding: 4px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  .con td.n { text-align: right; } .con td.null { color: var(--muted); font-style: italic; }
  .con .sep { display: block; border-top: 1px dashed var(--line); margin: 10px 0 8px; }
  .con .ask { display: block; white-space: normal; margin: 6px 0 10px; padding: 11px 13px; border: 1px solid var(--line); border-left: 3px solid var(--hot); border-radius: 6px; background: var(--panel-2); font: 400 13px/1.5 var(--f-body); color: var(--text); max-width: 560px; }
  .con .ask > b { display: block; font: 600 13.5px var(--f-body); color: var(--fg); margin-bottom: 3px; }
  .con .ask ul { margin: 6px 0 2px; padding: 0; list-style: none; font: 400 12px/1.6 var(--f-mono); }
  .con .ask li { display: flex; gap: 12px; border-bottom: 1px dotted var(--line); } .con .ask li span:first-child { flex: 1; } .con .ask li.dep { color: var(--muted); }
  .con .ask .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .con .ask.done { border-left-color: var(--line); opacity: .8; }
  .con .html { white-space: normal; overflow: auto; margin: 6px 0 10px; max-height: 420px; }
  .con .html table { border: 1px solid var(--line); min-width: 0; }
  .con .html th, .con .html td { border-bottom: 1px solid var(--grid); text-align: right; }
  .badge { font: 500 10.5px var(--f-mono); padding: 1px 6px; border-radius: 3px; background: var(--grid); color: var(--muted); }
  .badge.e { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .status { font: 400 11.5px var(--f-mono); color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; overflow: hidden; }
  .status span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); } .dot.busy { background: var(--hot); animation: pulse 1s infinite; } .dot.bad { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  .kbd { font: 400 10.5px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font: 500 12.5px var(--f-mono); z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 860px) {
    body { height: auto; min-height: 100%; }
    main { grid-template-columns: 1fr; grid-template-rows: 55vh 10px 60vh; }
    .gutter { pointer-events: none; } .gutter::after { display: none; }
    .crumb { display: none; }
    .hide-s { display: none; }
  }
</style>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'erdevelop-code';
const EX = window.CODE_EXAMPLES;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error(src.split('/').slice(2, 3) + ' yüklenemedi (internet bağlantısını kontrol et)')); document.head.appendChild(s); });

/* Prolog için basit sözdizimi renklendirme */
CodeMirror.defineSimpleMode('prolog', {
  start: [
    { regex: /%.*/, token: 'comment' }, { regex: /\/\*/, token: 'comment', next: 'comment' },
    { regex: /"(?:[^\\"]|\\.)*"?/, token: 'string' }, { regex: /'(?:[^\\']|\\.)*'?/, token: 'string' },
    { regex: /0'.|\d+(?:\.\d+)?(?:e[+-]?\d+)?/i, token: 'number' },
    { regex: /:-|\?-|-->/, token: 'keyword' }, { regex: /\b(?:is|mod|rem|not|true|fail|false|halt)\b/, token: 'keyword' },
    { regex: /[A-Z_][A-Za-z0-9_]*/, token: 'variable-2' }, { regex: /[a-z][A-Za-z0-9_]*(?=\()/, token: 'def' }, { regex: /[a-z][A-Za-z0-9_]*/, token: 'atom' }
  ],
  comment: [{ regex: /.*?\*\//, token: 'comment', next: 'start' }, { regex: /.*/, token: 'comment' }],
  meta: { lineComment: '%' }
});

/* ---------- konsol ---------- */
class Con {
  constructor(el) { this.el = el; this.line = null; }
  get empty() { return !this.el.childNodes.length; }
  write(text, cls = '') {
    text = String(text);

        catch (e) { throw new Error(String(e.message || e).replace(/^Error in .*?: ?/, 'Hata: ')); }
        for (const o of res.output) c.write(o.data + '\n', o.type === 'stderr' ? 'warn' : '');
        for (const img of res.images || []) { const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height; cv.getContext('2d').drawImage(img, 0, 0); c.node(cv); }
      } finally { sh.purge(); }
    } },
  php: { name: 'PHP', color: '#777bb3', file: 'index.php', mode: 'application/x-httpd-php', mime: 'application/x-php', indent: 4, ext: ['php'], size: '5 MB',
    async load() {
      const { PhpWeb } = await import('https://cdn.jsdelivr.net/npm/php-wasm@0.0.8/PhpWeb.mjs');
      const php = new PhpWeb();
      await new Promise(r => php.addEventListener('ready', r, { once: true }));
      php.addEventListener('output', e => this.cur && this.cur.write(e.detail.join('')));
      php.addEventListener('error', e => this.cur && this.cur.write(e.detail.join(''), 'err'));
      this.rt = php;
      let v = ''; this.cur = { write: t => { v += t; }, end() {} };
      await php.run('<?php echo PHP_VERSION;'); php.flush(); this.cur = null;
      return 'PHP ' + v.trim();
    },
    async run(src, c) {
      const php = this.rt; this.cur = c;
      try { await php.refresh(); const code = await php.run(src); php.flush(); c.end(); if (code) throw Object.assign(new Error('çıkış kodu ' + code), { soft: true }); }
      finally { this.cur = null; }
    } },
  ruby: { name: 'Ruby', color: '#cc342d', file: 'main.rb', mode: 'ruby', mime: 'text/x-ruby', indent: 2, ext: ['rb'], size: '36 MB',
    async load() {
      const { DefaultRubyVM } = await import('https://cdn.jsdelivr.net/npm/@ruby/wasm-wasi@2.7.0/dist/browser/+esm');
      const mod = await WebAssembly.compileStreaming(fetch('https://cdn.jsdelivr.net/npm/@ruby/3.3-wasm-wasi@2.7.0/dist/ruby+stdlib.wasm'));
      const { vm } = await DefaultRubyVM(mod, { consolePrint: false });
      vm.eval(`
require 'stringio'
begin; require 'js'; rescue LoadError; end
module Kernel
  def gets(*)
    out = $stdout.respond_to?(:string) ? $stdout.string : ''
    v = JS.global.call(:prompt, out.split("\\n", -1).last.to_s)
    return nil if v.typeof == 'object'
    s = v.to_s; $stdout.print(s + "\\n"); s + "\\n"
  end
end
module ErRun
  def self.run(b64)
    src = b64.unpack1('m').force_encoding('UTF-8')
    out = StringIO.new; $stdout = out; $stderr = out; err = ''
    begin
      TOPLEVEL_BINDING.eval(src, 'main.rb', 1)
    rescue Exception => e
      bt = (e.backtrace || []).select { |l| l.start_with?('main.rb') }.first(4)
      err = "#{e.class}: #{e.message}" + (bt.empty? ? '' : "\\n  " + bt.join("\\n  "))
    ensure
      $stdout = STDOUT; $stderr = STDERR
    end
    out.string + "\\u0000" + err
  end
end`);
      this.rt = vm;
      return 'Ruby ' + vm.eval('RUBY_VERSION').toString();
    },
    async run(src, c) {
      const bytes = new TextEncoder().encode(src); let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      const r = this.rt.eval(`ErRun.run("${btoa(bin)}")`).toString();
      const k = r.lastIndexOf('\u0000'), out = r.slice(0, k), err = r.slice(k + 1);
      if (out) c.write(out.endsWith('\n') ? out : out + '\n');
      if (err) throw new Error(err);
    } },
  prolog: { name: 'Prolog', color: '#a25d2a', file: 'main.pl', mode: 'prolog', mime: 'text/x-prolog', indent: 4, ext: ['pl', 'pro'], size: '0.4 MB',
    async load() {
      await loadScript('https://cdn.jsdelivr.net/npm/tau-prolog@0.3.4/modules/core.js');
      await loadScript('https://cdn.jsdelivr.net/npm/tau-prolog@0.3.4/modules/lists.js');
      return 'Tau Prolog ' + (window.pl.version ? Object.values(window.pl.version).join('.') : '0.3.4');
    },
    async run(src, c) {
      const pl = window.pl, s = pl.create(200000);
      s.standard_output.stream.put = t => { c.write(t); return true; };
      s.standard_error.stream.put = t => { c.write(t, 'err'); return true; };
      const queries = [], prog = src.split('\n').map(l => { const m = l.match(/^\s*\?-\s*(.*)$/); if (m) { queries.push(m[1].trim()); return ''; } return l; }).join('\n');
      const fmt = x => { try { return s.format_answer(x); } catch (e) { return String(x); } };
      await new Promise((res, rej) => s.consult(':- use_module(library(lists)).\n' + prog, { success: res, error: e => rej(new Error('Program hatası: ' + fmt(e))) }));
      if (!queries.length) return c.write('Program yüklendi. Sorgu çalıştırmak için "?- hedef." satırı ekle.\n', 'sys');
      for (const q of queries) {
        c.end(); c.write('?- ' + q + '\n', 'in');
        const ok = await new Promise(res => s.query(q.endsWith('.') ? q : q + '.', { success: () => res(true), error: e => { c.write(fmt(e) + '\n', 'err'); res(false); } }));
        if (!ok) continue;
        for (let i = 0; i < 25; i++) {
          const more = await new Promise(res => s.answer({
            success: a => { c.end(); c.write(fmt(a) + '\n', 'ret'); res(true); },
            fail: () => { c.end(); c.write((i ? 'başka çözüm yok' : 'false.') + '\n', i ? 'sys' : 'warn'); res(false); },
            error: e => { c.end(); c.write(fmt(e) + '\n', 'err'); res(false); },
            limit: () => { c.end(); c.write('adım sınırı aşıldı (sonsuz döngü?)\n', 'err'); res(false); }
          }));
          if (!more) break;
          if (i === 24) c.write('… ilk 25 çözüm gösterildi\n', 'sys');
        }
      }
    } },
  scheme: { name: 'Scheme', color: '#7b4fa0', file: 'main.scm', mode: 'scheme', mime: 'text/x-scheme', indent: 2, ext: ['scm', 'ss', 'rkt'], size: '0.4 MB',
    async load() {
      await loadScript('https://cdn.jsdelivr.net/npm/biwascheme@0.8.0/release/biwascheme-min.js');
      return 'BiwaScheme ' + (window.BiwaScheme.Version || window.BiwaScheme.VERSION || '');
    },
    run(src, c) {
      const B = window.BiwaScheme;
      B.Port.current_output = new B.Port.CustomOutput(t => c.write(t));
      return new Promise((resolve, reject) => {
        let done = false;
        const intp = new B.Interpreter(e => { if (done) return; done = true; reject(new Error(String(e.message || e).replace(/^Error: /, ''))); });
        try {
          intp.evaluate(src, r => {
            if (done) return; done = true;
            if (r !== undefined && r !== B.undef && r !== B.Undef) { c.end(); c.write('=> ' + B.to_write(r) + '\n', 'ret'); }
            resolve();

        } catch (e) { if (!done) { done = true; reject(new Error(String(e.message || e))); } }
      });
    } }
};
const ORDER = ['html', 'markdown', 'javascript', 'typescript', 'python', 'sql', 'lua', 'r', 'php', 'ruby', 'prolog', 'scheme'];

/* ---------- durum ---------- */
let lang = store.get(KEY + '-lang'); if (!L[lang]) lang = 'html';
let fontSize = +(store.get(KEY + '-fs') || 13.5);
const docs = {};
const getDoc = l => docs[l] || (docs[l] = CodeMirror.Doc(store.get(KEY + '-' + l) ?? EX[l][0].c, L[l].mode));
const loading = {}, ready = {}, busy = {}, stat = {};

$('langbar').innerHTML = ORDER.map(l => `<button type="button" role="tab" data-lang="${l}" title="${L[l].size ? 'ilk açılışta ~' + L[l].size + ' indirir' : 'ek indirme yok'}"><i style="background:${L[l].color}"></i>${L[l].name}</button>`).join('');
$('langbar').onclick = e => { const b = e.target.closest('button[data-lang]'); if (b && b.dataset.lang !== lang) setLang(b.dataset.lang); };

/* ---------- editör ---------- */
const cm = CodeMirror($('edwrap'), {
  value: '', lineNumbers: true, tabSize: 4, indentWithTabs: false,
  autoCloseBrackets: true, matchBrackets: true, autoCloseTags: true, matchTags: { bothTags: true },
  styleActiveLine: true, lineWrapping: false, viewportMargin: 50,
  extraKeys: {
    'Ctrl-Enter': () => run(), 'Cmd-Enter': () => run(), 'Shift-Enter': () => run(),
    'Ctrl-/': 'toggleComment', 'Cmd-/': 'toggleComment', 'Ctrl-S': () => (save(), false), 'Cmd-S': () => (save(), false),
    Tab: c => c.somethingSelected() ? c.indentSelection('add') : c.replaceSelection(' '.repeat(c.getOption('indentUnit')), 'end'),
    'Shift-Tab': c => c.indentSelection('subtract')
  }
});
function applyFont() { cm.getWrapperElement().style.fontSize = fontSize + 'px'; cm.refresh(); }
applyFont();
$('fmtBtn').onclick = () => { fontSize = fontSize >= 18 ? 12 : fontSize + 1.5; store.set(KEY + '-fs', fontSize); applyFont(); toast(fontSize + ' px'); };

let saveT, liveT;
cm.on('change', () => {
  clearTimeout(saveT); saveT = setTimeout(() => store.set(KEY + '-' + lang, cm.getValue()), 300);
  updMeta();
  if (L[lang].live && $('autoRun').checked) { clearTimeout(liveT); liveT = setTimeout(() => run(true), 600); }
});
function updMeta() { $('edMeta').textContent = cm.lineCount() + ' satır'; }

function setLang(l, first) {
  if (!first) store.set(KEY + '-' + lang, cm.getValue());
  lang = l; store.set(KEY + '-lang', l);
  const R = L[l];
  cm.swapDoc(getDoc(l)); cm.setOption('indentUnit', R.indent);
  document.querySelectorAll('#langbar button').forEach(b => { const on = b.dataset.lang === l; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
  $('edTitle').textContent = R.file;
  const frame = R.out === 'frame';
  $('outFrame').hidden = !frame; $('outCon').hidden = frame;
  $('htmlCon').hidden = !!R.noConsole;
  for (const k in cons) cons[k].el.hidden = k !== l;
  if (!frame) con(l).el.hidden = false;
  $('autoWrap').hidden = !R.live;
  $('outTitle').textContent = frame ? 'Önizleme' : 'Konsol';
  $('stopBtn').hidden = !(R.stop && busy[l]);
  $('runBtn').disabled = !!busy[l];
  buildExamples(); updMeta(); paintStatus();
  if (frame) run(true);
  else ensure(l).catch(() => {});
  if (!first) cm.focus();
}

/* ---------- yükleme / çalıştırma ---------- */
function setStat(l, k, t) { stat[l] = [k, t]; if (l === lang) paintStatus(); }
function paintStatus() { const [k, t] = stat[lang] || ['', '']; $('dot').className = 'dot ' + k; $('statusT').textContent = t; }
function ensure(l) {
  const R = L[l];
  if (!R.load) ready[l] = true;
  if (ready[l]) return Promise.resolve();
  if (loading[l]) return loading[l];
  const c = R.out === 'frame' ? null : con(l);
  const okKey = KEY + '-ok-' + l;
  loading[l] = (async () => {
    if (c && R.size && !store.get(okKey)) {
      setStat(l, '', 'indirme onayı bekleniyor');
      const sz = R.size.replace('.', ',');
      const ok = await askDownload(c, `${R.name} ilk kullanımda indirilecek`,
        `${R.name} tarayıcında çalışmak için yaklaşık <b>${esc(sz)}</b> veri indirir. Sonraki açılışlarda tarayıcı önbelleğinden gelir.` +
        (parseFloat(R.size) >= 10 && /MB/.test(R.size) ? ' Mobil veride çekiyorsan Wi-Fi beklemek isteyebilirsin.' : ''), sz);
      if (!ok) throw cancelled('indirme iptal edildi');
      store.set(okKey, '1');
    }
    setStat(l, 'busy', R.name + ' yükleniyor…');
    if (c) c.write(`${R.name} ortamı yükleniyor${R.size ? ' (~' + R.size + ', ilk seferden sonra önbellekten)' : ''}…\n`, 'sys');
    return R.load(c);
  })().then(info => {
    ready[l] = true; loading[l] = null;
    if (c) { c.end(); c.write((info || R.name) + ' hazır\n', 'sys'); }
    setStat(l, 'ok', R.name + ' hazır');
  }).catch(e => {
    loading[l] = null;
    if (e && e.cancel) { setStat(l, '', 'indirilmedi'); throw e; }
    if (c) { c.end(); c.write('Yüklenemedi: ' + (e && e.message || e) + '\n', 'err'); }
    setStat(l, 'bad', 'yüklenemedi');
    throw e;
  });
  return loading[l];
}
async function run(auto) {
  const l = lang, R = L[l], src = cm.getValue();
  store.set(KEY + '-' + l, src);
  if (R.out === 'frame') {
    try { await ensure(l); R.run(src); setStat(l, 'ok', (auto ? 'güncellendi · ' : 'çalıştı · ') + new Date().toLocaleTimeString('tr-TR')); } catch (e) {}
    return;
  }
  if (busy[l]) return;
  busy[l] = true; if (l === lang) { $('runBtn').disabled = true; $('stopBtn').hidden = !R.stop; }
  const c = con(l);
  try {
    await ensure(l);
    c.sep();
    const t0 = performance.now();
    setStat(l, 'busy', 'çalışıyor…'); await sleep(15);
    await R.run(src, c, t => setStat(l, 'busy', t));
    c.end(); c.write(`— bitti · ${((performance.now() - t0) / 1000).toFixed(2)} sn\n`, 'sys');
    setStat(l, 'ok', 'tamam · ' + new Date().toLocaleTimeString('tr-TR'));
  } catch (e) {
    if (ready[l]) {
      c.end();
      if (!e.shown) c.write((e && e.message || String(e)) + '\n', e.message === 'durduruldu' || e.soft ? 'warn' : 'err');
      const soft = e.message === 'durduruldu' || e.cancel;
      setStat(l, soft ? '' : 'bad', soft ? e.message : 'hata');
    }
  } finally {
    busy[l] = false;
    if (l === lang) { $('runBtn').disabled = false; $('stopBtn').hidden = true; }
  }
}
$('runBtn').onclick = () => run();
$('clearBtn').onclick = () => { if (L[lang].out === 'frame') { htmlCon.clear(); conCount = { log: 0, err: 0 }; updConCount(); } else con(lang).clear(); };
$('autoRun').checked = store.get(KEY + '-live') !== '0';
$('autoRun').onchange = () => { store.set(KEY + '-live', $('autoRun').checked ? '1' : '0'); if ($('autoRun').checked) run(true); };

/* ---------- örnekler / dosya ---------- */
function buildExamples() {
  $('exMenu').innerHTML = `<div class="lbl">${esc(L[lang].name)} örnekleri</div>` + EX[lang].map((e, i) => `<button type="button" data-i="${i}">${esc(e.n)}<small>${esc(e.d)}</small></button>`).join('');
}
const isExample = v => EX[lang].some(x => x.c === v);
$('exMenu').onclick = e => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const ex = EX[lang][+b.dataset.i], v = cm.getValue();
  closeMenus();
  if (v.trim() && !isExample(v) && !confirm('Editördeki kod örnekle değiştirilsin mi?')) return;
  cm.setValue(ex.c); cm.clearHistory(); run();
};
function toggleMenu(menu) { const open = menu.hidden; closeMenus(); menu.hidden = !open; }
function closeMenus() { $('exMenu').hidden = true; $('fileMenu').hidden = true; }
$('exBtn').onclick = e => { e.stopPropagation(); toggleMenu($('exMenu')); };
$('fileBtn').onclick = e => { e.stopPropagation(); toggleMenu($('fileMenu')); };
document.addEventListener('click', e => { if (!e.target.closest('.dd')) closeMenus(); });
addEventListener('keydown', e => { if (e.key === 'Escape') closeMenus(); });

function download(name, text, mime) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function save() { download(L[lang].file, cm.getValue(), L[lang].mime); toast(L[lang].file + ' indirildi'); }
$('fileMenu').onclick = async e => {
  const b = e.target.closest('button[data-f]'); if (!b) return; closeMenus();
  const f = b.dataset.f;
  if (f === 'save') save();
  else if (f === 'open') $('fileIn').click();
  else if (f === 'copy') { try { await navigator.clipboard.writeText(cm.getValue()); toast('kopyalandı'); } catch (err) { cm.execCommand('selectAll'); toast('Ctrl+C ile kopyala'); } }
  else if (f === 'newtab') {
    let h = null;
    if (lang === 'markdown') { await ensure('markdown').catch(() => {}); if (window.marked) h = mdDoc(cm.getValue()); }
    else if (lang === 'html') h = cm.getValue();
    if (!h) return toast('sadece HTML ve Markdown');
    const w = window.open(URL.createObjectURL(new Blob([h], { type: 'text/html' })), '_blank'); if (!w) toast('açılır pencere engellendi');
  }
  else if (f === 'reset') { if (confirm(L[lang].name + ' örneği yüklensin mi? Editördeki kod silinir.')) { cm.setValue(EX[lang][0].c); cm.clearHistory(); run(); } }
  else if (f === 'blank') { if (confirm('Editör temizlensin mi?')) { cm.setValue(lang === 'html' ? '<!doctype html>\n<html lang="tr">\n<head>\n  <meta charset="utf-8">\n  <title></title>\n</head>\n<body>\n  \n</body>\n</html>\n' : lang === 'php' ? '<?php\n\n' : ''); if (lang === 'html') cm.setCursor(7, 2); if (lang === 'php') cm.setCursor(1, 0); cm.focus(); } }
};
$('fileIn').accept = ORDER.flatMap(l => L[l].ext.map(x => '.' + x)).join(',') + ',.txt';
$('fileIn').onchange = async () => {
  const f = $('fileIn').files[0]; $('fileIn').value = ''; if (!f) return;
  const text = await f.text(), ext = (f.name.split('.').pop() || '').toLowerCase();
  const l = ORDER.find(k => L[k].ext.includes(ext)) || lang;
  if (l !== lang) setLang(l);
  cm.setValue(text); cm.clearHistory(); toast(f.name + ' açıldı');
};

let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1600); }

/* ---------- bölme çubuğu ---------- */
(() => {
  const g = $('gutter'), m = $('main');
  const sv = store.get(KEY + '-split'); if (sv) m.style.setProperty('--split', sv);
  g.addEventListener('pointerdown', e => {
    g.setPointerCapture(e.pointerId); g.classList.add('drag'); $('frame').style.pointerEvents = 'none';
    const r = m.getBoundingClientRect();
    const mv = ev => { const p = Math.min(80, Math.max(20, (ev.clientX - r.left - 16) / (r.width - 32) * 100)); m.style.setProperty('--split', p.toFixed(1) + '%'); };
    const up = () => { g.classList.remove('drag'); $('frame').style.pointerEvents = ''; g.removeEventListener('pointermove', mv); g.removeEventListener('pointerup', up); store.set(KEY + '-split', m.style.getPropertyValue('--split')); cm.refresh(); };
    g.addEventListener('pointermove', mv); g.addEventListener('pointerup', up);
  });
})();

/* ---------- tema / başlat ---------- */
let mode = store.get('erdevelop-mode') || 'dark';
function applyMode() { document.documentElement.dataset.mode = mode; $('modeBtn').textContent = mode === 'dark' ? 'LIGHT' : 'DARK'; }
$('modeBtn').onclick = () => { mode = mode === 'dark' ? 'light' : 'dark'; store.set('erdevelop-mode', mode); applyMode(); };
applyMode();
setLang(lang, true);
window.__code = { L, con, run, setLang, get lang() { return lang; }, cm, ready, busy };
})();
</script>
