<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<script src="../kilit.js" data-gate="../Tools.html"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cephe Metraj (web)</title>
<style>
:root{--bg:#eef0f2;--fg:#1b2127;--fieldbg:#fff;--bd:#b9c0c7;--selbg:#2f6fed;--selfg:#fff}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:12px "Segoe UI",Arial,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
#tk-root{flex:1 1 auto;display:flex;min-height:0;min-width:0;position:relative;overflow:hidden;background:var(--bg)}
#yukleme{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1b2127;color:#dfe5ea;z-index:9999;font:15px "Segoe UI",sans-serif;gap:12px}
#yukleme .cubuk{width:260px;height:6px;background:#38424b;border-radius:3px;overflow:hidden}
#yukleme .cubuk i{display:block;height:100%;width:0;background:#4aa3ff;transition:width .2s}
#menubar,#tk-menubar{display:flex;background:var(--bg);border-bottom:1px solid var(--bd)}
.tk-mbtn{background:none;border:0;padding:4px 10px;color:var(--fg);font:inherit;cursor:default}.tk-mbtn:hover{background:var(--selbg);color:var(--selfg)}
.tkw{color:var(--fg)}
.tk-frame,.tk-cav,.tk-slot{min-width:0;min-height:0}
.tk-frame{background:var(--bg)}
.tk-lf{border:1px solid var(--bd);margin:0;padding:0;min-width:0;background:var(--bg)}
.tk-lf legend{padding:0 4px;color:inherit}
.tk-lfbody{padding:6px}
.tk-label{display:flex;align-items:center;background:var(--bg);padding:1px 2px;overflow:hidden}
.tk-label>span{overflow:hidden}
.tk-button{font:inherit;color:var(--fg);background:#dfe3e7;border:1px solid var(--bd);padding:3px 10px;border-radius:2px;cursor:default;min-height:22px}
.tk-button:hover:not(:disabled){background:#e9edf1}.tk-button:active:not(:disabled){background:#cfd5db}
.tk-button:disabled,.disabled{opacity:.55}
.tk-check{display:inline-flex;align-items:center;gap:4px;background:var(--bg)}
.tk-entry{font:inherit;color:var(--fg);background:var(--fieldbg);border:1px solid var(--bd);padding:2px 4px;min-height:22px;min-width:0}
.tk-entry:focus{outline:1px solid var(--selbg)}
.tk-combo{display:inline-flex;position:relative;background:var(--fieldbg);border:1px solid var(--bd);min-height:22px;min-width:0}
.tk-combo input{flex:1 1 auto;min-width:0;border:0;background:transparent;color:inherit;font:inherit;padding:2px 4px;outline:0}
.tk-combo button{border:0;background:#dfe3e7;color:var(--fg);width:18px;padding:0;font-size:10px}
.tk-combolist{position:absolute;left:-1px;top:100%;z-index:3000;background:var(--fieldbg);border:1px solid var(--bd);max-height:260px;overflow:auto;box-shadow:0 4px 10px #0004}
.tk-combolist div{padding:3px 8px;white-space:nowrap;cursor:default}.tk-combolist div:hover{background:var(--selbg);color:var(--selfg)}
.tk-sep{background:var(--bd);height:1px;width:100%;align-self:stretch}
.tk-nb{display:flex;flex-direction:column;min-height:0;min-width:0}
.tk-nbbar{display:flex;gap:2px;flex:0 0 auto}.tk-nbtab{font:inherit;border:1px solid var(--bd);padding:4px 10px;background:#dfe3e7;color:var(--fg)}.tk-nbtab.sel{background:var(--fieldbg);font-weight:600}
.tk-nbpages{flex:1 1 auto;min-height:0;min-width:0;position:relative}
.tk-nbpage{min-width:0;min-height:0}
.tk-paned{min-width:0;min-height:0}.tk-sash{background:var(--bd);flex:0 0 5px}.tk-sash.h{cursor:ew-resize}.tk-sash.v{cursor:ns-resize}
.tk-tree{overflow:auto;background:var(--fieldbg);border:1px solid var(--bd);min-height:30px;min-width:0}
.tk-tree table{border-collapse:collapse;width:100%;table-layout:auto}
.tk-tree th{position:sticky;top:0;background:#dfe3e7;border:1px solid var(--bd);font-weight:600;text-align:left;padding:3px 6px;white-space:nowrap}
.tk-tree td{padding:2px 6px;height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-tree tr.sel{background:var(--selbg)!important;color:var(--selfg)!important}
.tk-listbox{overflow:auto;background:var(--fieldbg);border:1px solid var(--bd)}.tk-li{padding:1px 6px}.tk-li.sel{background:var(--selbg);color:var(--selfg)}
.tk-text{font:inherit;color:var(--fg);background:var(--fieldbg);border:1px solid var(--bd);resize:none;padding:4px;min-width:0;min-height:30px}
.tk-canvas{position:relative;overflow:hidden;background:#fff}
.tk-canvas canvas{position:absolute;left:0;top:0}.tk-cvwin{position:absolute;inset:0;pointer-events:none}.tk-cvwin>*{pointer-events:auto}
.tk-top{position:fixed;z-index:2000;background:var(--bg);border:1px solid #666;box-shadow:0 8px 24px #0006;display:flex;flex-direction:column;max-width:96vw;max-height:94vh}
.tk-topbar{display:flex;justify-content:space-between;align-items:center;background:#2c3640;color:#fff;padding:3px 6px;cursor:move}.tk-topbar button{background:none;border:0;color:#fff}
.tk-topbody{flex:1 1 auto;display:flex;overflow:auto;min-width:0}
.tk-menu{background:var(--fieldbg);border:1px solid var(--bd);box-shadow:0 4px 12px #0005;min-width:140px;z-index:5000;padding:2px 0}
.tk-popup,.tk-sub{position:fixed;z-index:5000}.tk-mi{padding:4px 14px;white-space:nowrap}.tk-mi:hover{background:var(--selbg);color:var(--selfg)}.tk-mi span{float:right;margin-left:20px;opacity:.6}
.tk-menu hr{border:0;border-top:1px solid var(--bd);margin:3px 0}
</style>
</head>
<body>
<div id="yukleme"><div id="ytxt">Cephe Metraj yükleniyor…</div><div class="cubuk"><i id="ybar"></i></div></div>
<div id="tk-root"></div>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="tkweb.js"></script>
<script>
(async () => {
  const set = (t, p) => { document.getElementById('ytxt').textContent = t; document.getElementById('ybar').style.width = p + '%'; };
  try {
    set('Python çalışma ortamı açılıyor…', 8);
    const py = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
    window.pyodide = py;
    set('Program dosyaları indiriliyor…', 35);
    const man = await (await fetch('manifest.json?' + Date.now())).json();
    const mk = (d) => { try { py.FS.mkdir(d); } catch (e) {} };
    let n = 0;
    for (const f of man.files) {
      const parts = f.split('/'); let cur = '/app';
      mk('/app'); for (let i = 0; i < parts.length - 1; i++) { cur += '/' + parts[i]; mk(cur); }
      const r = await fetch(f); py.FS.writeFile('/app/' + f, new Uint8Array(await r.arrayBuffer()));
      if (++n % 10 === 0) set('Program dosyaları indiriliyor…', 35 + 45 * n / man.files.length);
    }
    set('Arayüz kuruluyor…', 85);
    // ayarları geri yükle
    try { const a = localStorage.getItem('cephe_ayar'); if (a) py.FS.writeFile('/app/cephe_ayar.json', a); } catch (e) {}
    await py.runPythonAsync(`
import sys, os
sys.path.insert(0, '/app'); os.chdir('/app')
import webtk
webtk.kur()
import cephe_app
app = cephe_app.Uygulama()
`);
    document.getElementById('yukleme').remove();
    TkWeb.flush();
  } catch (e) {
    console.error(e);
    document.getElementById('ytxt').innerHTML = 'Hata: ' + String(e).replace(/</g, '&lt;').slice(0, 1500);
    window.__hata = String(e);
  }
})();
// ayar dosyasını localStorage'a yedekle
setInterval(() => { try { const p = window.pyodide; if (!p) return; const d = p.FS.readFile('/app/cephe_ayar.json', { encoding: 'utf8' }); if (d !== window.__son) { window.__son = d; localStorage.setItem('cephe_ayar', d); } } catch (e) {} }, 3000);
</script>
</body>
</html>
