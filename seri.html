*{box-sizing:border-box}

<script>
(() => {

  try { if (localStorage.getItem('seri-giris') !== '1') return; } catch (e) { return; }

    const d = await firebase.firestore().collection('users').doc(u.uid).get(), k = d.exists && d.data().krallik; if (!k || !k.v) return;
    KR_BULUT = JSON.parse(k.v); KR_BULUT.t = Math.max(KR_BULUT.t || 0, k.t || 0); ciz(); } catch (e) { }
}
function veri() {
  const og = ls('organizma-kayit') || {}, ya = ls('yaratik-kayit') || {}, yu = ls('yuva-kayit') || {}, ka = ls('kabile-kayit') || {}, se = ls('sehir-kayit') || {}, krY = ls('kucuk-krallik-v1'), kr = KR_BULUT && (!krY || (KR_BULUT.t || 0) > (krY.t || 0)) ? KR_BULUT : krY;
  const yaTam = !!(ya.gecis || ((ya.rekor || {}).kazan > 0)), kaO = ka.oyun || {}, kaR = ka.rekor || {}, seO = se.oyun || {}, seR = se.rekor || {};
  const kaTam = (kaR.koy >= 1) || kaO.asama >= 2, seTam = (seR.devlet >= 1) || !!seO.kazandi;

    { e: '🏛', ad: ['Şehir', 'City'], ne: ['Nehir kıyısında ilk şehir devleti', 'The first city-state on the river'], u: '/sehir.html', tam: seTam, basl: !!se.oyun,
      ist: [seO.ad && ['🏛', esc(seO.ad)], seO.kral && ['👑', esc(seO.kral)], seO.nuf && ['👥', Math.floor(seO.nuf) + T(' kişi', ' people')], seO.puskurt && ['🛡', seO.puskurt + T(' baskın püskürttü', ' raids repelled')], seO.kent && seO.kent.fetih && ['🏆', T('güney kentini fethetti', 'conquered the south')]] },
    { e: '👑', ad: ['Küçük Krallık', 'Little Kingdom'], ne: ['Şehrin, bir krallığın kalbi', 'Your city becomes the heart of a realm'], u: '/GameKingdom10.html', tam: !!(kr && kr.lv && kr.lv.main >= 10), basl: !!(kr && kr.lv),
      ist: [kr && kr.lv && ['🏰', T('ana bina ', 'keep level ') + kr.lv.main], kr && kr.sehirMiras && ['🏛', esc(kr.sehirMiras.ad) + T(' mirası', ' legacy')], kr && kr.ms && ['⚔️', kr.ms + T(' zafer', ' victories')]] }
  ];
  let onceTam = true; L.forEach((a, i) => { a.ist = a.ist.filter(Boolean); a.durum = a.tam ? 'tam' : (onceTam ? 'acik' : 'kilit'); if (i === 5 && seTam) a.durum = a.tam ? 'tam' : 'acik'; onceTam = a.tam; });
  return L;
}
function ciz() {
  const L = veri(), tam = L.filter(a => a.tam).length;
  $('ozet').innerHTML = `<span>✅ ${tam}/6 ${T('aşama', 'stages')}</span><span>${['🦠', '🐟', '🦎', '🔥', '🏛', '👑'][Math.max(0, Math.min(5, L.findIndex(a => !a.tam) < 0 ? 5 : L.findIndex(a => !a.tam)))]} ${T('şu an', 'now')}: ${T(...(L.find(a => !a.tam) || L[5]).ad)}</span>`;

  kart(L);

function kart(L) {
  const c = $('kartC'), x = c.getContext('2d'), W = c.width, H = c.height;
  const q = x.createLinearGradient(0, 0, 0, H); q.addColorStop(0, '#0E3A44'); q.addColorStop(0.35, '#1E3A22'); q.addColorStop(0.7, '#3A2A16'); q.addColorStop(1, '#2A1A30'); x.fillStyle = q; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 160; i++) { x.fillStyle = `rgba(255,240,200,${Math.random() * 0.12})`; x.beginPath(); x.arc(Math.random() * W, Math.random() * H, Math.random() * 3, 0, Math.PI * 2); x.fill(); }
  x.textAlign = 'center'; x.fillStyle = '#F3ECDC'; x.font = '900 68px Nunito, system-ui, sans-serif'; x.fillText(T('Yolculuğum', 'My journey'), W / 2, 120);
  x.font = '700 34px Nunito, system-ui, sans-serif'; x.fillStyle = 'rgba(243,236,220,.75)'; x.fillText(T('tek hücreden krallığa', 'from a single cell to a kingdom'), W / 2, 172);
  const y0 = 250, ad = 172;

    x.font = '56px system-ui, sans-serif'; x.fillText(a.e, 150, y + 60); x.textAlign = 'left'; x.fillStyle = a.durum === 'kilit' ? 'rgba(243,236,220,.45)' : '#F3ECDC'; x.font = '900 44px Nunito, system-ui, sans-serif'; x.fillText(T(...a.ad) + (a.tam ? '  ✓' : ''), 230, y + 34);
    x.font = '700 28px Nunito, system-ui, sans-serif'; x.fillStyle = 'rgba(243,236,220,.72)'; const s = a.ist.slice(0, 3).map(q2 => q2[0] + ' ' + String(q2[1]).replace(/&lt;|&gt;|&amp;|&quot;/g, m => ({ '&lt;': '<', '&gt;': '>', '&amp;': '&', '&quot;': '"' }[m]))).join('   ') || T(...a.ne); x.fillText(s.length > 52 ? s.slice(0, 51) + '…' : s, 230, y + 80); x.textAlign = 'center'; });
  x.font = '800 30px Nunito, system-ui, sans-serif'; x.fillStyle = 'rgba(243,236,220,.6)'; x.fillText('erdevelop.github.io/seri.html', W / 2, H - 46);
}
$('indir').onclick = () => { const a = document.createElement('a'); a.download = 'yolculugum.png'; a.href = $('kartC').toDataURL('image/png'); a.click(); };
$('paylas').onclick = () => { $('kartC').toBlob(async b => { try { const f = new File([b], 'yolculugum.png', { type: 'image/png' }); if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f], title: T('Yolculuğum', 'My journey'), text: T('Tek hücreden krallığa yolculuğum', 'My journey from a single cell to a kingdom'), url: 'https://erdevelop.github.io/seri.html' }); else if (navigator.share) await navigator.share({ title: T('Yolculuğum', 'My journey'), url: 'https://erdevelop.github.io/seri.html' }); else { await navigator.clipboard.writeText('https://erdevelop.github.io/seri.html'); $('paylas').textContent = T('Bağlantı kopyalandı', 'Link copied'); } } catch (e) { } }, 'image/png'); };
