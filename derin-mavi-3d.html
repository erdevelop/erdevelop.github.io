/* ---------------- gökyüzü kubbesi: yukarısı aydınlık, aşağısı koyu su ---------------- */
const kubbeMat = new THREE.ShaderMaterial({

/* ---------------- ışıklar ---------------- */
sahne.add(new THREE.HemisphereLight('#9fe2f5', '#3b3424', 0.9));
const gunes = new THREE.DirectionalLight('#e8f9ff', 2.6); gunes.position.set(5, 22, 8); gunes.castShadow = true;

sahne.add(gunes);

/* ---------------- su yüzeyinden süzülen ışık ağı (kostik) dokusu: döşenebilir Voronoi kenarları ---------------- */
function kostikDoku(n = 256) {
  const cv = document.createElement('canvas'); cv.width = cv.height = n; const x = cv.getContext('2d'), id = x.createImageData(n, n);
  const P = Array.from({ length: 26 }, () => [Math.random(), Math.random()]);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const u = i / n, v = j / n; let f1 = 9, f2 = 9;
    for (const [px, py] of P) { let dx = Math.abs(u - px), dy = Math.abs(v - py); dx = Math.min(dx, 1 - dx); dy = Math.min(dy, 1 - dy); const d = Math.sqrt(dx * dx + dy * dy); if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d; }

  }

  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.NoColorSpace; return t;
}
const KOSTIK = kostikDoku();
const U = { zaman: { value: 0 }, kostikGuc: { value: 1.0 }, kostik: { value: KOSTIK } };

/* malzemelere ekle: dünya konumuna göre üstten düşen ışık ağı; istenirse balık yüzmesi ya da akıntıda salınım */
function yama(mat, ek = {}) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uZaman = U.zaman; sh.uniforms.uKostik = U.kostik; sh.uniforms.uKostikGuc = U.kostikGuc;
    if (ek.yuz) { sh.uniforms.uFaz = ek.yuz.faz; sh.uniforms.uGenlik = ek.yuz.genlik; }
    sh.vertexShader = 'varying vec3 vDP; varying vec3 vDN;\nuniform float uZaman;\n' + (ek.yuz ? 'uniform float uFaz; uniform float uGenlik;\n' : '') + (ek.salin ? 'attribute float aBoy; attribute float aFaz;\n' : '') + sh.vertexShader;
    let govde = '#include <begin_vertex>\n';
    if (ek.yuz) govde += 'float gg = smoothstep(0.32, -0.55, position.x); transformed.z += uGenlik * (0.12 + gg * gg) * sin(position.x * 6.5 - uFaz) * 0.11; transformed.z -= uGenlik * 0.015 * sin(uFaz) * smoothstep(0.0, 0.5, position.x);\n';
    if (ek.salin) govde += 'float sk = pow(aBoy, 1.6); transformed.x += sk * (sin(uZaman * 0.9 + aFaz) * 0.35 + sin(uZaman * 2.1 + aFaz * 1.7) * 0.06); transformed.z += sk * sin(uZaman * 0.7 + aFaz * 1.3) * 0.18;\n';
    if (ek.dokunac) govde += 'float dk = max(0.0, position.y - 0.25) * 2.4; transformed.x += dk * sin(uZaman * 1.6 + position.x * 9.0 + position.z * 7.0) * 0.07; transformed.z += dk * cos(uZaman * 1.3 + position.z * 9.0) * 0.06;\n';

      { vec2 kp = vDP.xz * 0.2;
        float ka = texture2D(uKostik, kp + vec2(uZaman * 0.021, uZaman * 0.013)).r;
        float kb = texture2D(uKostik, kp * 1.31 + vec2(-uZaman * 0.017, uZaman * 0.023)).r;
        float kk = min(ka, kb); kk = kk * kk * 3.2;
        float yon = clamp(vDN.y * 0.75 + 0.25, 0.0, 1.0);
        float yuk = mix(0.55, 1.15, clamp(vDP.y / 9.0, 0.0, 1.0));
        outgoingLight += diffuseColor.rgb * vec3(0.8, 0.97, 1.0) * kk * yon * yuk * uKostikGuc; }

}

/* ---------------- kum zemin: kum dokusu, dalga izleri (normal haritası), hafif tümsekler ---------------- */
const zeminY = (x, z) => 0.28 * Math.sin(x * 0.13 + 1) * Math.cos(z * 0.11) + 0.1 * Math.sin(x * 0.37 + z * 0.29) + (z < -12 ? (z + 12) * 0.08 : 0);
function kumDokulari() {
  const n = 512, a = document.createElement('canvas'), b = document.createElement('canvas'); a.width = a.height = b.width = b.height = n;
  const ax = a.getContext('2d'), bx = b.getContext('2d'), ai = ax.createImageData(n, n), bi = bx.createImageData(n, n), h = new Float32Array(n * n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const u = i / n * Math.PI * 2, v = j / n * Math.PI * 2; h[j * n + i] = Math.sin(u * 6 + Math.sin(v * 2) * 1.4 + Math.sin(v * 5 + u) * 0.4) * 0.6 + Math.sin(u * 13 + v * 3) * 0.15 + (Math.random() - 0.5) * 0.25; }
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const o = (j * n + i) * 4, hx = h[j * n + (i + 1) % n] - h[j * n + (i - 1 + n) % n], hy = h[((j + 1) % n) * n + i] - h[((j - 1 + n) % n) * n + i];
    const nx = -hx * 1.4, ny = -hy * 1.4, nz = 1, l = Math.hypot(nx, ny, nz); bi.data[o] = (nx / l * 0.5 + 0.5) * 255; bi.data[o + 1] = (ny / l * 0.5 + 0.5) * 255; bi.data[o + 2] = (nz / l * 0.5 + 0.5) * 255; bi.data[o + 3] = 255;
    const g = 0.86 + Math.random() * 0.14 + h[j * n + i] * 0.04, k = Math.random() < 0.02 ? 0.7 : 1; ai.data[o] = 222 * g * k; ai.data[o + 1] = 205 * g * k; ai.data[o + 2] = 165 * g * k; ai.data[o + 3] = 255;
  }
  ax.putImageData(ai, 0, 0); bx.putImageData(bi, 0, 0);
  const ta = new THREE.CanvasTexture(a), tb = new THREE.CanvasTexture(b); ta.colorSpace = THREE.SRGBColorSpace;
  for (const t of [ta, tb]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(26, 26); t.anisotropy = 4; }

}
{
  const g = new THREE.PlaneGeometry(160, 160, 220, 220); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position; for (let i = 0; i < p.count; i++) p.setY(i, zeminY(p.getX(i), p.getZ(i))); g.computeVertexNormals();
  const [ta, tb] = kumDokulari();
  const m = yama(new THREE.MeshStandardMaterial({ map: ta, normalMap: tb, normalScale: new THREE.Vector2(0.9, 0.9), roughness: 0.96, color: '#d2c29e' }));
  const zemin = new THREE.Mesh(g, m); zemin.receiveShadow = true; sahne.add(zemin);
}

/* ---------------- su yüzeyi (aşağıdan) ve ışık huzmeleri ---------------- */
{
  const yt = KOSTIK.clone(); yt.repeat.set(22, 22); yt.needsUpdate = true;
  const ym = new THREE.MeshBasicMaterial({ color: '#b8f0ff', map: yt, transparent: true, opacity: 0.28, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending });
  const yuzey = new THREE.Mesh(new THREE.PlaneGeometry(260, 260), ym); yuzey.rotation.x = Math.PI / 2; yuzey.position.y = 12; sahne.add(yuzey);
  sahne.userData.yuzeyDoku = yt;
}
const huzmeMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
  uniforms: { uZaman: U.zaman },
  vertexShader: 'varying vec2 vU; void main(){ vU = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `varying vec2 vU; uniform float uZaman;
    void main(){ float x = (vU.x - 0.5) * 2.0; float yatay = exp(-x * x * 3.5); float dikey = pow(vU.y, 1.8) * smoothstep(0.0, 0.25, vU.y);
      float nefes = 0.55 + 0.45 * sin(uZaman * 0.35 + gl_FragCoord.x * 0.0);
      gl_FragColor = vec4(vec3(0.78, 0.94, 1.0), yatay * dikey * 0.11); }`
});
const HUZME = [];
for (let i = 0; i < 9; i++) {
  const m = huzmeMat.clone(); m.uniforms = { uZaman: U.zaman }; const h = new THREE.Mesh(new THREE.PlaneGeometry(1.6 + Math.random() * 2.2, 30), m);
  h.position.set(-14 + i * 3.6 + Math.random() * 2, 6, -9 + Math.random() * 9); h.userData = { a: 0.12 + Math.random() * 0.1, f: Math.random() * 9, v: 0.15 + Math.random() * 0.2 };
  sahne.add(h); HUZME.push(h);
}

/* ---------------- suda asılı parçacıklar (deniz karı) ---------------- */
let PARCA;
function parcaKur() {
  if (PARCA) { sahne.remove(PARCA); PARCA.geometry.dispose(); }
  const n = KAL[kalite].parca, g = new THREE.BufferGeometry(), p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { p[i * 3] = (Math.random() - 0.5) * 36; p[i * 3 + 1] = Math.random() * 11; p[i * 3 + 2] = -14 + Math.random() * 26; }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  const cv = document.createElement('canvas'); cv.width = cv.height = 32; const x = cv.getContext('2d'), gr = x.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = gr; x.fillRect(0, 0, 32, 32);

/* ---------------- deniz çayırı ve yosun: tek geometri, akıntıda salınır ---------------- */
function cayir(adet, alan, boy, gen, renk1, renk2, tohum) {
  const rnd = (() => { let s = tohum; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const pos = [], boyA = [], fazA = [], col = [], idx = []; const c1 = new THREE.Color(renk1), c2 = new THREE.Color(renk2);
  for (let k = 0; k < adet; k++) {
    const x = alan[0] + rnd() * (alan[1] - alan[0]), z = alan[2] + rnd() * (alan[3] - alan[2]), y0 = zeminY(x, z) - 0.05, h = boy * (0.5 + rnd() * 0.8), a = rnd() * Math.PI, ca = Math.cos(a) * gen, sa = Math.sin(a) * gen, f = rnd() * 9, n = 10, b = pos.length / 3;
    for (let i = 0; i <= n; i++) { const u = i / n, w = 1 - u * 0.7; pos.push(x - ca * w, y0 + u * h, z - sa * w, x + ca * w, y0 + u * h, z + sa * w); boyA.push(u, u); fazA.push(f, f); const c = c1.clone().lerp(c2, u); col.push(c.r, c.g, c.b, c.r, c.g, c.b); if (i < n) idx.push(b + i * 2, b + i * 2 + 1, b + i * 2 + 2, b + i * 2 + 1, b + i * 2 + 3, b + i * 2 + 2); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('aBoy', new THREE.Float32BufferAttribute(boyA, 1)); g.setAttribute('aFaz', new THREE.Float32BufferAttribute(fazA, 1)); g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = yama(new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.75 }), { salin: 1 });
  const me = new THREE.Mesh(g, m); me.castShadow = true; me.receiveShadow = true; sahne.add(me); return me;
}

/* ---------------- yerleşim ---------------- */
const rastgele = (() => { let s = 12345; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const ara = (a, b) => a + rastgele() * (b - a);
const yukle = u => new Promise((ok, red) => new GLTFLoader().load(u, ok, undefined, red));
const ISIN = new THREE.Raycaster();
const BALIKLAR = [];
let BEN = null, SURU = [], DUVAR = null;
const HACIM = { x1: -13, x2: 13, y1: 0.7, y2: 8.5, z1: -7, z2: 4 };

function malzHazirla(o, ek) {
  o.traverse(m => { if (!m.isMesh) return; m.castShadow = true; m.receiveShadow = true; const mats = [].concat(m.material).map(mt => { const n = mt.clone(); n.vertexColors = true; if (n.name === 'yuzgec') { n.transparent = true; n.opacity = 0.86; n.side = THREE.DoubleSide; n.depthWrite = true; } if (n.name === 'isik') { n.emissive = new THREE.Color('#9fffe8'); n.emissiveIntensity = 2.5; } return yama(n, ek(n)); }); m.material = mats.length === 1 ? mats[0] : mats; });
}
function yerlestir(kaynak, x, z, olcek, donus, yuzeyde) {
  const o = kaynak.clone(true); o.position.set(x, 0, z); o.scale.setScalar(olcek); o.rotation.y = donus;
  let y = zeminY(x, z) - 0.05 * olcek;
  if (yuzeyde && DUVAR) { ISIN.set(new THREE.Vector3(x, 30, z), new THREE.Vector3(0, -1, 0)); const h = ISIN.intersectObject(DUVAR, true)[0]; if (h) y = h.point.y - 0.05; }
  o.position.y = y; sahne.add(o); return o;
}
function balikEkle(kaynak, tur, olcek, opts = {}) {
  const o = kaynak.clone(true); o.position.set(0, 0, 0);
  const yuz = { faz: { value: Math.random() * 9 }, genlik: { value: 1 } };
  malzHazirla(o, () => ({ yuz }));
  const g = new THREE.Group(); g.add(o); o.scale.setScalar(olcek); sahne.add(g);
  const b = Object.assign({ g, tur, olcek, yuz, hiz: opts.hiz || 1.1, v: new THREE.Vector3(ara(-1, 1), 0, ara(-0.3, 0.3)), hedef: null, hz: 0, sapma: 0 }, opts);
  g.position.copy(opts.konum || new THREE.Vector3(ara(-8, 8), ara(1.5, 6), ara(-5, 2)));
  BALIKLAR.push(b); return b;
}
function hacimdenHedef(b) {
  if (b.ev) return b.ev.clone().add(new THREE.Vector3(ara(-1, 1) * b.evR, ara(-0.3, 1) * b.evR * 0.6, ara(-1, 1) * b.evR));
  return new THREE.Vector3(ara(HACIM.x1 + 1, HACIM.x2 - 1), ara(b.yMin || HACIM.y1 + 0.5, b.yMax || HACIM.y2 - 1), ara(HACIM.z1 + 1, HACIM.z2 - 0.5));
}

async function kur() {
  const [bg, rg] = await Promise.all([yukle('/derin-mavi/3d/baliklar.glb'), yukle('/derin-mavi/3d/resif.glb')]);
  const P = {}; rg.scene.traverse(o => { if (o.isMesh && o.parent === rg.scene) P[o.name] = o; });
  for (const k in P) { P[k].position.set(0, 0, 0); P[k].rotation.set(0, 0, 0); P[k].scale.set(1, 1, 1); malzHazirla(P[k], m => (/anemon/.test(m.name) ? { dokunac: 1 } : {})); }
  const B = {}; bg.scene.children.forEach(o => { if (o.name.startsWith('balik_')) B[o.name.slice(6)] = o; });

  /* resif duvarı ve mağara solda */
  DUVAR = P.duvar.clone(true); DUVAR.position.set(-9.5, 0, -6.5); DUVAR.rotation.y = 0.18; sahne.add(DUVAR); DUVAR.updateMatrixWorld(true);
  /* kayalar */
  const kayalar = [['kaya_2', 5, -5, 1.2, 0.3], ['kaya_0', 9.5, -2.5, 1, 1.2], ['kaya_1', 2, -8, 1.3, 2.1], ['kaya_3', -2.5, 1.8, 0.8, 0.4], ['kaya_0', 12.5, -7, 1.6, 2.5], ['kaya_1', 6.5, 2.5, 0.7, 4], ['kaya_3', -5, -2.4, 0.9, 1], ['kaya_2', 15, 1, 1.1, 0.8]];
  for (const [k, x, z, s, r] of kayalar) yerlestir(P[k], x, z, s, r);
  /* mercanlar: kumda kümeler ve duvarın tepesinde */
  const mercanlar = ['beyin_0', 'beyin_1', 'dalli_0', 'dalli_1', 'dalli_2', 'dalli_3', 'masa_0', 'masa_1', 'tup_0', 'tup_1', 'yelpaze_0', 'yelpaze_1'];
  for (let i = 0; i < 70; i++) {
    const k = mercanlar[Math.floor(rastgele() * mercanlar.length)], ustte = i < 22;
    const x = ustte ? ara(-15, -3.5) : ara(-4, 16), z = ustte ? ara(-9, -4) : ara(-9, 3.5);
    const s = (k.startsWith('yelpaze') ? ara(0.9, 1.5) : k.startsWith('masa') ? ara(0.5, 0.9) : ara(0.6, 1.2)) * (z > 1 ? 0.7 : 1);
    const o = yerlestir(P[k], x, z, s, k.startsWith('yelpaze') ? ara(-0.4, 0.4) : rastgele() * 6.28, ustte);
    if (!ustte && Math.hypot(x + 6.7, z + 2) < 2.2) sahne.remove(o);
  }
  const anemonlar = [[2.5, 1.2, 'anemon_0'], [-1.2, -4, 'anemon_1'], [8, 0.5, 'anemon_0'], [-6, -1.2, 'anemon_1']];
  for (const [x, z, k] of anemonlar) yerlestir(P[k], x, z, 1.1, rastgele() * 6);
  /* deniz çayırı önde, uzun yosunlar arkada */
  cayir(260, [-14, 16, 1, 6], 0.7, 0.025, '#3f7a2e', '#9bc45a', 7);
  cayir(60, [-12, 16, -11, -5], 4.5, 0.16, '#2f5a26', '#87a84a', 11);
  parcaKur();

  /* balıklar: oyuncunun balığı, palyaço çifti anemonda, ton balıkları, cerrah ve melek, sardalya sürüsü, mağarada fener */
  let kayit = null; try { kayit = JSON.parse(localStorage.getItem('erdevelop-balik') || 'null'); } catch (e) { }
  const ESLE = { palyaco: 'palyaco', cerrah: 'cerrah', melek: 'melek', orkinos: 'orkinos', yelken: 'orkinos', ucan: 'sardalya', fener: 'fener', balta: 'sardalya', kurdele: 'cerrah', buz: 'sardalya', yavru: 'sardalya' };
  const benTur = kayit && kayit.tur && ESLE[kayit.tur] ? ESLE[kayit.tur] : 'palyaco';
  const benOlcek = kayit ? [0.35, 0.5, 0.7, 0.9, 1.05][kayit.asama | 0] || 0.8 : 0.85;
  BEN = balikEkle(B[benTur], benTur, benOlcek * (benTur === 'orkinos' ? 1.3 : 1), { ben: true, hiz: 1.3, konum: new THREE.Vector3(1, 3.2, 1) });
  BEN.ad = kayit && kayit.ad ? kayit.ad : T('Balığın', 'Your fish');
  const an = new THREE.Vector3(2.5, zeminY(2.5, 1.2) + 0.7, 1.2);
  for (let i = 0; i < 2; i++) balikEkle(B.palyaco, 'palyaco', 0.42 - i * 0.06, { ev: an, evR: 0.7, hiz: 0.6, konum: an.clone().add(new THREE.Vector3(i * 0.4, 0.2, 0)) });
  for (let i = 0; i < 3; i++) balikEkle(B.cerrah, 'cerrah', ara(0.55, 0.75), { hiz: 0.9, yMax: 5 });
  for (let i = 0; i < 2; i++) balikEkle(B.melek, 'melek', ara(0.6, 0.8), { hiz: 0.7, yMax: 4.5, ev: new THREE.Vector3(ara(3, 10), 2, ara(-6, -2)), evR: 3 });
  for (let i = 0; i < 2; i++) balikEkle(B.orkinos, 'orkinos', ara(1.6, 2.1), { hiz: 2.2, yMin: 3.5, konum: new THREE.Vector3(ara(-10, 10), 6, ara(-7, -3)) });
  balikEkle(B.fener, 'fener', 0.7, { ev: new THREE.Vector3(-7.8, 0.9, -2.6), evR: 0.6, hiz: 0.35 });
  const suruMer = new THREE.Vector3(4, 5.5, -3);
  for (let i = 0; i < (mobil ? 22 : 34); i++) SURU.push(balikEkle(B.sardalya, 'sardalya', ara(0.32, 0.4), { suru: true, hiz: 1.8, konum: suruMer.clone().add(new THREE.Vector3(ara(-1.5, 1.5), ara(-0.8, 0.8), ara(-1, 1))) }));
  SURU.mer = suruMer; SURU.hedef = suruMer.clone();

  kaliteUygula();
  $('yukle').style.opacity = 0; setTimeout(() => $('yukle').remove(), 700);
  setTimeout(() => { $('ipucu').style.opacity = 0; }, 7000);
  dongu();
}

/* ---------------- hareket ---------------- */
const tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler(0, 0, 0, 'YXZ');
function balikGuncelle(b, dt) {
  const p = b.g.position;
  let istenen;
  if (b.suru) {
    const S = SURU, ayr = new THREE.Vector3(), hiz = new THREE.Vector3(); let n = 0;
    for (const o of S) { if (o === b) continue; const d = p.distanceTo(o.g.position); if (d < 1.4) { hiz.add(o.v); n++; if (d < 0.35) ayr.add(tmpV.copy(p).sub(o.g.position).multiplyScalar(1 / (d + 0.05))); } }
    istenen = S.mer.clone().sub(p).multiplyScalar(0.55).add(ayr.multiplyScalar(0.9));
    if (n) istenen.add(hiz.multiplyScalar(0.6 / n));
    if (BEN && p.distanceTo(BEN.g.position) < 1.6) istenen.add(tmpV.copy(p).sub(BEN.g.position).normalize().multiplyScalar(4));
    istenen.clampLength(0, b.hiz * 1.6);
  } else {
    if (!b.hedef || p.distanceTo(b.hedef) < 0.4 || (b.hz -= dt) < 0) { if (!b.ben || !b.komut) b.hedef = hacimdenHedef(b); b.hz = ara(4, 10); if (b.ben && b.komut) b.komut = false; }
    istenen = b.hedef.clone().sub(p); const d = istenen.length(); istenen.normalize().multiplyScalar(b.hiz * Math.min(1, d / 1.5 + 0.25) * (b.ben && b.komut ? 1.9 : 1));
  }
  b.v.lerp(istenen, Math.min(1, dt * (b.suru ? 1.6 : 1.1)));
  p.addScaledVector(b.v, dt);
  p.x = THREE.MathUtils.clamp(p.x, HACIM.x1, HACIM.x2); p.y = THREE.MathUtils.clamp(p.y, Math.max(HACIM.y1, zeminY(p.x, p.z) + 0.35), HACIM.y2); p.z = THREE.MathUtils.clamp(p.z, HACIM.z1, HACIM.z2);
  const s = b.v.length();
  if (s > 0.02) {
    const yaw = Math.atan2(-b.v.z, b.v.x), pit = THREE.MathUtils.clamp(Math.asin(THREE.MathUtils.clamp(b.v.y / s, -1, 1)), -0.6, 0.6);
    const onceki = b.yaw ?? yaw; let dy = yaw - onceki; while (dy > Math.PI) dy -= Math.PI * 2; while (dy < -Math.PI) dy += Math.PI * 2;
    b.yaw = onceki + dy * Math.min(1, dt * 3); b.pit = (b.pit ?? 0) + (pit - (b.pit ?? 0)) * Math.min(1, dt * 3); b.roll = (b.roll ?? 0) + (-dy * 1.2 - (b.roll ?? 0)) * Math.min(1, dt * 2);
    tmpE.set(b.roll * 0.5, b.yaw, b.pit); b.g.quaternion.setFromEuler(tmpE);
  }
  b.yuz.faz.value += dt * (3 + s * 5 / Math.max(0.4, b.olcek)); b.yuz.genlik.value = 0.6 + Math.min(1.2, s * 0.5);
}

/* dokununca balığın oraya yüzer */
const isaret = new THREE.Mesh(new THREE.RingGeometry(0.18, 0.24, 32), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0, depthWrite: false })); sahne.add(isaret);
canvas.addEventListener('pointerdown', e => {
  if (!BEN) return;
  const r = canvas.getBoundingClientRect(), nd = new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ISIN.setFromCamera(nd, kam);
  const duz = new THREE.Plane(new THREE.Vector3(0, 0, 1), -BEN.g.position.z * 0.3), h = new THREE.Vector3();
  if (!ISIN.ray.intersectPlane(duz, h)) return;
  h.x = THREE.MathUtils.clamp(h.x, HACIM.x1, HACIM.x2); h.y = THREE.MathUtils.clamp(h.y, HACIM.y1 + 0.3, HACIM.y2); h.z = THREE.MathUtils.clamp(h.z, HACIM.z1, HACIM.z2);
  BEN.hedef = h; BEN.komut = true; BEN.hz = 8;
  isaret.position.copy(h); isaret.lookAt(kam.position); isaret.material.opacity = 0.7; isaret.scale.setScalar(0.6);
  $('ipucu').style.opacity = 0;
});

/* ---------------- döngü ---------------- */
const saat = new THREE.Clock();
function dongu() {
  requestAnimationFrame(dongu);
  const dt = Math.min(0.05, saat.getDelta()), t = (U.zaman.value += dt);
  for (const b of BALIKLAR) balikGuncelle(b, dt);
  if (SURU.length) { if (SURU.mer.distanceTo(SURU.hedef) < 0.5) SURU.hedef.set(ara(-6, 12), ara(3.5, 7.5), ara(-6.5, 0)); SURU.mer.lerp(SURU.hedef, dt * 0.12); }
  if (PARCA) { const a = PARCA.geometry.attributes.position; for (let i = 0; i < a.count; i++) { let y = a.getY(i) + dt * 0.05, x = a.getX(i) + Math.sin(t * 0.3 + i) * dt * 0.03 + dt * 0.04; if (y > 11) y = 0; if (x > 18) x = -18; a.setY(i, y); a.setX(i, x); } a.needsUpdate = true; }
  for (const h of HUZME) { const d = h.userData; h.scale.x = 0.75 + 0.35 * Math.sin(t * d.v + d.f); h.lookAt(kam.position.x, h.position.y, kam.position.z); h.rotateZ(d.a + Math.sin(t * 0.07 + d.f) * 0.04); }
  const yd = sahne.userData.yuzeyDoku; if (yd) { yd.offset.x = t * 0.01; yd.offset.y = t * 0.007; }
  isaret.material.opacity *= 0.95; isaret.scale.multiplyScalar(1.015);
  /* kamera balığı yumuşakça izler */
  if (BEN) { const hx = THREE.MathUtils.clamp(BEN.g.position.x * 0.35, -4, 4), hy = THREE.MathUtils.clamp((BEN.g.position.y - 3) * 0.2, -0.6, 1); kam.position.lerp(tmpV.set(KAM0.x + hx, KAM0.y + hy, KAM0.z), dt * 0.6); }
  kam.lookAt(BAK0.x + (kam.position.x - KAM0.x) * 0.8, BAK0.y + (kam.position.y - KAM0.y) * 0.6, BAK0.z);
  R.render(sahne, kam);
  if (BEN) { const v = BEN.g.position.clone(); v.y += 0.5 * BEN.olcek + 0.2; v.project(kam); const el = $('ad'); el.hidden = v.z > 1; el.textContent = BEN.ad; el.style.left = (v.x * 0.5 + 0.5) * innerWidth + 'px'; el.style.top = (-v.y * 0.5 + 0.5) * innerHeight + 'px'; }
}
addEventListener('resize', boyut);
kaliteYaz(); boyut();
kur().catch(e => { console.error(e); $('hata').textContent = T('Modeller yüklenemedi: ', 'Models failed to load: ') + e.message; $('hata').style.display = 'block'; });
window.D3 = { sahne, kam, BALIKLAR, U };
</script>
