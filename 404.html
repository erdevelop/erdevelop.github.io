<!doctype html>
<html lang="tr" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sayfa bulunamadı | erdevelop</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/kesif/tema.css">
<style>
main.wrap { min-height: calc(100vh - 140px); display: flex; flex-direction: column; justify-content: center; padding-block: 40px; }
.code { font: 700 clamp(5rem, 22vw, 11rem)/.9 var(--f-display); letter-spacing: -4px; color: var(--fg); margin: 0; }
.code span { color: var(--accent); animation: caret 1.1s steps(1) infinite; }
.term { font: 400 14px/1.8 var(--f-mono); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; margin: 22px 0; max-width: 640px; overflow-wrap: anywhere; }
.term b { color: var(--bad); font-weight: 500; } .term i { color: var(--accent); font-style: normal; }
.sug { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 22px; }
.sug a { text-decoration: none; } .sug .chip { font-size: 13px; padding: 6px 12px; border-radius: 4px; } .sug .chip:hover { border-color: var(--accent); color: var(--accent); }
h2 { font: 600 14px var(--f-mono); text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 18px 0 8px; }
.go { display: flex; gap: 10px; flex-wrap: wrap; }
.fnd { display: flex; gap: 8px; max-width: 520px; } .fnd .inp { flex: 1; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="topbar"><div class="wrap">
  <a class="brand" href="/">erdevelop<span>_</span></a><span class="crumb">/ 404</span><span class="sp"></span>
  <a class="tb" href="/Tools.html">Araçlar</a><button class="tb" type="button" id="modeBtn">LIGHT</button>
</div></div>
<main class="wrap">
  <p class="code">404<span>_</span></p>
  <div class="term" id="term">$ open <i id="path"></i><br><b>hata:</b> böyle bir sayfa yok — taşınmış, adı değişmiş ya da hiç olmamış olabilir.</div>
  <div id="redir"></div>
  <h2 id="sh">Bunu mu aradın?</h2>
  <div class="sug" id="sug"></div>
  <form class="fnd" id="fnd" role="search"><input class="inp" id="q" placeholder="Sayfa ara: yakıt, harita, oyun…" aria-label="Sayfa ara"><button class="btn pri">Ara</button></form>
  <h2>Ya da</h2>
  <div class="go"><a class="btn" href="/">← Ana sayfa</a><a class="btn" href="/Tools.html">Tüm araçlar</a><a class="btn" href="/oyunlar/">Oyun Bahçesi</a></div>
</main>
<footer><div class="wrap"><span>erdevelop.github.io</span><a href="/">ana sayfa</a></div></footer>
<script src="/kesif/tema.js"></script>
<script>
const PAGES = [["", "Ana sayfa"], ["Tools.html", "Araçlar"], ["arac_kutusu.html", "Araç Kutusu"], ["araclar/hava.html", "Hava Durumu"], ["kesif/deprem.html", "Son Depremler"], ["kesif/gunes.html", "Güneş ve Gölge"], ["kesif/ruzgar.html", "Rüzgar Yükü"], ["kesif/saha.html", "Saha Bilgisi"], ["kesif/kitaplik.html", "Kitaplık"], ["web_analiz/", "Ağ Analizi"], ["araclar/metin.html", "Metin Atölyesi"], ["araclar/pdf.html", "PDF Araçları"], ["araclar/resim.html", "Resim Araçları"], ["Planla.html", "Planlama Tahtası"], ["MindMap.html", "Zihin Haritası"], ["MindMap2.html", "Fikir Tahtası"], ["YakitHesapla.html", "Yakıt Hesaplama"], ["Code.html", "CODE"], ["GrassHopper.html", "Mini Grasshopper 3D"], ["web_goruntuleme/", "Dosya Görüntüleyici"], ["dxf.html", "DXF Görüntüleyici"], ["cam-agirlik.html", "Cam Ağırlığı"], ["cephe-bolme.html", "Cephe Modülasyonu"], ["ogrenme_labaratuvari/", "Öğrenme Laboratuvarı"], ["oyunlar/", "Oyun Bahçesi"], ["GameKingdom10.html", "Küçük Krallık"], ["apps/meteor-war.html", "Meteor War Endless"], ["apps/numbermatic.html", "Numbermatic"], ["apps/kelime-notu.html", "Kelime Notu"], ["2048/", "2048"], ["kesif/yarisma.html", "Bilgi Yarışması"], ["kesif/uzay.html", "Uzay"], ["3d.html", "3B Cisimler"], ["three.html", "Three.js Oyun Alanı"], ["Cember1.html", "Renkli Daireler · Çarpışma"], ["Cember2.html", "Renkli Daireler · İz ve Nefes"], ["Cember3.html", "Renkli Daireler · Takımyıldız"], ["Matrix1.html", "Matrix Yağmuru · Klasik"], ["Matrix2.html", "Matrix Yağmuru · 3B Derinlik"], ["Efekt1.html", "Gradyan Stüdyosu"], ["Efekt2.html", "Parçacık Atölyesi"], ["Efekt3.html", "Akış Alanı"]];
/* arşive alınan eski sürümler yeni sürüme gider */
const MOVED = [[/^\/gamekingdom\d\.html$/i, '/GameKingdom10.html'], [/^\/grasshopper_v\d\.html$/i, '/GrassHopper.html'], [/^\/opti_v\d+\.html$/i, '/Opti.html'],
  [/^\/tools_eski\.html$/i, '/Tools.html'], [/^\/index[ _-].*\.html$/i, '/'], [/^\/index%20.*$/i, '/'], [/^\/cephe_metraj\.html$/i, '/cephex/'], [/^\/arac-kutusu\.html$/i, '/arac_kutusu.html'], [/^\/yakit\.html$/i, '/YakitHesapla.html']];
const path = decodeURIComponent(location.pathname); $('path').textContent = path;
const hit = MOVED.find(m => m[0].test(location.pathname) || m[0].test(path));
if (hit) { $('redir').innerHTML = `<p class="note">Bu sayfanın yeni sürümüne yönlendiriliyorsun… <a href="${hit[1]}">hemen git →</a></p>`; setTimeout(() => location.replace(hit[1]), 1600); }
const norm = s => s.toLowerCase().replace(/[çğıöşü]/g, c => ({ ç: 'c', ğ: 'g', ı: 'i', ö: 'o', ş: 's', ü: 'u' }[c])).replace(/\.html?$|\/$/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const lev = (a, b) => { const d = Array.from({ length: b.length + 1 }, (_, i) => i); for (let i = 1; i <= a.length; i++) { let p = d[0]; d[0] = i; for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] === b[j - 1] ? 0 : 1)); p = t; } } return d[b.length]; };
function score(q, u, t) { const a = norm(u) + ' ' + norm(t); if (!q) return 0; let s = 0; q.split(' ').forEach(w => { if (!w) return; if (a.includes(w)) s += 10 + w.length; else s += Math.max(0, 6 - Math.min(...a.split(' ').map(x => lev(w, x)))); }); return s; }
function show(q) { const n = norm(q); let r = PAGES.map(p => [score(n, p[0], p[1]), p]).sort((a, b) => b[0] - a[0]), top = r.length ? r[0][0] : 0; r = r.filter(x => x[0] >= Math.max(4, top * .6)).slice(0, 6);
  const list = r.length ? r.map(x => x[1]) : PAGES.filter(p => ['Tools.html', 'arac_kutusu.html', 'oyunlar/', 'Code.html'].includes(p[0]));
  $('sh').textContent = r.length ? 'Bunu mu aradın?' : 'Popüler sayfalar';
  $('sug').innerHTML = list.map(p => `<a class="chip" href="/${esc(p[0])}">${esc(p[1])}</a>`).join(''); }
show(path.split('/').pop() || path);
$('fnd').onsubmit = e => { e.preventDefault(); show($('q').value); }; $('q').oninput = () => show($('q').value);
</script>
</body>
</html>
