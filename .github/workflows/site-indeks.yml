# Site arama dizini, Yenilikler listesi ve RSS beslemesi
# Her push'tan sonra surum.json (tarih saat · commit), arama.json, yenilikler.json ve feed.xml dosyalarını yeniden üretir; değiştiyse kaydeder.
# Elle: Actions → "Site dizini ve yenilikler" → Run workflow.
name: Site dizini ve yenilikler

on:
  push:
    branches: [main]
    paths-ignore:
      - 'arama.json'
      - 'yenilikler.json'
      - 'feed.xml'
      - 'egitimler/index.html'
      - 'egitimler/yollar/index.html'
      - 'egitimler/panom/index.html'
      - 'yapay-zeka/index.html'
      - 'surum.json'
      - 'js/baglanti.js'
      - 'hesaplama-araclari/index.html'
      - 'cephe-hesaplari/index.html'
      - 'belge-araclari/index.html'
      - 'gelistirici-araclari/index.html'
      - 'cad-komutlari/index.html'
      - 'tasarim-araclari/index.html'
      - 'telefon-araclari/index.html'
      - 'gunluk-araclar/index.html'
      - 'tarayici-oyunlari/index.html'
      - 'araclar/index.html'
      - 'muhendislik/index.html'
      - 'ogren/index.html'
      - 'js/harita.json'
      - 'meraklilar-kosesi/index.html'
      - 'populer.json'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # her pazartesi: popüler araçlar sırası

concurrency:
  group: site-indeks
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 600
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dizini üret
        run: node .github/indeks/olustur.mjs
      - name: Eğitimler sayfasını üret
        run: node .github/indeks/egitimler.mjs
      - name: Kategori sayfalarını üret
        run: node .github/indeks/kategoriler.mjs
      - name: Popüler araçlar sırasını güncelle (haftalık ya da elle)
        if: github.event_name != 'push'
        run: POPULER=1 node .github/indeks/kategoriler.mjs
      - name: Eğitim-araç bağlantılarını üret
        run: node .github/indeks/baglanti.mjs
      - name: Sürüm bilgisini yaz
        run: |
          V=$(TZ=Europe/Istanbul git log -1 --date=format-local:'%d.%m.%Y %H:%M' --format=%cd)
          C=$(git rev-parse --short=7 HEAD)
          printf '{"v":"%s","c":"%s"}\n' "$V" "$C" > surum.json
      - name: Değiştiyse kaydet
        run: |
          # Bu iş yalnızca üretilen dosyaları değiştirir (çalışma kopyası temiz başlar). Dosyaları tek tek saymak yerine
          # hepsini ekliyoruz: yeni bir kategori sayfası eklenince listeye yazmayı unutmak işi bozmasın
          # (öncesinde meraklilar-kosesi/index.html listede olmadığı için "unstaged changes" hatası veriyordu).
          git add -A
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Site: sürüm, arama dizini, yenilikler, RSS, eğitimler ve kategori sayfaları güncellendi"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
