<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gradyan Stüdyosu | erdevelop</title>
<meta name="description" content="Hareketli renk geçişli arka plan tasarla; CSS kodunu kopyala, PNG olarak kaydet.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="deneyler/kit.css">

<meta name="robots" content="noindex">
</head>
<body>
<script src="deneyler/kit.js"></script>
<script>
const PRE = { orijinal: ['#ee7752', '#e73c7e', '#23a6d5', '#23d5ab'], gunbatimi: ['#ff9a44', '#fc6076', '#7b2ff7', '#f9d423'], okyanus: ['#0f2027', '#2c5364', '#00c9ff', '#92fe9d'], aurora: ['#00f260', '#0575e6', '#8e2de2', '#00c9a7'], seker: ['#fbc2eb', '#a6c1ee', '#fdcbf1', '#e6dee9'], gece: ['#0f0c29', '#302b63', '#24243e', '#6a3093'], gri: ['#000000', '#444444', '#999999', '#ffffff'] };
const st = document.createElement('style'); document.head.appendChild(st);
const h1 = document.createElement('h1'); h1.className = 'gx-t'; document.body.appendChild(h1);
const K = Kit({ id: 'efekt1', title: 'Gradyan Stüdyosu', sub: 'hareketli arka plan', help: "Renkleri ve hızı ayarla, sonra “CSS'i kopyala” ile kendi sitende kullan.",
  controls: [
    { k: 'pre', t: 'select', l: 'Hazır renkler', o: [['orijinal', 'Orijinal'], ['gunbatimi', 'Gün batımı'], ['okyanus', 'Okyanus'], ['aurora', 'Kuzey ışıkları'], ['seker', 'Pamuk şeker'], ['gece', 'Gece'], ['gri', 'Gri tonlar'], ['ozel', 'Özel']], v: 'orijinal' },
    { t: 'h', l: 'Renkler' },
    { k: 'c1', t: 'color', l: 'Renk 1', v: '#ee7752' }, { k: 'c2', t: 'color', l: 'Renk 2', v: '#e73c7e' }, { k: 'c3', t: 'color', l: 'Renk 3', v: '#23a6d5' }, { k: 'c4', t: 'color', l: 'Renk 4', v: '#23d5ab' },
    { t: 'h', l: 'Hareket' },
    { k: 'ang', t: 'range', l: 'Açı', min: 0, max: 360, step: 5, v: 315, fmt: x => x + '°' },
    { k: 'dur', t: 'range', l: 'Bir tur süresi', min: 3, max: 40, v: 15, fmt: x => x + ' sn' },
    { k: 'size', t: 'range', l: 'Dalga genişliği', min: 150, max: 800, step: 50, v: 400, fmt: x => '%' + x },
    { k: 'wave', t: 'select', l: 'Hareket biçimi', o: [['ease', 'Yumuşak gidip gel'], ['rand', 'Düzensiz'], ['linear', 'Sabit hızda']], v: 'ease' },
    { t: 'h', l: 'Yazı' },
    { k: 'txt', t: 'text', l: 'Ortadaki yazı', v: '', ph: 'ör. Merhaba', max: 40 },
    { k: 'tc', t: 'select', l: 'Yazı rengi', o: [['#ffffff', 'Beyaz'], ['#111111', 'Siyah'], ['rgba(255,255,255,.35)', 'Saydam beyaz']], v: '#ffffff' },
    { t: 'buttons', b: [['CSS\'i kopyala', () => copyCss(), 1], ['Rastgele renkler', () => randomize()]] }
  ],
  onChange: k => { if (k === 'pre' && K.v.pre !== 'ozel') { PRE[K.v.pre].forEach((c, i) => K.set('c' + (i + 1), c, true)); } else if (/^c\d$/.test(k)) K.set('pre', 'ozel', true); apply(); },
  snapshot: () => { const c = document.createElement('canvas'), W = innerWidth * 2, H = innerHeight * 2; c.width = W; c.height = H; const g = c.getContext('2d'), a = (K.v.ang - 90) * Math.PI / 180, r = Math.hypot(W, H) / 2;
    const gr = g.createLinearGradient(W / 2 - Math.cos(a) * r, H / 2 - Math.sin(a) * r, W / 2 + Math.cos(a) * r, H / 2 + Math.sin(a) * r); cols().forEach((x, i) => gr.addColorStop(i / 3, x)); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    if (K.v.txt) { g.fillStyle = K.v.tc; g.font = `800 ${Math.min(W / 10, 160)}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(K.v.txt, W / 2, H / 2); } return c; },
  onPause: p => document.body.style.animationPlayState = p ? 'paused' : 'running'
});
const cols = () => [K.v.c1, K.v.c2, K.v.c3, K.v.c4];
function kf() { return K.v.wave === 'rand' ? '0%{background-position:0% 50%}25%{background-position:100% 0%}50%{background-position:50% 100%}75%{background-position:0% 100%}100%{background-position:0% 50%}' : '0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}'; }
function css() { const v = K.v; return `background: linear-gradient(${v.ang}deg, ${cols().join(', ')});\nbackground-size: ${v.size}% ${v.size}%;\nanimation: gradyan ${v.dur}s ${v.wave === 'linear' ? 'linear' : 'ease-in-out'} infinite;`; }
function apply() { st.textContent = `body{${css().replace(/\n/g, '')}}@keyframes gradyan{${kf()}}.gx-t{position:fixed;inset:0;margin:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 5vw;font:800 clamp(2rem,9vw,7rem)/1.05 system-ui,sans-serif;letter-spacing:-.02em;color:${K.v.tc};text-shadow:0 4px 30px rgba(0,0,0,.15);pointer-events:none}@media (prefers-reduced-motion:reduce){body{animation:none}}`; h1.textContent = K.v.txt; }
function copyCss() { const t = `/* erdevelop · Gradyan Stüdyosu */\n.gradyan {\n  ${css().replace(/\n/g, '\n  ')}\n}\n@keyframes gradyan { ${kf().replace(/}/g, '} ')}}`;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => K.toast('CSS kopyalandı')).catch(() => { prompt('CSS:', t); }); }
function randomize() { const h = rnd(0, 360); [0, 1, 2, 3].forEach(i => { const c = `hsl(${(h + i * rnd(40, 90)) % 360},${rnd(60, 95)}%,${rnd(45, 65)}%)`, d = document.createElement('canvas').getContext('2d'); d.fillStyle = c; K.set('c' + (i + 1), d.fillStyle, true); }); K.set('pre', 'ozel', true); apply(); }
apply();

</script>
<script data-goatcounter="https://erdevelop.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
