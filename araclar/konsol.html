'use strict';

const T = (tr, en) => window.erDil && erDil.lang === 'en' ? en : tr;
const OUT = byId('out'), TERM = byId('term'), CMD = byId('cmd'), PS = byId('ps');
const sleep = (ms, sig) => new Promise((ok, no) => { const t = setTimeout(ok, ms); if (sig) sig.addEventListener('abort', () => { clearTimeout(t); no(new DOMException('abort', 'AbortError')); }, { once: true }); });
const T0 = Date.now();

/* ---------------- ayarlar ---------------- */
const ST = Object.assign({ tema: 'koyu', fs: 14, user: 'misafir' }, JSON.parse(LS.get('konsol:ayar') || '{}'));
const saveSt = () => LS.set('konsol:ayar', JSON.stringify(ST));
const TEMALAR = ['koyu', 'acik', 'amber', 'yesil'];
function applySt() { document.body.className = ST.tema === 'koyu' ? '' : 'k-' + ST.tema; document.documentElement.style.setProperty('--fs', ST.fs + 'px'); }
applySt();

/* ---------------- sanal dosya sistemi ---------------- */
const HOME = '/home/' + ST.user;
let FS = null;
function fsInit() {
  try { FS = JSON.parse(localStorage.getItem('ak:konsol:fs') || 'null'); } catch (e) { FS = null; }
  if (!FS || FS.t !== 'd') {
    FS = { t: 'd', c: {} };
    const mk = (p, d) => { const n = mkdirp(p); return n; };
    mk('/bin'); mk('/tmp'); mk('/etc'); mkdirp(HOME + '/belgeler');
    writeFile('/etc/hostname', 'erdevelop\n');
    writeFile('/etc/motd', T('Hoş geldin! Komutları görmek için help yaz.\n', 'Welcome! Type help to see the commands.\n'));
    writeFile(HOME + '/beni-oku.txt', T(
`Bu bir sanal dosya sistemi; dosyalar yalnızca bu tarayıcıda saklanır.

Deneyebileceklerin:
  ls -l                    dosyaları listele
  cat beni-oku.txt | grep ping
  echo "merhaba" > not.txt   dosyaya yaz
  nano not.txt             dosyayı düzenle
  ping google.com          gecikme ölç
  dig erdevelop.github.io  DNS kayıtları
  python                   Python yorumlayıcısı
  neofetch                 cihaz bilgisi
`,
`This is a virtual file system; files are stored only in this browser.

Things to try:
  ls -l                    list files
  cat beni-oku.txt | grep ping
  echo "hello" > note.txt  write to a file
  nano note.txt            edit a file
  ping google.com          measure latency
  dig erdevelop.github.io  DNS records
  python                   Python interpreter
  neofetch                 device info
`));
    writeFile(HOME + '/belgeler/sayilar.csv', 'ad,adet,fiyat\nvida,120,0.35\npul,300,0.05\nankraj,24,18.5\nprofil,60,42\nconta,80,3.2\n');
    writeFile(HOME + '/merhaba.py', 'ad = "dünya"\nfor i in range(3):\n    print(f"{i+1}. merhaba {ad}")\n');
    writeFile(HOME + '/merhaba.js', 'const kareler = [1, 2, 3, 4, 5].map(x => x * x);\nconsole.log("kareler:", kareler.join(", "));\n');
    fsSave();
  }
}
let _fsT = 0;
function fsSave() { clearTimeout(_fsT); _fsT = setTimeout(() => { try { localStorage.setItem('ak:konsol:fs', JSON.stringify(FS)); } catch (e) { print(T('uyarı: depolama dolu, dosyalar kaydedilemedi', 'warning: storage full, files not saved'), 'c-w'); } }, 150); }
let CWD = HOME;
const ENV = Object.assign({ HOME, USER: ST.user, SHELL: '/bin/ersh', PATH: '/bin', LANG: 'tr_TR.UTF-8', TERM: 'xterm-256color', HOSTNAME: 'erdevelop' }, JSON.parse(LS.get('konsol:env') || '{}'));
const ALIAS = Object.assign({ ll: 'ls -l', la: 'ls -la', l: 'ls', '..': 'cd ..', cls: 'clear', ipconfig: 'myip', nslookup: 'dig', vi: 'nano', vim: 'nano', edit: 'nano', py: 'python', node: 'js', md5: 'md5sum', bc: 'calc', hesap: 'calc', ifconfig: 'myip', dir: 'ls -l', type: 'which', more: 'cat', less: 'cat', hava: 'weather' }, JSON.parse(LS.get('konsol:alias') || '{}'));

function norm(path) {
  if (!path) return CWD;
  path = path.replace(/^~(?=\/|$)/, ENV.HOME);
  const parts = (path.startsWith('/') ? path : CWD + '/' + path).split('/'), st = [];
  for (const p of parts) { if (!p || p === '.') continue; if (p === '..') st.pop(); else st.push(p); }
  return '/' + st.join('/');
}
function node(path) { const p = norm(path); if (p === '/') return FS; let n = FS; for (const s of p.split('/').slice(1)) { if (!n || n.t !== 'd') return null; n = n.c[s]; } return n || null; }
function parentOf(path) { const p = norm(path), i = p.lastIndexOf('/'); return { dir: node(p.slice(0, i) || '/'), name: p.slice(i + 1), path: p }; }
function mkdirp(path) { let n = FS; for (const s of norm(path).split('/').slice(1)) { if (!s) continue; if (!n.c[s]) n.c[s] = { t: 'd', c: {}, m: Date.now() }; n = n.c[s]; if (n.t !== 'd') throw new Error(T('dizin değil', 'not a directory') + ': ' + s); } return n; }
function readFile(path) { const n = node(path); if (!n) throw new Error(path + ': ' + T('böyle bir dosya yok', 'no such file')); if (n.t === 'd') throw new Error(path + ': ' + T('bu bir dizin', 'is a directory')); return n.b ? atob(n.d) : n.d; }
function writeFile(path, data, append) {
  const { dir, name, path: p } = parentOf(path);
  if (!dir || dir.t !== 'd') throw new Error(path + ': ' + T('böyle bir dizin yok', 'no such directory'));
  if (!name) throw new Error(T('geçersiz ad', 'invalid name'));
  const ex = dir.c[name]; if (ex && ex.t === 'd') throw new Error(path + ': ' + T('bu bir dizin', 'is a directory'));
  const prev = append && ex ? (ex.b ? atob(ex.d) : ex.d) : '';
  dir.c[name] = { t: 'f', d: prev + data, m: Date.now() }; fsSave(); return p;
}
function fsize(n) { return n.t === 'd' ? 4096 : n.b ? Math.floor(n.d.length * 3 / 4) : new Blob([n.d]).size; }
function hsize(b) { return b < 1024 ? b + '' : b < 1048576 ? (b / 1024).toFixed(1) + 'K' : (b / 1048576).toFixed(1) + 'M'; }
function globRe(g) { return new RegExp('^' + g.replace(/[.+^${}()|\\]/g, '\\$&').replace(/\*/g, '.*').replace(/\?/g, '.').replace(/\[!/g, '[^') + '$'); }
function expandGlob(w) {
  if (!/[*?[]/.test(w)) return [w];
  const abs = w.startsWith('/') || w.startsWith('~'), segs = w.replace(/^~/, ENV.HOME).split('/');
  let cur = [abs ? '/' : CWD], rel = [abs ? '' : null];
  const res = [];
  const walk = (base, i, shown) => {
    if (i >= segs.length) { res.push(shown); return; }
    const s = segs[i]; if (s === '' && i === 0) return walk('/', 1, '');
    const n = node(base); if (!n || n.t !== 'd') return;
    if (/[*?[]/.test(s)) { const re = globRe(s); Object.keys(n.c).sort().forEach(k => { if (re.test(k) && (s.startsWith('.') || !k.startsWith('.'))) walk(base.replace(/\/$/, '') + '/' + k, i + 1, (shown === null ? '' : shown + (shown === '' && abs ? '' : '/')) + k); }); }
    else walk(base.replace(/\/$/, '') + '/' + s, i + 1, (shown === null ? '' : shown + (shown === '' && abs ? '' : '/')) + s);
  };
  walk(abs ? '/' : CWD, 0, abs ? '' : null);
  return res.length ? res.map(r => abs ? '/' + r.replace(/^\//, '') : r) : [w];
}

/* ---------------- ekrana yazma ---------------- */
const MAXL = 3000;
function linkify(h) { return h.replace(/\bhttps?:\/\/[^\s<>"']+[^\s<>"'.,;:)\]]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }
function print(text, cls, raw) {
  const s = String(text ?? ''), lines = s.split('\n'); if (s.endsWith('\n')) lines.pop();
  const frag = document.createDocumentFragment();
  for (const ln of lines) { const d = document.createElement('div'); d.className = 'l' + (cls ? ' ' + cls : ''); d.innerHTML = raw ? ln : linkify(esc(ln)); frag.appendChild(d); }
  OUT.appendChild(frag); while (OUT.childElementCount > MAXL) OUT.firstChild.remove(); scrollEnd();
}
function printHTML(h) { const d = document.createElement('div'); d.className = 'l'; d.innerHTML = h; OUT.appendChild(d); scrollEnd(); return d; }
function scrollEnd() { requestAnimationFrame(() => TERM.scrollTop = TERM.scrollHeight); }
function psInfo() { const p = CWD === ENV.HOME ? '~' : CWD.startsWith(ENV.HOME + '/') ? '~' + CWD.slice(ENV.HOME.length) : CWD; return { u: ENV.USER + '@erdevelop', p, s: MODE ? MODE.ps : '$ ' }; }
function paintPS() { if (MODE) { PS.textContent = MODE.ps; return; } const q = psInfo(); PS.innerHTML = `${esc(q.u)}:<b>${esc(q.p)}</b>$&nbsp;`; }
/* renkli bölümler: c('metin','c-a') */
const C = (t, c) => ({ t: String(t), c });

/* ---------------- ayrıştırıcı ---------------- */
function tokenize(src) {
  const out = []; let i = 0, cur = null, q = false;
  const push = () => { if (cur !== null) out.push({ w: cur, q }); cur = null; q = false; };
  while (i < src.length) {
    const ch = src[i];
    if (ch === ' ' || ch === '\t') { push(); i++; continue; }
    if (ch === '#' && cur === null) break;
    if (ch === '2' && src[i + 1] === '>' && cur === null) { if (src.slice(i, i + 4) === '2>&1') { push(); out.push({ op: '2>&1' }); i += 4; continue; } push(); out.push({ op: '2>' }); i += 2; continue; }
    if ('|&;<>'.includes(ch)) {
      push(); const two = src.slice(i, i + 2);
      if (two === '&&' || two === '||' || two === '>>') { out.push({ op: two }); i += 2; continue; }
      out.push({ op: ch }); i++; continue;
    }
    if (cur === null) cur = '';
    if (ch === "'") { const j = src.indexOf("'", i + 1); if (j < 0) throw new Error(T('kapanmamış tırnak', 'unterminated quote')); cur += src.slice(i + 1, j); q = true; i = j + 1; continue; }
    if (ch === '"') { let j = i + 1, s = ''; while (j < src.length && src[j] !== '"') { if (src[j] === '\\' && '"\\$`'.includes(src[j + 1])) { s += src[j + 1]; j += 2; } else { s += src[j]; j++; } } if (j >= src.length) throw new Error(T('kapanmamış tırnak', 'unterminated quote')); cur += expandVars(s); q = true; i = j + 1; continue; }
    if (ch === '\\') { cur += src[i + 1] || ''; q = true; i += 2; continue; }
    if (ch === '$') { const m = src.slice(i).match(/^\$(\{[A-Za-z_][A-Za-z0-9_]*\}|[A-Za-z_][A-Za-z0-9_]*|\?|\$|#)/); if (m) { cur += varVal(m[1].replace(/[{}]/g, '')); i += m[0].length; continue; } }
    cur += ch; i++;
  }
  push(); return out;
}
let LAST = 0;
function varVal(n) { if (n === '?') return String(LAST); if (n === '$') return '4242'; if (n === 'RANDOM') return String(Math.floor(Math.random() * 32768)); if (n === 'PWD') return CWD; return ENV[n] ?? ''; }
function expandVars(s) { return s.replace(/\$(\{[A-Za-z_][A-Za-z0-9_]*\}|[A-Za-z_][A-Za-z0-9_]*|\?)/g, (_, n) => varVal(n.replace(/[{}]/g, ''))); }
function parse(src) {

function syncFromPy() { const F = PY.FS; const walk = p => { let ents; try { ents = F.readdir(p).filter(x => x !== '.' && x !== '..'); } catch (e) { return; } for (const k of ents) { const q = p + '/' + k, st = F.stat(q); if (F.isDir(st.mode)) { mkdirp(q); walk(q); } else { const b = F.readFile(q); let s = null; try { s = new TextDecoder('utf-8', { fatal: true }).decode(b); } catch (e) { } const { dir, name } = parentOf(q); const ex = dir.c[name]; if (s != null) { if (!ex || ex.d !== s || ex.b) dir.c[name] = { t: 'f', d: s, m: Date.now() }; } else { const d = btoa(Array.from(b, x => String.fromCharCode(x)).join('')); if (!ex || ex.d !== d) dir.c[name] = { t: 'f', b: 1, d, m: Date.now() }; } } } }; walk(ENV.HOME); fsSave(); }
async function pyRun(c, code) {
  pyStd(c);
  try { await PY.loadPackagesFromImports(code, { messageCallback: m => /Loading|Loaded/.test(m) && c.out(m, 'c-m') }); } catch (e) { }
  try { const r = await PY.runPythonAsync(code); if (r !== undefined && r !== null && c.args && c.args[0] === '-c') { } return 0; }
  catch (e) { c.err(String(e.message || e).split('\n').filter(l => l && !/^\s+File "\/lib\//.test(l)).slice(-6).join('\n')); return 1; }
}

/* etkileşimli kipler (python / js REPL) */
let PYBUF = [];
async function modeLine(line) {
  const q = MODE.ps; printHTML(`<span class="ps">${esc(q)}</span>${esc(line)}`);
  if (line.trim()) { if (line.trim() !== HIST[HIST.length - 1]) { HIST.push(line.trim()); LS.set('konsol:gecmis', JSON.stringify(HIST.slice(-500))); } } HI = HIST.length;
  const ctx = { args: [], out: (t, cls) => print(t, cls), err: t => print(t, 'c-e'), html: h => printHTML(h), raw: s => print(s.replace(/\n$/, '')) };
  if (MODE.kind === 'js') {
    if (line.trim() === '.exit' || line.trim() === 'exit') { MODE = null; return; }
    if (line.trim()) await runJS(ctx, line, true); return;
  }
  /* python */
  if (/^\s*(exit|quit)(\(\))?\s*$/.test(line)) { MODE = null; syncFromPy(); return; }
  const pf = line.trim().replace(/^python3?\s+/, '').replace(/^\.\//, '');
  if (/^[\w./-]+\.py$/.test(pf) && node(pf) && node(pf).t === 'f') { print(T('(dosya çalıştırılıyor: ', '(running file: ') + pf + ')', 'c-m'); syncToPy(); await pyRun(ctx, readFile(pf)); syncFromPy(); return; }
  pyStd(ctx);
  try {
    PY.globals.set('_satir', line);
    try { await PY.loadPackagesFromImports(line); } catch (e) { }
    const more = PY.runPython('_kon.push(_satir)');
    MODE.ps = more ? '... ' : '>>> ';
  } catch (e) { print(String(e.message || e), 'c-e'); MODE.ps = '>>> '; }
  syncFromPy();
}

/* Konsol ev dizini → 9p kökü */
async function vmPush() {
  const F = VM.emu.fs9p, home = node(ENV.HOME); if (!F || !home) return;
  const walk = async (n, p, pid) => { for (const [k, v] of Object.entries(n.c)) { const q = p + '/' + k; if (v.t === 'd') { const id = F.CreateDirectory(k, pid); await walk(v, q, id); } else await VM.emu.create_file(q, v.b ? Uint8Array.from(atob(v.d), ch => ch.charCodeAt(0)) : new TextEncoder().encode(v.d)); } };
  const base = VM.dir === '/' ? '' : VM.dir; await walk(home, base, F.SearchPath(VM.dir).id);
}
/* 9p kökü → Konsol ev dizini (tam ayna; okuma başarısızsa hiçbir şeye dokunmaz) */
async function vmPull() {
  const F = VM && VM.emu.fs9p; if (!F) return;
  const build = async p => { const d = { t: 'd', c: {}, m: Date.now() }; for (const n of F.read_dir(p)) { const q = (p === '/' ? '' : p) + '/' + n, s = F.SearchPath(q); if (s.id < 0) continue; if (F.IsDirectory(s.id)) d.c[n] = await build(q); else { const b = await VM.emu.read_file(q); let t = null; try { t = new TextDecoder('utf-8', { fatal: true }).decode(b); } catch (e) { } d.c[n] = t != null ? { t: 'f', d: t } : { t: 'f', b: 1, d: btoa(Array.from(b, x => String.fromCharCode(x)).join('')) }; } } return d; };
  const fresh = await build(VM.dir);
  const old = node(ENV.HOME), keepM = (o, n) => { for (const [k, v] of Object.entries(n.c)) { const ov = o && o.c && o.c[k]; if (v.t === 'd') keepM(ov, v); v.m = ov && ov.t === v.t && (v.t === 'd' || ov.d === v.d) ? ov.m : Date.now(); if (v.t === 'd' && ov && ov.m) v.m = ov.m; } };
  keepM(old, fresh);
  const { dir, name } = parentOf(ENV.HOME); dir.c[name] = fresh; fsSave();
}
async function vmStop(fromGuest) {
  if (!VM) return; const v = VM; vmStatus(T('dosyalar eşitleniyor…', 'syncing files…'));
  try { if (v.booted) await vmPull(); } catch (e) { print(T('uyarı: Linux dosyaları Konsol\'a eşitlenemedi', 'warning: could not sync Linux files back'), 'c-w'); }
  clearInterval(v.iv); v.ro && v.ro.disconnect(); try { v.emu.destroy(); } catch (e) { try { v.emu.stop(); } catch (e2) { } } v.term.dispose(); VM = null;
  byId('vm').hidden = true; byId('vmT').innerHTML = ''; print(T('Linux kapatıldı; dosyalar Konsol\'a eşitlendi.', 'Linux closed; files synced to Konsol.'), 'c-m'); paintPS(); CMD.focus();
}

/* ---------------- dosya bırakma / yükleme ---------------- */
async function addFiles(files, dest) {
  for (const f of files) {
    const target = norm((dest ? dest.replace(/\/$/, '') + '/' : '') + f.name), b = new Uint8Array(await f.arrayBuffer());
    if (b.length > 3 * 1048576) { print(f.name + ': ' + T('çok büyük (en fazla 3 MB)', 'too large (max 3 MB)'), 'c-e'); continue; }
    let s = null; try { s = new TextDecoder('utf-8', { fatal: true }).decode(b); } catch (e) { }
    const { dir, name } = parentOf(target); if (!dir) { print(T('hedef dizin yok', 'target directory missing'), 'c-e'); continue; }
    dir.c[name] = s != null ? { t: 'f', d: s, m: Date.now() } : { t: 'f', b: 1, d: btoa(Array.from(b, x => String.fromCharCode(x)).join('')), m: Date.now() };
    print(T('eklendi: ', 'added: ') + target + ' (' + hsize(b.length) + ')', 'c-a');
  } fsSave();
}

/* ---------------- tamamlama ---------------- */
function complete() {
  const v = CMD.value, pos = CMD.selectionStart, before = v.slice(0, pos), m = before.match(/(\S*)$/), word = m[1], isCmd = !/\S\s/.test(before.replace(/.*[|;&]\s*/, '') + '') && !before.replace(/.*[|;&]\s*/, '').includes(' ');
  let cands = [];
  if (isCmd && !word.includes('/')) cands = [...new Set(Object.keys(CMDS).concat(Object.keys(ALIAS)))].filter(k => k.startsWith(word) && k !== '?').sort().map(k => k + ' ');
  else { const i = word.lastIndexOf('/'), dirPart = i >= 0 ? word.slice(0, i + 1) : '', base = i >= 0 ? word.slice(i + 1) : word, n = node(dirPart || '.'); if (n && n.t === 'd') cands = Object.keys(n.c).filter(k => k.startsWith(base) && (base.startsWith('.') || !k.startsWith('.'))).sort().map(k => dirPart + k + (n.c[k].t === 'd' ? '/' : ' ')); }
  if (!cands.length) return;
  let common = cands[0]; for (const c2 of cands) { let j = 0; while (j < common.length && common[j] === c2[j]) j++; common = common.slice(0, j); }
  if (common.length > word.length) { CMD.setRangeText(common, pos - word.length, pos, 'end'); return; }
  if (cands.length > 1) { const q = psInfo(); printHTML(`<span class="ps">${esc(q.u)}:<b>${esc(q.p)}</b>$ </span>${esc(v)}`); print(cands.map(x => x.trim()).join('  '), 'c-m'); }
}

  else if (e.ctrlKey && e.key.toLowerCase() === 'l') { e.preventDefault(); OUT.innerHTML = ''; }
  else if (e.ctrlKey && e.key.toLowerCase() === 'd' && !CMD.value) { e.preventDefault(); if (MODE) { print('', ''); MODE = null; if (PY) syncFromPy(); paintPS(); } }
  else if (e.ctrlKey && e.key.toLowerCase() === 'u') { e.preventDefault(); CMD.value = CMD.value.slice(CMD.selectionStart); CMD.setSelectionRange(0, 0); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'a') { e.preventDefault(); CMD.setSelectionRange(0, 0); }
  else if (e.ctrlKey && e.key.toLowerCase() === 'e') { e.preventDefault(); CMD.setSelectionRange(CMD.value.length, CMD.value.length); }
