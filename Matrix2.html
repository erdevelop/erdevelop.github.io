<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matrix Yağmuru · 3B Derinlik | erdevelop</title>
<meta name="description" content="Farklı derinlikte katmanlardan oluşan, fareyle paralaks yapan Matrix yağmuru.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="deneyler/kit.css">

</head>
<body>
<script src="deneyler/kit.js"></script>
<script>
const ALPHA = 'アカサタナハマヤラワガザダバパイキシチニヒミリギジヂビピウクスツヌフムユルグズヅブプエケセテネヘメレゲゼデベペオコソトノホモヨロヲゴゾドボポヴッンABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
let S, L = [];
const K = Kit({ id: 'matrix2', title: 'Matrix Yağmuru', sub: '3B derinlik', help: 'Yakındaki katmanlar büyük, parlak ve hızlı; uzaktakiler küçük ve soluk. Fareyi gezdir: katmanlar farklı oranda kayar (paralaks).',
  controls: [
    { k: 'mode', t: 'select', l: 'Mod', o: [['default', 'Klasik yeşil'], ['randomColors', 'Rastgele renkler'], ['rainbow', 'Gökkuşağı akışı'], ['depth', 'Derinliğe göre renk']], v: 'default' },
    { k: 'speed', t: 'range', l: 'Hız', min: 1, max: 100, v: 50 },
    { k: 'layers', t: 'range', l: 'Katman sayısı', min: 1, max: 5, v: 3 },
    { k: 'par', t: 'range', l: 'Paralaks', min: 0, max: 1, step: .05, v: .5 },
    { k: 'trail', t: 'range', l: 'İz', min: .02, max: .3, step: .01, v: .08, fmt: x => x.toFixed(2) },
    { k: 'col', t: 'color', l: 'Klasik mod rengi', v: '#00ff41' }
  ],
  onChange: k => { if (['layers', '*'].includes(k)) setup(); }
});
function setup() {
  L = []; const n = K.v.layers;
  for (let d = 0; d < n; d++) { const z = n === 1 ? 1 : d / (n - 1), fs = Math.round(10 + z * 16), cols = Math.ceil(S.W * 1.2 / fs);
    L.push({ z, fs, a: .35 + z * .65, sp: .4 + z * .9, drops: Array.from({ length: cols }, () => ({ y: rnd(-S.H / fs, S.H / fs), s: rnd(.6, 1.3) })) }); }
  S.ctx.fillStyle = '#000'; S.ctx.fillRect(0, 0, S.W, S.H);
}
S = K.canvas(); S.onResize(setup);
let px = 0, hue = 0;
K.loop((dt, t) => {
  const v = K.v, g = S.ctx, f = dt * 60, P = K.ptr; hue = (hue + f) % 360;
  const tx = P.active ? (P.x / S.W - .5) : Math.sin(t * .2) * .2; px += (tx - px) * .05;
  g.fillStyle = `rgba(0,0,0,${v.trail})`; g.fillRect(0, 0, S.W, S.H);
  for (const l of L) {
    const off = -px * l.z * 160 * v.par - S.W * .1; g.font = `${l.fs}px ui-monospace, Menlo, monospace`; g.globalAlpha = l.a;
    l.drops.forEach((d, i) => {
      const x = off + i * l.fs, y = Math.floor(d.y) * l.fs;
      g.fillStyle = v.mode === 'randomColors' ? `hsl(${Math.random() * 360},100%,60%)` : v.mode === 'rainbow' ? `hsl(${(hue + i * 6 + l.z * 120) % 360},100%,60%)` : v.mode === 'depth' ? `hsl(${200 - l.z * 80},100%,${45 + l.z * 25}%)` : v.col;
      g.fillText(ALPHA[Math.floor(Math.random() * ALPHA.length)], x, y);
      d.y += d.s * l.sp * (v.speed / 50) * f * .35;
      if (y > S.H && Math.random() > .97) { d.y = rnd(-20, 0); d.s = rnd(.6, 1.3); }
    });
  }
  g.globalAlpha = 1;
});

</script>
<script data-goatcounter="https://erdevelop.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
