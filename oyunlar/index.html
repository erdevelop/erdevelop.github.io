<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<title>Oyun Bahçesi</title>
<meta name="description" content="Onlarca sade, hızlı mini oyun. Telefonda da oynanır.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app">
  <!-- Üst bar -->
  <header class="topbar">
    <button class="brand" id="homeBtn" aria-label="Ana sayfa">
      <span class="brand-dot"></span>
      <span class="brand-name">Oyun Bahçesi</span>
    </button>
    <div class="top-actions">
      <button class="icon-btn" id="themeBtn" title="Tema" aria-label="Temayı değiştir">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </button>
      <button class="account-btn" id="accountBtn">
        <span id="accountLabel">Giriş</span>
      </button>
    </div>
  </header>

  <!-- Ana ekran -->
  <main id="home" class="view">
    <section class="hero">
      <h1>Oyna, biraz dağıl.</h1>
      <p class="hero-sub">Sade, hızlı mini oyunlar. Hesabınla girince en iyi skorların her cihazda seninle gelir.</p>
      <div class="searchbar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4-4"></path></svg>
        <input id="search" type="search" placeholder="Oyun ara…" autocomplete="off">
      </div>
    </section>

    <nav class="chips" id="categoryChips"></nav>

    <section class="grid" id="gameGrid"></section>
    <p class="empty" id="emptyState" hidden>Aramaya uyan oyun yok.</p>

    <footer class="site-foot">
      <span id="gameCount"></span>
    </footer>
  </main>

  <!-- Oyun ekranı -->
  <main id="player" class="view" hidden>
    <div class="player-head">
      <button class="back-btn" id="backBtn" aria-label="Geri">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
        <span>Oyunlar</span>
      </button>
      <div class="player-title">
        <h2 id="playerTitle"></h2>
        <span class="best-badge" id="bestBadge" hidden></span>
      </div>
      <button class="icon-btn" id="restartBtn" title="Yeniden başlat" aria-label="Yeniden başlat">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
      </button>
    </div>
    <div id="gameMount" class="game-mount"></div>
  </main>

  <!-- Hesap paneli -->
  <div id="authModal" class="modal" hidden>
    <div class="modal-card">
      <button class="modal-close" id="authClose" aria-label="Kapat">×</button>
      <div id="authBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</div>

<!-- Çekirdek -->
<script src="assets/config.js"></script>
<script src="assets/store.js"></script>
<script src="assets/auth.js"></script>
<!-- Oyun motoru yardımcıları -->
<script src="games/_engine.js"></script>
<!-- Oyunlar (her biri kendini kaydeder) -->
<script src="games/yilan.js"></script>
<script src="games/2048.js"></script>
<script src="games/hafiza.js"></script>
<script src="games/mayin.js"></script>
<script src="games/tahmin.js"></script>
<script src="games/tas-kagit-makas.js"></script>
<script src="games/reaksiyon.js"></script>
<script src="games/bloklar.js"></script>
<script src="games/kiristopu.js"></script>
<script src="games/renk-hafiza.js"></script>
<script src="games/15-tas.js"></script>
<script src="games/wordle-tr.js"></script>
<script src="games/ucan-kus.js"></script>
<script src="games/matematik.js"></script>
<script src="games/kostebek.js"></script>
<script src="games/dort-tas.js"></script>
<script src="games/nisan.js"></script>
<script src="games/yazma.js"></script>
<script src="games/anagram.js"></script>
<script src="games/yakala.js"></script>
<script src="games/sayi-dizisi.js"></script>
<script src="games/balon.js"></script>
<script src="games/sirali-dokun.js"></script>
<!-- Uygulama kabuğu en son -->
<script src="assets/app.js"></script>
</body>
</html>
