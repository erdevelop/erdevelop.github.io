<style>

.table { background: radial-gradient(ellipse at 50% 0%, #1f6b4a, #0f3b29 70%); border: 1px solid #0b2d20; border-radius: 14px; padding: 20px 18px; color: #e8f3ec; box-shadow: inset 0 0 60px rgba(0,0,0,.35); position: relative; overflow: hidden; }
.table::after { content: "BLACKJACK ÖDER 3 : 2 · KRUPİYE 17'DE DURUR"; position: absolute; left: 0; right: 0; top: 50%; text-align: center; font: 600 11px var(--f-mono); letter-spacing: 2px; color: rgba(255,255,255,.22); transform: translateY(-50%); pointer-events: none; }
.side { min-height: 170px; } .side + .side { margin-top: 24px; }
.lab { display: flex; gap: 10px; align-items: center; font: 500 12px var(--f-mono); color: rgba(255,255,255,.7); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.tot { background: rgba(0,0,0,.35); color: #fff; border-radius: 999px; padding: 1px 10px; font: 600 14px var(--f-mono); }
.hand { display: flex; min-height: 130px; padding-left: 4px; }
.card { width: 88px; height: 124px; border-radius: 8px; margin-left: -28px; flex: none; box-shadow: 0 4px 12px rgba(0,0,0,.35); position: relative; animation: deal .35s cubic-bezier(.2,.7,.2,1) both; background: #fff; overflow: hidden; }
.card:first-child { margin-left: 0; }
.card img.ci { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #fff; }
.card.back { background: repeating-linear-gradient(45deg, #2f6fb5 0 6px, #24589a 6px 12px); border: 4px solid #fff; }
.card.css { display: flex; flex-direction: column; justify-content: space-between; padding: 6px 8px; font: 700 20px/1 var(--f-display); }
.card.css .c { font-size: 34px; text-align: center; }
.card.css .b { transform: rotate(180deg); }
.red { color: #c0392b; } .blk { color: #1c2833; }
@keyframes deal { from { transform: translate(140px, -80px) rotate(12deg); opacity: 0; } }
@media (max-width: 520px) { .table::after { display: none; } .card { width: 66px; height: 94px; margin-left: -24px; } .hand { min-height: 100px; } .card.css { font-size: 15px; } .card.css .c { font-size: 24px; } }
.msg { text-align: center; font: 700 clamp(1.2rem, 4vw, 1.6rem) var(--f-display); text-transform: uppercase; letter-spacing: 1px; min-height: 2em; margin: 14px 0 0; position: relative; z-index: 1; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
.chipb { width: 54px; height: 54px; border-radius: 50%; border: 4px dashed rgba(255,255,255,.7); font: 700 14px var(--f-mono); color: #fff; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.3); }
.chipb:disabled { opacity: .35; cursor: default; }
.bank { font: 500 13px var(--f-mono); color: var(--muted); } .bank b { color: var(--fg); font: 600 1.4rem var(--f-display); }
.pot { font: 600 15px var(--f-mono); }

<body>
<div class="bg" aria-hidden="true"></div>
<div class="topbar"><div class="wrap">
  <a class="brand" href="../">erdevelop<span>_</span></a><span class="crumb">/ tools / 21</span><span class="sp"></span>

</div></div>
<main class="wrap">
  <header class="head"><h1>21 · Blackjack</h1><p>Krupiyeye karşı klasik 21: 6 desteli ayakkabı, krupiye 17’de durur, blackjack 3:2 öder, ikiye katlama var. Fişler sanal; para yok.</p></header>

  <div class="layer">
    <div class="table">
      <div class="side"><div class="lab">Krupiye <span class="tot" id="dt" hidden></span></div><div class="hand" id="dh"></div></div>
      <div class="msg" id="msg">Bahsini seç</div>
      <div class="side"><div class="lab">Sen <span class="tot" id="pt" hidden></span></div><div class="hand" id="ph"></div></div>
    </div>
    <div class="bar">
      <div class="bank">Kasa <b id="bank">1.000</b></div><div class="pot">Bahis: <span id="bet">0</span></div><span class="sp"></span>
      <span id="chips"><button class="chipb" type="button" data-v="10" style="background:#5aa9ff">10</button> <button class="chipb" type="button" data-v="25" style="background:#4cc38a">25</button> <button class="chipb" type="button" data-v="50" style="background:#f0a04b">50</button> <button class="chipb" type="button" data-v="100" style="background:#1c2833">100</button></span>
    </div>
    <div class="bar">
      <button class="btn" type="button" id="clr">Bahsi sıfırla</button><button class="btn pri" type="button" id="deal">Dağıt</button>
      <button class="btn pri" type="button" id="hit" hidden>Kart çek (H)</button><button class="btn" type="button" id="stand" hidden>Dur (S)</button><button class="btn" type="button" id="dbl" hidden>İkiye katla (D)</button>
      <span class="sp"></span><span class="muted small mono" id="stat"></span><button class="btn" type="button" id="reset">Kasayı sıfırla</button>
    </div>
    <p class="note" id="src"></p>
  </div>
</main>
<footer><div class="wrap"><span>Desteler: <a href="https://deckofcardsapi.com/" target="_blank" rel="noopener">Deck of Cards API</a></span><a href="../Tools.html">← tüm araçlar</a></div></footer>

<script src="tema.js"></script>
<script>

const API = 'https://deckofcardsapi.com/api/deck';
const S = { bank: +store.get('bj:bank', 1000), bet: 0, deck: null, local: null, ph: [], dh: [], phase: 'bet', st: store.json('bj:st', { w: 0, l: 0, p: 0, bj: 0 }), hide: true };
const VAL = { ACE: 11, KING: 10, QUEEN: 10, JACK: 10 };
const total = h => { let t = 0, a = 0; h.forEach(c => { const v = VAL[c.value] ?? +c.value; t += v; if (c.value === 'ACE') a++; }); while (t > 21 && a) { t -= 10; a--; } return t; };
const isBJ = h => h.length === 2 && total(h) === 21;
const SUIT = { SPADES: '♠', HEARTS: '♥', DIAMONDS: '♦', CLUBS: '♣' }, RANK = { ACE: 'A', KING: 'K', QUEEN: 'Q', JACK: 'J', '10': '10' };
/* yedek: yerel 6 desteli ayakkabı (servis yoksa) */
function localShoe() { const a = []; for (let d = 0; d < 6; d++) for (const s of Object.keys(SUIT)) for (const v of ['ACE', '2', '3', '4', '5', '6', '7', '8', '9', '10', 'JACK', 'QUEEN', 'KING']) a.push({ value: v, suit: s }); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function newShoe() { try { const j = await TM.json(`${API}/new/shuffle/?deck_count=6`, {}, 8000); S.deck = { id: j.deck_id, left: j.remaining }; S.local = null; $('src').textContent = 'Kartlar Deck of Cards API ile karıştırılıp çekiliyor.'; } catch (e) { S.deck = null; S.local = localShoe(); $('src').textContent = 'Kart servisine ulaşılamadı; kartlar tarayıcıda karıştırılıyor.'; } }
async function draw(n) {
  if (S.deck) { try { if (S.deck.left < 60) { await TM.json(`${API}/${S.deck.id}/shuffle/`, {}, 8000); S.deck.left = 312; TM.toast('Ayakkabı yeniden karıştırıldı'); } const j = await TM.json(`${API}/${S.deck.id}/draw/?count=${n}`, {}, 8000); S.deck.left = j.remaining; return j.cards; } catch (e) { S.deck = null; S.local = localShoe(); $('src').textContent = 'Kart servisi yanıt vermedi; tarayıcıda karıştırılan desteye geçildi.'; } }
  if (!S.local || S.local.length < 60) S.local = localShoe(); return S.local.splice(0, n);
}
const red = c => c.suit === 'HEARTS' || c.suit === 'DIAMONDS';
function cardEl(c, back) { if (back) return '<div class="card back"></div>'; const r = RANK[c.value] || c.value, s = SUIT[c.suit];
  return `<div class="card css ${red(c) ? 'red' : 'blk'}"><span>${r}<br>${s}</span><span class="c">${s}</span><span class="b">${r}<br>${s}</span>${c.image ? `<img class="ci" src="${esc(c.image.replace(/^http:/, 'https:'))}" alt="${r}${s}" onerror="this.remove()">` : ''}</div>`; }
function paint() {
  $('bank').textContent = nf(S.bank); $('bet').textContent = nf(S.bet);
  $('ph').innerHTML = S.ph.map(c => cardEl(c)).join(''); $('dh').innerHTML = S.dh.map((c, i) => cardEl(c, i === 1 && S.hide)).join('');
  $('pt').hidden = !S.ph.length; $('pt').textContent = total(S.ph); $('dt').hidden = !S.dh.length; $('dt').textContent = S.hide && S.dh.length ? total([S.dh[0]]) + ' + ?' : total(S.dh);
  const play = S.phase === 'play'; ['hit', 'stand'].forEach(id => $(id).hidden = !play); $('dbl').hidden = !(play && S.ph.length === 2 && S.bank >= S.bet);
  $('deal').hidden = play || S.phase === 'busy'; $('clr').hidden = play || S.phase === 'busy';
  document.querySelectorAll('.chipb').forEach(b => b.disabled = play || S.phase === 'busy' || +b.dataset.v > S.bank - (S.phase === 'done' ? 0 : S.bet));
  $('stat').textContent = `${S.st.w} kazanç · ${S.st.l} kayıp · ${S.st.p} berabere · ${S.st.bj} blackjack`;
  store.set('bj:bank', S.bank); store.put('bj:st', S.st);
}
document.querySelectorAll('.chipb').forEach(b => b.onclick = () => { if (S.phase === 'done') { S.phase = 'bet'; S.ph = []; S.dh = []; S.bet = 0; } const v = +b.dataset.v; if (S.bet + v <= S.bank) { S.bet += v; $('msg').textContent = 'Hazır olunca dağıt'; } paint(); });
$('clr').onclick = () => { S.bet = 0; paint(); };
$('reset').onclick = () => { if (!confirm('Kasa 1.000 fişe dönsün ve istatistikler silinsin mi?')) return; S.bank = 1000; S.bet = 0; S.st = { w: 0, l: 0, p: 0, bj: 0 }; S.ph = []; S.dh = []; S.phase = 'bet'; $('msg').textContent = 'Bahsini seç'; paint(); };
const wait = ms => new Promise(r => setTimeout(r, ms));
$('deal').onclick = async () => {
  if (S.phase === 'done') { S.ph = []; S.dh = []; if (S.bet > S.bank) S.bet = 0; }
  if (!S.bet) return TM.toast('Önce fişe dokunarak bahis koy');
  if (S.bet > S.bank) return TM.toast('Kasada yeterli fiş yok');
  S.phase = 'busy'; S.hide = true; S.ph = []; S.dh = []; $('msg').textContent = ''; paint(); if (!S.deck && !S.local) await newShoe();
  const c = await draw(4); S.bank -= S.bet; S.ph = [c[0]]; paint(); await wait(250); S.dh = [c[1]]; paint(); await wait(250); S.ph.push(c[2]); paint(); await wait(250); S.dh.push(c[3]); paint();
  if (isBJ(S.ph) || isBJ(S.dh)) return settle(); S.phase = 'play'; $('msg').textContent = 'Kart çek ya da dur'; paint();
};
$('hit').onclick = async () => { if (S.phase !== 'play') return; S.phase = 'busy'; paint(); S.ph.push(...await draw(1)); if (total(S.ph) > 21) return settle(); if (total(S.ph) === 21) return dealer(); S.phase = 'play'; paint(); };
$('stand').onclick = () => { if (S.phase === 'play') dealer(); };
$('dbl').onclick = async () => { if (S.phase !== 'play' || S.ph.length !== 2 || S.bank < S.bet) return; S.bank -= S.bet; S.bet *= 2; S.phase = 'busy'; paint(); S.ph.push(...await draw(1)); if (total(S.ph) > 21) return settle(); dealer(); };
async function dealer() { S.phase = 'busy'; S.hide = false; paint(); await wait(450); while (total(S.dh) < 17) { S.dh.push(...await draw(1)); paint(); await wait(450); } settle(); }
function settle() {
  S.hide = false; const p = total(S.ph), d = total(S.dh), pb = isBJ(S.ph), db = isBJ(S.dh); let m, pay = 0;
  if (pb && !db) { pay = S.bet * 2.5; m = 'Blackjack! +' + nf(S.bet * 1.5); S.st.w++; S.st.bj++; }
  else if (db && !pb) { m = 'Krupiye blackjack yaptı'; S.st.l++; }
  else if (pb && db) { pay = S.bet; m = 'İkiniz de blackjack: berabere'; S.st.p++; }
  else if (p > 21) { m = 'Battın (' + p + ')'; S.st.l++; }
  else if (d > 21) { pay = S.bet * 2; m = 'Krupiye battı, kazandın +' + nf(S.bet); S.st.w++; }
  else if (p > d) { pay = S.bet * 2; m = 'Kazandın +' + nf(S.bet); S.st.w++; }
  else if (p < d) { m = 'Krupiye kazandı'; S.st.l++; }
  else { pay = S.bet; m = 'Berabere'; S.st.p++; }
  S.bank += pay; S.phase = 'done'; if (S.bet > S.bank) S.bet = 0; $('msg').textContent = m; paint();
  if (S.bank < 10) setTimeout(() => { TM.toast('Fişin bitti, kasa yenilendi'); S.bank = 1000; S.bet = 0; paint(); }, 1500);
}
addEventListener('keydown', e => { if (e.target.closest('input,select,textarea')) return; const k = e.key.toLowerCase(); if (k === 'h') $('hit').click(); else if (k === 's') $('stand').click(); else if (k === 'd') $('dbl').click(); else if (k === 'enter' && S.phase !== 'play' && S.phase !== 'busy') $('deal').click(); });
newShoe(); paint();

</script>
