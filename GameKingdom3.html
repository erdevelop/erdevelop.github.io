<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Küçük Krallık</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4EF;--card:#FAFCF8;--ink:#33504A;--mute:#6F8A82;--acc:#5E9C8A;--acc2:#4A8574;--line:#D8E5DC;--lack:#B8705F;
--sky1:#D9E9F0;--sky2:#F4F8EE;--g1:#BBD6AD;--g2:#A8C99A;--hill:#CFE2C3;--wood:#C79A6B;--woodd:#8C6B4F;--stone:#B9C0C4;--stoned:#98A1A7;
--roof:#8DA8C8;--leaf:#7FB08A;--leaf2:#6A9F78;--cream:#F1E8D8;--barn:#DCC9A3;--cloud:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C2724;--card:#24332F;--ink:#DCE9E2;--mute:#93AAA1;--acc:#6FB3A0;--acc2:#5AA08D;--line:#34463F;--lack:#D58C7A;
--sky1:#2B3F4A;--sky2:#33463F;--g1:#3F5B3F;--g2:#385238;--hill:#44614A;--wood:#A57B52;--woodd:#6E5239;--stone:#8C959A;--stoned:#707A80;
--roof:#6F8BB0;--leaf:#5E9569;--leaf2:#4E8259;--cream:#CDBFA6;--barn:#A8946F;--cloud:#5B7078}}
:root[data-theme="dark"]{--bg:#1C2724;--card:#24332F;--ink:#DCE9E2;--mute:#93AAA1;--acc:#6FB3A0;--acc2:#5AA08D;--line:#34463F;--lack:#D58C7A;
--sky1:#2B3F4A;--sky2:#33463F;--g1:#3F5B3F;--g2:#385238;--hill:#44614A;--wood:#A57B52;--woodd:#6E5239;--stone:#8C959A;--stoned:#707A80;
--roof:#6F8BB0;--leaf:#5E9569;--leaf2:#4E8259;--cream:#CDBFA6;--barn:#A8946F;--cloud:#5B7078}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 "Nunito",ui-rounded,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
.stage{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.stage b{font-size:18px;font-weight:800;min-width:64px}
.bar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:8px;transition:width .4s}
.stage small{color:var(--mute);font-size:12px;flex:0 0 100%;order:3;margin-top:-4px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.chip{background:var(--card);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column}
.chip b{font-size:20px;font-weight:800}
.chip small{color:var(--mute);font-size:12px;font-weight:500}
.chip em{font-style:normal;color:var(--acc2);font-size:13px;font-weight:700}
.ic{display:inline-block;width:.8em;height:.8em;border-radius:3px;vertical-align:-1px;margin-right:5px}
.ic.w{background:var(--wood)}.ic.s{background:var(--stone)}.ic.f{background:#E3C16F}.ic.a{background:#8EC1DE}.wt{fill:#8EC1DE}
.btns{display:flex;gap:6px}button.sm{min-width:52px;padding:8px 12px}
svg.scene{display:block;width:100%;height:auto;border-radius:20px;margin-bottom:12px}
.cr{fill:var(--cream)}.rf{fill:var(--roof)}.wd{fill:var(--wood)}.wdd{fill:var(--woodd)}.st{fill:var(--stone)}.std{fill:var(--stoned)}
.bn{fill:var(--barn)}.lf{fill:var(--leaf)}.lf2{fill:var(--leaf2)}.ac{fill:var(--acc)}.gd{fill:var(--gold,#E3C16F)}.sk{fill:var(--sky1)}.cl{fill:var(--cloud);opacity:.8}
.sw{transform-origin:50% 100%;transform-box:fill-box;animation:sway 4.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.cloud{animation:drift 90s linear infinite}
.cloud.b{animation-duration:140s;animation-delay:-60s}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(520px)}}
.smoke{animation:rise 4s ease-out infinite;fill:var(--cloud);opacity:0}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:.7}100%{transform:translate(6px,-18px) scale(1.4);opacity:0}}
.busy{animation:pulse 1.1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.62}to{opacity:1}}
.ghost{opacity:.3}.hide{display:none}
#list,#quests,#army{display:grid;gap:10px}
h2{font-size:15px;font-weight:800;margin:18px 2px 8px}
.q{display:flex;align-items:center;justify-content:space-between;gap:10px}.q p{margin:0}.q small{color:var(--mute);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:12px 14px}
.top{display:flex;align-items:center;gap:8px}
.top h3{margin:0;font-size:16px;font-weight:800;flex:1}
.lv{color:var(--mute);font-size:13px}
.eff{margin:2px 0 10px;color:var(--mute);font-size:13px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cost{display:flex;gap:12px;font-weight:700}
.lack{color:var(--lack)}
button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:9px 16px;background:var(--acc);color:#fff;cursor:pointer;min-width:96px}
button:hover:not(:disabled){background:var(--acc2)}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button:disabled{background:var(--line);color:var(--mute);cursor:default}
.prog{height:5px;border-radius:5px;background:var(--line);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s linear}
.prog.off{display:none}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.reset{display:block;margin:18px auto 0;background:none;color:var(--mute);font-size:12px;font-weight:500;min-width:0}
.reset:hover:not(:disabled){background:none;color:var(--ink)}
@media (prefers-reduced-motion:reduce){.sw,.cloud,.smoke,.busy{animation:none}.smoke{opacity:.4}}
</style>
</head>
<body>
<main>
<div class="stage"><b id="stn">Köy</b><div class="bar"><i id="stb"></i></div><small id="sth"></small></div>
<div class="res">
 <div class="chip"><b><i class="ic w"></i><span id="rw">0</span></b><small id="rwc"></small><em id="rwr"></em></div>
 <div class="chip"><b><i class="ic s"></i><span id="rs">0</span></b><small id="rsc"></small><em id="rsr"></em></div>
 <div class="chip hide" id="chf"><b><i class="ic f"></i><span id="rf">0</span></b><small id="rfc"></small><em id="rfr"></em></div>
 <div class="chip hide" id="cha"><b><i class="ic a"></i><span id="ra">0</span></b><small id="rac"></small><em id="rar"></em></div>
</div>

<svg class="scene" viewBox="0 0 460 330" role="img" aria-label="Köy manzarası">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient>
 <g id="tree"><rect x="-2" y="-14" width="4" height="14" class="wdd"/><circle cy="-22" r="11" class="lf"/><circle cx="6" cy="-15" r="8" class="lf2"/></g>
</defs>

<ellipse cx="230" cy="186" rx="52" ry="7" class="cr" opacity=".5"/>
<g transform="translate(22 172)"><use class="sw" href="#tree"/></g>
<g transform="translate(46 178) scale(.8)"><use class="sw" href="#tree"/></g>
<g transform="translate(438 176)"><use class="sw" href="#tree"/></g>
<g transform="translate(200 150) scale(.7)"><use class="sw" href="#tree"/></g>
<g transform="translate(262 148) scale(.7)"><use class="sw" href="#tree"/></g>

<g id="g-saw"><rect x="-15" y="-12" width="30" height="12" rx="2" class="bn"/><polygon points="-19,-11 -15,-22 19,-22 19,-11" class="wdd"/><rect x="-5" y="-9" width="9" height="9" class="wd"/><rect x="20" y="-4" width="14" height="4" class="wd"/><rect x="21" y="-8" width="12" height="4" class="wdd"/></g>
<g id="g-mason"><rect x="-14" y="-10" width="28" height="10" rx="2" class="st"/><rect x="-10" y="-20" width="20" height="10" rx="2" class="std"/><polygon points="16,-3 24,-14 27,-11" class="wdd"/><rect x="-24" y="-5" width="8" height="5" rx="1" class="std"/></g>

<g id="g-tower"><rect x="-9" y="-40" width="18" height="40" rx="2" class="st"/><rect x="-12" y="-46" width="24" height="6" rx="1" class="std"/><polygon points="-12,-46 0,-62 12,-46" class="rf"/><rect x="-3" y="-30" width="6" height="9" rx="3" class="sk"/></g>
<g id="g-wall"><rect x="-30" y="-12" width="60" height="12" class="st"/><rect x="-30" y="-16" width="8" height="4" class="st"/><rect x="-14" y="-16" width="8" height="4" class="st"/><rect x="2" y="-16" width="8" height="4" class="st"/><rect x="22" y="-16" width="8" height="4" class="st"/><rect x="-6" y="-10" width="12" height="10" rx="5" class="wdd"/></g>
<g id="g-wood"><g transform="translate(-30 0)"><use class="sw" href="#tree"/></g><rect x="-20" y="-16" width="34" height="16" rx="2" class="wd"/><polygon points="-24,-15 -3,-30 18,-15" class="wdd"/><rect x="-6" y="-11" width="8" height="11" class="wdd"/><circle cx="24" cy="-4" r="4" class="wd"/><circle cx="31" cy="-4" r="4" class="wd"/><circle cx="27.5" cy="-10" r="4" class="wdd"/></g>
<g id="g-stone"><polygon points="-22,0 -16,-16 -4,-20 6,-12 8,0" class="st"/><polygon points="2,0 8,-10 20,-12 26,0" class="std"/><rect x="-6" y="-8" width="12" height="8" rx="1" class="cr" opacity=".85"/></g>
<g id="g-store"><rect x="-24" y="-20" width="48" height="20" rx="2" class="bn"/><polygon points="-28,-19 -24,-30 24,-30 28,-19" class="rf"/><rect x="-7" y="-14" width="14" height="14" class="wdd"/><path d="M-7,-14 L7,0 M7,-14 L-7,0" stroke-width="1.2" style="stroke:var(--barn)"/></g>
<g id="g-main"><g id="m4"><rect x="-42" y="-18" width="18" height="18" rx="2" class="cr"/><polygon points="-45,-17 -33,-28 -21,-17" class="rf"/></g><g id="m7"><rect x="26" y="-34" width="14" height="34" rx="2" class="cr"/><polygon points="24,-33 33,-48 42,-33" class="rf"/></g><rect x="-26" y="-30" width="52" height="30" rx="3" class="cr"/><rect x="15" y="-54" width="7" height="16" class="std"/><circle class="smoke" cx="18.5" cy="-56" r="3"/><polygon points="-33,-29 0,-58 33,-29" class="rf"/><rect x="-6" y="-16" width="12" height="16" rx="6" class="wdd"/><rect x="-20" y="-24" width="8" height="8" rx="2" class="sk"/><rect x="12" y="-24" width="8" height="8" rx="2" class="sk"/><line x1="0" y1="-58" x2="0" y2="-76" stroke-width="2" style="stroke:var(--woodd)"/><polygon points="0,-76 13,-71 0,-66" class="ac"/><g id="m10"><polygon points="-8,-76 -8,-84 -4,-80 0,-86 4,-80 8,-84 8,-76" class="gd"/></g></g>
<g id="g-farm"><rect x="-24" y="-6" width="48" height="6" rx="2" class="gd"/><path d="M-18,-6V-2M-8,-6V-2M2,-6V-2M12,-6V-2" stroke-width="1.5" style="stroke:var(--woodd)"/><rect x="-8" y="-18" width="16" height="12" rx="1" class="wd"/><polygon points="-11,-17 0,-27 11,-17" class="wdd"/><circle cx="-17" cy="-9" r="3" class="lf"/><circle cx="17" cy="-9" r="3" class="lf"/></g>
<g id="g-well"><rect x="-10" y="-10" width="20" height="10" rx="2" class="st"/><ellipse cy="-10" rx="8" ry="2.5" class="wt"/><rect x="-11" y="-26" width="2" height="16" class="wdd"/><rect x="9" y="-26" width="2" height="16" class="wdd"/><polygon points="-14,-25 0,-34 14,-25" class="rf"/></g>
<g id="g-inf"><rect x="-18" y="-14" width="36" height="14" rx="2" class="cr"/><polygon points="-22,-13 0,-27 22,-13" class="rf"/><circle cy="-7" r="4" class="ac"/></g>
<g id="g-spear"><rect x="-18" y="-14" width="36" height="14" rx="2" class="cr"/><polygon points="-22,-13 0,-27 22,-13" class="wdd"/><path d="M-9,-6V-30M9,-6V-30" stroke-width="2" style="stroke:var(--woodd)"/><polygon points="-12,-30 -9,-38 -6,-30" class="std"/><polygon points="6,-30 9,-38 12,-30" class="std"/></g>
<g id="g-arch"><rect x="-18" y="-14" width="30" height="14" rx="2" class="bn"/><polygon points="-22,-13 -3,-26 16,-13" class="wdd"/><rect x="19" y="-16" width="2" height="16" class="wdd"/><circle cx="20" cy="-20" r="7" class="cr"/><circle cx="20" cy="-20" r="4" class="ac"/><circle cx="20" cy="-20" r="1.5" class="rf"/></g>
<g id="g-cav"><rect x="-20" y="-14" width="40" height="14" rx="2" class="wd"/><polygon points="-24,-13 -20,-25 20,-25 24,-13" class="wdd"/><rect x="-14" y="-10" width="10" height="10" rx="5" class="cr"/><rect x="4" y="-10" width="10" height="10" rx="5" class="cr"/></g>
<g id="g-cat"><rect x="-16" y="-8" width="32" height="8" rx="2" class="wd"/><path d="M-12,-8L12,-32" stroke-width="3" stroke-linecap="round" style="stroke:var(--woodd)"/><circle cx="-13" cy="-8" r="5" class="std"/><circle cx="13" cy="-32" r="3.5" class="st"/><circle cx="-9" cy="0" r="4" class="wdd"/><circle cx="9" cy="0" r="4" class="wdd"/></g>
</svg>

<h2>Görevler</h2><section id="quests"></section>
<h2>Ordu</h2><p class="eff" id="ast"></p><section id="army"></section>
<h2>Binalar</h2><section id="list"></section>
<button class="reset" id="rst">Baştan başla</button>
</main>
<div id="toast" role="status"></div>

<script>
const KEY='kucuk-krallik-v1',MAXL=10;
const POS={saw:[130,160],mason:[350,160],wood:[70,198],stone:[392,198],store:[310,228],main:[230,176],wall:[170,238],tower:[410,150],farm:[95,278],well:[200,282],inf:[60,320],spear:[145,320],arch:[230,320],cav:[315,320],cat:[405,320]};
const D={
 main:{n:'Ana bina',c:{w:30,s:12}},
 wood:{n:'Oduncu',c:{w:20,s:0}},
 stone:{n:'Taş ocağı',c:{w:25,s:8}},
 store:{n:'Depo',c:{w:40,s:20}},
 saw:{n:'Marangozhane',c:{w:80,s:60},lock:2},
 mason:{n:'Taşçı atölyesi',c:{w:80,s:60},lock:2},
 wall:{n:'Surlar',c:{w:150,s:120},lock:3},
 tower:{n:'Gözcü kulesi',c:{w:120,s:150},lock:3},
 farm:{n:'Çiftlik',c:{w:60,s:20},lock:2},
 well:{n:'Kuyu',c:{w:30,s:50},lock:2},
 inf:{n:'Piyade kışlası',c:{w:100,s:60},lock:2},
 spear:{n:'Mızrakçı kışlası',c:{w:100,s:70},lock:2},
 arch:{n:'Okçu menzili',c:{w:110,s:80},lock:2},
 cav:{n:'Ahır',c:{w:140,s:90},lock:2},
 cat:{n:'Mancınık atölyesi',c:{w:160,s:140},lock:2}
};
const U={
 inf:{n:'Piyade',c:{w:30,f:20},t:8,f:.02,a:.015,g:['Süvari','Mancınık'],z:['Mızrakçı','Okçu']},
 spear:{n:'Mızrakçı',c:{w:35,f:20},t:8,f:.02,a:.015,g:['Süvari','Piyade'],z:['Okçu','Mancınık']},
 arch:{n:'Okçu',c:{w:45,f:25},t:10,f:.02,a:.015,g:['Mızrakçı','Piyade'],z:['Süvari','Mancınık']},
 cav:{n:'Süvari',c:{w:60,f:45},t:14,f:.04,a:.03,g:['Okçu','Mancınık'],z:['Mızrakçı','Piyade']},
 cat:{n:'Mancınık',c:{w:80,s:60,f:40},t:20,f:.05,a:.04,g:['Mızrakçı','Okçu'],z:['Süvari','Piyade']}
};
const ORDER=['main','wood','stone','store','saw','mason','wall','tower','farm','well','inf','spear','arch','cav','cat'],SN=['Köy','Kasaba','Şehir','Krallık'];
const PERK={2:'İnşaat %10 daha hızlı',3:'Kasaba açıldı: Marangozhane ve Taşçı atölyesi',4:'Tüm üretim +%10',5:'Depo +%25, inşaat %20 daha hızlı',6:'Şehir açıldı: Surlar ve Gözcü kulesi',7:'Tüm üretim +%20 (toplam)',8:'Depo kapasitesi +%50',9:'İnşaat %30 daha hızlı',10:'Krallık ilan edildi, taç takıldı'};
const pm=L=>L.main>=7?1.2:L.main>=4?1.1:1;
const prod=L=>({w:pm(L)*L.wood*Math.pow(1.12,L.wood-1)*(1+.2*L.saw),s:pm(L)*.7*L.stone*Math.pow(1.12,L.stone-1)*(1+.2*L.mason),f:pm(L)*1.2*L.farm*Math.pow(1.12,Math.max(L.farm-1,0)),a:pm(L)*L.well*Math.pow(1.12,Math.max(L.well-1,0))});
const upk=()=>{let f=0,a=0;for(const k in U){const n=S.ar[k]||0;f+=n*U[k].f;a+=n*U[k].a}return{f,a}};
const utime=k=>U[k].t/(1+.12*Math.max(S.lv[k]-1,0));
const need=()=>{const p=prod(S.lv),u=upk();return{f:S.f<=.01&&p.f<u.f,a:S.a<=.01&&p.a<u.a}};
const cap=L=>Math.round(200*Math.pow(1.6,L.store-1)*(L.main>=8?1.5:L.main>=5?1.25:1)*(1+.2*L.wall));
const stg=L=>L.main>=10?4:L.main>=6?3:L.main>=3?2:1;
const cost=(k,l)=>({w:Math.round(D[k].c.w*Math.pow(1.5,l)),s:Math.round(D[k].c.s*Math.pow(1.5,l))});
const T=l=>Math.round(6*Math.pow(1.45,l)*(S.lv.main>=9?.7:S.lv.main>=5?.8:S.lv.main>=2?.9:1));
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(n).toLocaleString('tr');
const tm=s=>{s=Math.ceil(s);return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):s+' sn'};

function fresh(){return{t:Date.now(),w:30,s:0,f:40,a:40,lv:{main:1,wood:1,stone:1,store:1,saw:0,mason:0,wall:0,tower:0,farm:0,well:0,inf:0,spear:0,arch:0,cav:0,cat:0},up:{},q:[],ar:{},tr:{}}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.lv){j.lv={main:1,wood:1,stone:1,store:1,saw:0,mason:0,wall:0,tower:0,...j.lv};j.q=j.q||[];j.f=j.f??40;j.a=j.a??40;j.ar=j.ar||{};j.tr=j.tr||{};j.lv={farm:0,well:0,inf:0,spear:0,arch:0,cav:0,cat:0,...j.lv};return j}}catch(e){}
 return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),lastStage=stg(S.lv),tt,pend=[];

function advance(to){
 let g=0;
 while(S.t<to&&g++<300){
  let nk=null,nt=to;
  for(const k in S.up)if(S.up[k]<=nt){nt=S.up[k];nk=k}
  let tk=null;for(const k in S.tr)if(S.tr[k].e<=nt){nt=S.tr[k].e;tk=k;nk=null}
  nt=Math.max(nt,S.t);
  const dt=(nt-S.t)/1000,p=prod(S.lv),c=cap(S.lv),u=upk();
  S.w=Math.min(c,S.w+p.w*dt);S.s=Math.min(c,S.s+p.s*dt);
  S.f=Math.max(0,Math.min(c,S.f+(p.f-u.f)*dt));S.a=Math.max(0,Math.min(c,S.a+(p.a-u.a)*dt));S.t=nt;
  if(tk){const q=S.tr[tk];S.ar[tk]=(S.ar[tk]||0)+1;q.n--;if(q.n>0)q.e+=utime(tk)*1000;else delete S.tr[tk]}
  else if(nk){S.lv[nk]++;delete S.up[nk];if(nk==='main'&&PERK[S.lv.main])pend.push('Ana bina Sv '+S.lv.main+': '+PERK[S.lv.main])}
 }
}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),3200)}

// kartlar
$('list').innerHTML=ORDER.map(k=>`<article class="card" id="c-${k}"><div class="top"><h3>${D[k].n}</h3><span class="lv" id="lv-${k}"></span></div><p class="eff" id="ef-${k}"></p><div class="foot"><span class="cost" id="co-${k}"></span><button data-k="${k}" id="bt-${k}">Yükselt</button></div><div class="prog" id="pr-${k}"><i id="pg-${k}"></i></div></article>`).join('');
$('list').addEventListener('click',e=>{const b=e.target.closest('button');if(b)upgrade(b.dataset.k)});

function upgrade(k){
 const l=S.lv[k];if(S.up[k]||l>=MAXL)return;
 if(D[k].lock&&stg(S.lv)<D[k].lock)return;
 const c=cost(k,l);if(S.w<c.w||S.s<c.s)return;
 S.w-=c.w;S.s-=c.s;S.up[k]=Date.now()+T(l)*1000;save();render()
}
function effText(k,l){
 const L2={...S.lv,[k]:l+1},p=prod(S.lv),p2=prod(L2);
 if(k==='main')return 'Sv '+(l+1)+': '+PERK[l+1];
 if(k==='wood')return `Odun ${p.w.toFixed(1)} → ${p2.w.toFixed(1)} /sn`;
 if(k==='stone')return `Taş ${p.s.toFixed(1)} → ${p2.s.toFixed(1)} /sn`;
 if(k==='store')return `Kapasite ${fmt(cap(S.lv))} → ${fmt(cap(L2))}`;
 if(k==='saw')return `Odun üretimi +%${20*l} → +%${20*(l+1)}`;
 if(U[k])return l<1?'İnşa edince '+U[k].n+' eğitebilirsin':`Eğitim hızı %${100+12*(l-1)} → %${100+12*l}`;
 if(k==='farm')return `Yemek ${p.f.toFixed(1)} → ${p2.f.toFixed(1)} /sn`;
 if(k==='well')return `Su ${p.a.toFixed(1)} → ${p2.a.toFixed(1)} /sn`;
 if(k==='wall')return `Depo kapasitesi +%${20*l} → +%${20*(l+1)}`;
 if(k==='tower')return `Çevrimdışı birikim ${8+2*l} → ${10+2*l} saat`;
 return `Taş üretimi +%${20*l} → +%${20*(l+1)}`;
}
function render(){
 const L=S.lv,p=prod(L),c=cap(L),st=stg(L),now=Date.now();
 $('m4').classList.toggle('hide',L.main<4);$('m7').classList.toggle('hide',L.main<7);$('m10').classList.toggle('hide',L.main<10);renderQ();renderMil();
 $('rw').textContent=fmt(S.w);$('rs').textContent=fmt(S.s);
 $('rwc').textContent='/ '+fmt(c);$('rsc').textContent='/ '+fmt(c);
 $('rwr').textContent='+'+p.w.toFixed(1)+' /sn';$('rsr').textContent='+'+p.s.toFixed(1)+' /sn';
 $('stn').textContent=SN[st-1];
 const tg=st===1?3:st===2?6:st===3?10:L.main;
 $('stb').style.width=Math.min(100,L.main/tg*100)+'%';
 $('sth').textContent=st===1?'Ana bina Sv 3 olunca Kasaba':st===2?'Ana bina Sv 6 olunca Şehir':st===3?'Ana bina Sv 10 olunca Krallık':'Krallık ilan edildi';
 if(st>lastStage){pend.push('Yeni aşama: '+SN[st-1]);lastStage=st}
 if(pend.length){toast(pend.join('  •  '));pend=[]}
 for(const k of ORDER){
  const l=L[k],busy=!!S.up[k],locked=D[k].lock&&st<D[k].lock,b=$('bt-'+k),pr=$('pr-'+k);
  $('lv-'+k).textContent=l?'Sv '+l:'Yeni';
  $('ef-'+k).textContent=locked?SN[D[k].lock-1]+' aşamasında açılır':l>=MAXL?'En yüksek seviye':effText(k,l);
  const g=$('g-'+k);
  g.setAttribute('transform',`translate(${POS[k][0]} ${POS[k][1]}) scale(${(1+(U[k]||k==='farm'||k==='well'?.03:.06)*Math.min(l,MAXL)).toFixed(2)})`);
  g.setAttribute('class',locked?'hide':l===0&&!busy?'ghost':busy?'busy':'');
  pr.classList.toggle('off',!busy);
  if(busy){const rem=(S.up[k]-now)/1000;$('pg-'+k).style.width=Math.max(0,100-rem/T(l)*100)+'%';b.textContent=tm(rem);b.disabled=true;$('co-'+k).innerHTML='';continue}
  if(l>=MAXL||locked){$('co-'+k).innerHTML='';b.textContent=locked?'Kilitli':'Tamam';b.disabled=true;continue}
  const q=cost(k,l);
  $('co-'+k).innerHTML=`<span class="${S.w>=q.w?'':'lack'}"><i class="ic w"></i>${fmt(q.w)}</span>`+(q.s?`<span class="${S.s>=q.s?'':'lack'}"><i class="ic s"></i>${fmt(q.s)}</span>`:'');
  b.textContent=l?'Yükselt':'İnşa et';b.disabled=S.w<q.w||S.s<q.s;
 }
}

// görevler: [bina, seviye, odun, taş]
const Q=[['wood',3,60,0],['stone',3,0,50],['main',3,120,90],['store',4,100,80],['saw',3,150,60],['mason',3,60,150],['wood',6,200,0],['stone',6,0,200],['main',6,300,250],['farm',3,150,80],['well',3,80,150],['wall',3,200,150],['tower',3,200,200]];
let lastQ='';
function renderQ(){
 const L=S.lv,st=stg(L);
 const av=Q.map((q,i)=>({q,i})).filter(o=>!S.q.includes(o.i)&&(!D[o.q[0]].lock||st>=D[o.q[0]].lock));
 av.sort((a,b)=>(L[b.q[0]]>=b.q[1])-(L[a.q[0]]>=a.q[1]));
 const h=av.slice(0,3).map(({q,i})=>{const [k,n,w,s]=q,ok=L[k]>=n;return `<article class="card q"><p>${D[k].n} Sv ${n}<br><small>${Math.min(L[k],n)}/${n}  ${w?`<i class="ic w"></i>${w} `:''}${s?`<i class="ic s"></i>${s}`:''}</small></p><button data-q="${i}"${ok?'':' disabled'}>${ok?'Al':'Sürüyor'}</button></article>`}).join('')||'<article class="card"><small>Tüm görevler tamamlandı, yenileri yolda.</small></article>';
 if(h!==lastQ){$('quests').innerHTML=h;lastQ=h}
}
$('quests').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const i=+b.dataset.q,[k,n,w,s]=Q[i];if(S.lv[k]<n||S.q.includes(i))return;S.q.push(i);const c=cap(S.lv);S.w=Math.min(c,S.w+w);S.s=Math.min(c,S.s+s);toast('Görev ödülü alındı');save();render()});

// ordu
$('army').innerHTML=Object.keys(U).map(k=>`<article class="card hide" id="u-${k}"><div class="top"><h3>${U[k].n}</h3><span class="lv" id="un-${k}"></span></div><p class="eff">Güçlü: ${U[k].g.join(', ')}<br>Zayıf: ${U[k].z.join(', ')}<br>Tüketim: yemek ${U[k].f}/sn, su ${U[k].a}/sn</p><div class="foot"><span class="cost" id="uc-${k}"></span><span class="btns"><button class="sm" data-u="${k}" data-n="1">+1</button><button class="sm" data-u="${k}" data-n="5">+5</button></span></div><div class="prog off" id="up-${k}"><i id="ug-${k}"></i></div></article>`).join('');
$('army').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)train(b.dataset.u,+b.dataset.n)});
function train(k,n){
 const u=U[k],h=need();if(S.lv[k]<1||h.f||h.a)return;
 if((S.tr[k]?S.tr[k].n:0)+n>30)return toast('Eğitim sırası dolu');
 const c={w:(u.c.w||0)*n,s:(u.c.s||0)*n,f:(u.c.f||0)*n};
 if(S.w<c.w||S.s<c.s||S.f<c.f)return;
 S.w-=c.w;S.s-=c.s;S.f-=c.f;
 if(S.tr[k])S.tr[k].n+=n;else S.tr[k]={n,e:Date.now()+utime(k)*1000};
 save();render()
}
function renderMil(){
 const L=S.lv,st=stg(L),p=prod(L),u=upk(),c=cap(L),h=need(),now=Date.now();
 $('chf').classList.toggle('hide',st<2);$('cha').classList.toggle('hide',st<2);
 $('rf').textContent=fmt(S.f);$('ra').textContent=fmt(S.a);$('rfc').textContent='/ '+fmt(c);$('rac').textContent='/ '+fmt(c);
 const nf=p.f-u.f,na=p.a-u.a;
 $('rfr').textContent=(nf>=0?'+':'')+nf.toFixed(1)+' /sn';$('rar').textContent=(na>=0?'+':'')+na.toFixed(1)+' /sn';
 $('rfr').style.color=nf<0?'var(--lack)':'';$('rar').style.color=na<0?'var(--lack)':'';
 let tot=0,any=false;
 for(const k in U){
  const l=L[k],n=S.ar[k]||0,q=S.tr[k],cc=U[k].c;tot+=n;
  const row=$('u-'+k);row.classList.toggle('hide',l<1);if(l<1)continue;any=true;
  $('un-'+k).textContent=n+(q?' (+'+q.n+')':'');
  $('uc-'+k).innerHTML=['w','s','f'].filter(r=>cc[r]).map(r=>`<span class="${S[r]>=cc[r]?'':'lack'}"><i class="ic ${r}"></i>${cc[r]}</span>`).join('');
  row.querySelectorAll('button').forEach(b=>{const m=+b.dataset.n;b.disabled=h.f||h.a||S.w<(cc.w||0)*m||S.s<(cc.s||0)*m||S.f<(cc.f||0)*m});
  $('up-'+k).classList.toggle('off',!q);
  if(q)$('ug-'+k).style.width=Math.max(0,100-(q.e-now)/1000/utime(k)*100)+'%';
 }
 $('ast').textContent=!any?'Kasaba aşamasında bir kışla kur, sonra asker eğit.':h.f||h.a?(h.f?'Yiyecek bitti':'Su bitti')+', yeni asker eğitilemez. Çiftlik veya Kuyu yükselt.':`Toplam ${tot} asker. Tüketim: yemek ${u.f.toFixed(2)}/sn, su ${u.a.toFixed(2)}/sn`;
}

// açılış: çevrimdışı ilerleme
(function(){
 const w0=S.w,s0=S.s,now=Date.now(),gap=now-S.t;
 advance(Math.min(now,S.t+(8+2*S.lv.tower)*36e5));S.t=now;
 if(gap>60000){const dw=S.w-w0,ds=S.s-s0;if(dw>=1||ds>=1)setTimeout(()=>toast(`Sen yokken: +${fmt(dw)} odun, +${fmt(ds)} taş`),500)}
 lastStage=stg(S.lv);render();save();
})();
setInterval(()=>{advance(Date.now());render()},250);
setInterval(save,5000);
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{advance(Date.now());render()}});

let armed=false;
$('rst').addEventListener('click',e=>{
 if(!armed){armed=true;e.target.textContent='Emin misin? Tekrar dokun';setTimeout(()=>{armed=false;e.target.textContent='Baştan başla'},3000);return}
 try{localStorage.removeItem(KEY)}catch(x){}
 S=fresh();lastStage=1;armed=false;e.target.textContent='Baştan başla';render();save()
});
</script>
</body>
</html>
