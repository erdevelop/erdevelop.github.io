<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proje Hattı</title>
<script>/* açılışta tema yanıp sönmesin */try{var t=localStorage.getItem('projeHatti.tema')||'sistem';document.documentElement.dataset.theme=(t==='koyu'||(t==='sistem'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=28">
</head>
<body>
<header class="top">
  <div class="brand">Proje Hattı</div>

  <div class="proj">
    <select id="projSel" title="Proje seç"></select>
    <button id="btnNewProj" class="btn" title="Yeni proje">+ Proje</button>
    <button id="btnProjSet" class="btn ghost" title="Proje ayarları">Ayarlar</button>
  </div>

  <nav class="views" id="views">
    <span class="vgrup" title="Yapı">
      <button data-v="hat" class="on" title="Hat: aşamalar soldan sağa">Hat</button>
      <button data-v="agac" title="Girintili ağaç">Ağaç</button>
      <button data-v="zihin" title="Zihin haritası">Zihin</button>
      <button data-v="kure" title="3B küre">Küre</button>
      <button data-v="gunes" title="Güneş patlaması: iç içe halkalar">Güneş</button>
      <button data-v="ag" title="Bağımlılık ağı ve kritik yol">Ağ</button>
    </span>
    <span class="vgrup" title="İş">
      <button data-v="pano" title="Pano (Kanban): durum sütunları">Pano</button>
      <button data-v="odak" title="Şimdi yapılabilecekler ve takılanlar">Sıradaki</button>
      <button data-v="liste" title="Etiketlere göre liste">Liste</button>
      <button data-v="matris" title="Grup × aşama tablosu">Matris</button>
    </span>
    <span class="vgrup" title="Zaman">
      <button data-v="gantt" title="Gantt şeması">Gantt</button>
      <button data-v="takvim" title="Aylık takvim">Takvim</button>
    </span>
    <span class="vgrup" title="Durum">
      <button data-v="gosterge" title="Gösterge paneli">Gösterge</button>
      <button data-v="kisiler" title="Kimden ne bekleniyor">Kişiler</button>
      <button data-v="rapor">Bekleyenler</button>
    </span>
  </nav>

  <div class="io">
    <span class="gecmis"><button id="btnGeri" class="btn ghost" title="Geri al (Ctrl+Z)" disabled>↶</button><button id="btnIleri" class="btn ghost" title="Yinele (Ctrl+Y)" disabled>↷</button></span>
    <button id="btnTema" class="btn ghost tema-btn" title="Tema">◐ Sistem</button>
    <button id="btnRapor" class="btn ghost ikon" title="Rapor / PDF">⎙</button>
    <button id="btnExport" class="btn ghost ikon" title="Dışa aktar: tüm veriyi JSON olarak indir">⤓</button>
    <label class="btn ghost ikon" title="İçe aktar: JSON dosyasından yükle">⤒<input type="file" id="fileImport" accept=".json,application/json" hidden></label>
  </div>
</header>

<main class="layout" id="layout">
  <div class="sidewrap" id="sideWrap">
    <button class="side-toggle" id="btnSide" title="Paneli aç / kapat">‹</button>
    <aside class="side" id="side"></aside>
  </div>
  <section class="stage" id="stage">
    <div class="toolbar" id="toolbar"></div>
    <div class="viewport" id="viewport"></div>
  </section>
</main>

<section class="konsol" id="konsol">
  <div class="konsol-tut" id="konsolTut" title="Sürükleyerek boyutlandır"></div>
  <div class="konsol-bas"><b>Komut satırı</b><span class="small">işlem kaydı · <a data-kkomut="?">? yardım</a></span><span class="grow"></span>
    <button id="btnKonsolTemizle" class="btn sm ghost" title="Bu projenin kaydını temizle">Temizle</button><button id="btnKonsol" class="btn sm ghost" title="Kaydı gizle">▾</button></div>
  <div class="konsol-log" id="konsolLog"></div>
  <div class="konsol-gir"><span class="istem">›</span><input id="quickIn" autocomplete="off" spellcheck="false" placeholder="Komut ya da hızlı not…   ör.  git cam  ·  dikey  ·  daralt hepsi  ·  #cam-B @mimar emaye rengi  ·  ? yardım"></div>
</section>

<div class="modal-bg" id="modalBg" hidden><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="app.js?v=28"></script>
<script src="kure.js?v=28"></script>
<script src="gorunumler.js?v=28"></script>
<script src="rapor.js?v=28"></script>
<script src="bulut.js?v=28"></script>
</body>
</html>
