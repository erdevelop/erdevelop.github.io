<style>
:root{--ink:#E4F3F2;--mute:#9CC0BE;--acc:#5FD3B8;--line:rgba(150,220,215,.18);--kart:rgba(10,32,38,.86)}
*{box-sizing:border-box}html,body{margin:0;background:#06171D;color:var(--ink);font:600 15px/1.5 Nunito,ui-rounded,system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(1200px 700px at 50% -10%,#0F3A44,#06171D 70%)}
a{color:var(--acc)}
.ust{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto;padding:14px 16px}.ust a{text-decoration:none;color:var(--ink);font-weight:900}.ust .sp{flex:1}.ust .k{font-size:13px;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:0 16px 40px}
.kart{background:var(--kart);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}
.bas{display:flex;gap:18px;align-items:center}.bas canvas{flex:none;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 50% 45%,#15505C,#072029 72%);border:2px solid rgba(95,211,184,.45)}
.bas h1{margin:0;font-size:30px;line-height:1.1;font-weight:900}.bas .tur{color:var(--acc);font-weight:800;margin-top:4px}.bas .aile{margin-top:6px;font-size:13.5px;color:#9CF5B8}.bas .tar{margin-top:4px;font-size:12px;color:var(--mute)}
.ist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.ist div{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.ist b{display:block;font-size:22px;font-weight:900}.ist small{color:var(--mute);font-size:12px}
h2{font-size:16px;margin:0 0 8px}
.bs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.bs div{display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:12px;border:1px solid var(--line);font-size:12.5px;opacity:.38}.bs div.ok{opacity:1;border-color:rgba(255,226,154,.55);background:rgba(255,226,154,.08)}.bs i{font-style:normal;font-size:18px}
.yol{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.yol a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);text-decoration:none;color:var(--ink);text-align:center;font-size:12px}.yol i{font-style:normal;font-size:22px}.yol small{font-size:10.5px;color:var(--mute)}.yol a.d2{border-color:rgba(95,211,184,.6);background:rgba(95,211,184,.1)}.yol a.d0{opacity:.45}@media (max-width:520px){.yol{grid-template-columns:repeat(3,1fr)}}
.rz{display:flex;flex-wrap:wrap;gap:6px}.rz span{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.dugmeler{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.dugmeler a,.dugmeler button{font:inherit;font-weight:900;font-size:14.5px;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);text-decoration:none;cursor:pointer}.dugmeler .ana{background:var(--acc);border-color:var(--acc);color:#04201A}
.bos{text-align:center;padding:40px 10px}.bos h1{font-size:26px}
.not{font-size:12px;color:var(--mute);margin-top:16px;text-align:center}
@media (max-width:520px){.bas{flex-direction:column;text-align:center}.ist{grid-template-columns:repeat(2,1fr)}}
</style>
<script>(function(){var k=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';try{var m=localStorage.getItem('erdevelop-mode'),g=localStorage.getItem('erdevelop-mode-gun');if(m&&g===new Date().toDateString())k=m}catch(e){}document.documentElement.setAttribute('data-mode',k)})()</script>

<body>
<div class="ust"><a href="/">erdevelop</a><span style="color:var(--mute)">/ <a href="/organizma.html" style="color:var(--mute);font-weight:700">organizma</a> / profil</span><span class="sp"></span><a class="k" href="/organizma.html" id="oynaUst">🦠 Oyna</a></div>
<main id="ana"></main>
<script>
(() => {
  const BAS = [["dev", "🏆", "Bir dev canlıyı yen", "Defeat a giant creature"], ["altin", "✨", "Altın bir canlı ye", "Eat a golden creature"], ["ilk", "🍽", "İlk av", "First prey"], ["yas5", "⏱", "5 dakika yaşa", "Survive 5 minutes"], ["yas10", "⏳", "10 dakika yaşa", "Survive 10 minutes"], ["yas20", "🕰", "20 dakika yaşa", "Survive 20 minutes"], ["kutle500", "⚖", "500 kütle", "500 mass"], ["kutle1500", "🏋", "1500 kütle", "1500 mass"], ["avci100", "🦈", "Toplam 100 av", "100 prey in total"], ["intikam", "☠", "İntikam al", "Take revenge"], ["kacis", "🦐", "Su piresinden kurtul", "Escape the water flea"], ["cevrimici", "🌐", "Çevrimiçi bir oyuncuyu yut", "Swallow an online player"], ["gece", "🌙", "Bir geceyi atlat", "Survive a night"], ["silkele", "🦠", "Virüsü silkele", "Shake off a virus"], ["gorev10", "✅", "10 görev tamamla", "Complete 10 quests"], ["gen15", "🧪", "15 farklı gen topla", "Collect 15 different genes"], ["gen30", "🔬", "30 farklı gen topla", "Collect 30 different genes"], ["kusak2", "🧬", "İlk çoğalma", "First reproduction"], ["kusak5", "👑", "5. kuşağa ulaş", "Reach generation 5"], ["sersem3", "💫", "Tek hamlede 3 yırtıcı sersemlet", "Stun 3 predators with one dash"]], TUR = [["Kamçılı", "Flagellate"], ["Silli", "Ciliate"], ["Amip", "Amoeba"], ["Işınlı", "Radiolarian"], ["Terliksi", "Paramecium"], ["Silikokamçılı", "Silicoflagellate"], ["Öglena", "Euglena"], ["Stentor", "Stentor"], ["Ceratium", "Ceratium"], ["Kabuklu amip", "Testate amoeba"], ["Güneş hayvancığı", "Sun animalcule"], ["Dileptus", "Dileptus"]], SLUG = ["oglena", "terliksi-hayvan", "amip", "isinli", "terliksi-hayvan", "silikokamcili", "oglena", "stentor", "ceratium", "kabuklu-amip", "gunes-hayvancigi", "dileptus"], SERI = [['🦠', 'Organizma', 'Organism', '/organizma.html'], ['🐟', 'Yaratık', 'Creature', '/yaratik.html'], ['🦎', 'Yuva', 'Nest', '/yuva.html'], ['🔥', 'Kabile', 'Tribe', '/kabile.html'], ['🏛', 'Şehir', 'City', '/sehir.html'], ['👑', 'Küçük Krallık', 'Little Kingdom', '/GameKingdom10.html']];
  const LP = new URLSearchParams(location.search).get('lang'), EN = LP ? /^en/i.test(LP) : /^en/i.test(navigator.language || '');
  const T = (a, b) => EN ? b : a, esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dk = s => { s = +s || 0; return s < 60 ? Math.round(s) + T(' sn', ' s') : (Math.round(s / 6) / 10).toString().replace('.', EN ? '.' : ',') + T(' dk', ' min'); };
  const ROMA = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
  let P = null;
  try { const h = location.hash.slice(1); if (h.startsWith('p1.')) { const b = atob(h.slice(3).replace(/-/g, '+').replace(/_/g, '/')); P = JSON.parse(new TextDecoder().decode(Uint8Array.from(b, c => c.charCodeAt(0)))); } } catch (e) { P = null; }
  const ana = document.getElementById('ana');
  if (!P || !P.n) { ana.innerHTML = `<div class="kart bos"><h1>🦠 ${T('Organizma oyuncu profili', 'Organizma player profile')}</h1><p>${T('Bu bağlantıda profil bilgisi yok. Kendi profilini oluşturmak için oyunu aç, menüdeki <b>🪪 Profilim</b> düğmesine dokun.', 'This link has no profile data. Open the game and tap <b>🪪 My profile</b> in the menu to create yours.')}</p><div class="dugmeler" style="justify-content:center"><a class="ana" href="/organizma.html">🦠 ${T('Organizma\'yı oyna', 'Play Organizma')}</a></div></div>`; return; }
  document.title = `${P.n} – ${T('Organizma profili', 'Organizma profile')} | erdevelop`;
  const tur = TUR[P.t | 0] || TUR[0], ok = new Set(String(P.bs || '').split(',').filter(Boolean));
  const tarih = P.d ? `${String(P.d).slice(6, 8)}.${String(P.d).slice(4, 6)}.${String(P.d).slice(0, 4)}` : '';
  ana.innerHTML = `<div class="kart"><div class="bas"><canvas id="av" width="264" height="264"></canvas><div><h1>${esc(String(P.n).slice(0, 16))}</h1><div class="tur">${esc(T(tur[0], tur[1]))}${P.k > 1 ? ' · ' + T(`en yüksek ${ROMA[P.k] || P.k}. kuşak`, `up to generation ${ROMA[P.k] || P.k}`) : ''}</div>${P.a ? `<div class="aile">🌳 ${esc(String(P.a).slice(0, 16))} ${T('ailesi', 'family')}</div>` : ''}<div class="tar">${T('Profil tarihi', 'Profile date')}: ${tarih} · ${P.o | 0} ${T('oyun', 'games')}</div></div></div>`
    + `<div class="ist"><div><b>${dk(P.u)}</b><small>${T('en uzun yaşam', 'longest life')}</small></div><div><b>${P.b | 0}</b><small>${T('en büyük kütle', 'largest mass')}</small></div><div><b>${P.y | 0}</b><small>${T('toplam av', 'total prey')}</small></div><div><b>${P.dr | 0} m</b><small>${T('en derin', 'deepest')}</small></div><div><b>${P.z | 0}</b><small>${T('soy puanı', 'lineage points')}</small></div><div><b>${ok.size}/${BAS.length}</b><small>${T('başarım', 'achievements')}</small></div></div>`
    + `<div class="dugmeler"><a class="ana" href="/organizma.html?yanina=${encodeURIComponent(String(P.n).slice(0, 16))}">🦠 ${T(`${esc(String(P.n).slice(0, 16))} ile oyna`, `Play with ${esc(String(P.n).slice(0, 16))}`)}</a><button type="button" id="pay">📤 ${T('Profili paylaş', 'Share profile')}</button><a href="/mikro-dunya/${SLUG[P.t | 0] || 'amip'}/">📖 ${esc(T(tur[0], tur[1]))} ${T('nedir?', '— what is it?')}</a></div></div>`
    + (P.sr ? `<div class="kart"><h2>🧬 ${T('Tek hücreden krallığa yolculuk', 'Journey from a single cell to a kingdom')}</h2><div class="yol">${SERI.map((q, i) => { const d = +String(P.sr)[i] || 0; return `<a href="${q[3]}" class="d${d}"><i>${q[0]}</i><b>${esc(T(q[1], q[2]))}</b><small>${d === 2 ? '✅ ' + T('tamamlandı', 'complete') : d === 1 ? '▶ ' + T('oynuyor', 'playing') : '🔒'}</small></a>`; }).join('')}</div><p style="margin:8px 0 0;font-size:12.5px;color:var(--mute)">${String(P.sr).split('').filter(x => x === '2').length}/6 ${T('aşama tamamlandı', 'stages complete')} · <a href="/seri.html">${T('Serinin hepsi', 'The whole series')} ›</a></p></div>` : '')
    + (P.sz && P.sz.length ? `<div class="kart"><h2>🏆 ${T('Sezon rozetleri', 'Season badges')}</h2><div class="rz">${P.sz.map(r => `<span>${r[2] ? '🏆 ' : ''}${r[1] || ''} ${T('Sezon', 'Season')} ${r[0]}</span>`).join('')}</div></div>` : '')
    + `<div class="kart"><h2>🎖 ${T('Başarımlar', 'Achievements')}</h2><div class="bs">${BAS.map(b => `<div class="${ok.has(b[0]) ? 'ok' : ''}"><i>${b[1]}</i><span>${esc(T(b[2], b[3]))}</span></div>`).join('')}</div></div>`
    + `<p class="not">${T('Bu profil bağlantının içinde saklanır; sunucuda kişisel veri tutulmaz. Kendi profilini oyundaki menüden oluşturabilirsin.', 'This profile is stored inside the link itself; no personal data is kept on a server. Create your own from the game menu.')}</p>`;
  document.getElementById('oynaUst').textContent = '🦠 ' + T('Oyna', 'Play');
  // basit avatar: türe göre kamçı, kirpik, yalancı ayak ya da diken
  const c = document.getElementById('av'), x = c.getContext('2d'), h = +P.h || 172, t0 = performance.now(), ti = P.t | 0;
  const kamci = [0, 5, 6, 8].includes(ti), sil = [1, 4, 7, 11].includes(ti), amip = [2, 9].includes(ti), diken = [3, 10].includes(ti);
  function ciz(now) {
    const t = (now - t0) / 1000; x.clearRect(0, 0, 264, 264); x.save(); x.translate(132, 132); x.rotate(-0.5);
    const R2 = 70, uz = sil ? 1.35 : kamci ? 1.2 : 1;
    if (diken) { x.strokeStyle = `hsla(${h},70%,80%,.8)`; x.lineWidth = 2; for (let i = 0; i < 28; i++) { const a = i / 28 * 6.283; x.beginPath(); x.moveTo(Math.cos(a) * R2, Math.sin(a) * R2); x.lineTo(Math.cos(a) * (R2 + 34 + 4 * Math.sin(t * 2 + i)), Math.sin(a) * (R2 + 34 + 4 * Math.sin(t * 2 + i))); x.stroke(); } }
    if (kamci) { x.strokeStyle = `hsla(${h},70%,82%,.85)`; x.lineWidth = 3; x.beginPath(); for (let k = 0; k <= 30; k++) { const u = k / 30, px = R2 * uz + u * 90, py = Math.sin(u * 9 - t * 8) * 10 * u; k ? x.lineTo(px, py) : x.moveTo(px, py); } x.stroke(); }
    x.beginPath(); for (let k = 0; k <= 48; k++) { const a = k / 48 * 6.283, w = amip ? 1 + 0.12 * Math.sin(a * 3 + t * 1.5) + 0.07 * Math.sin(a * 5 - t) : 1; const px = Math.cos(a) * R2 * uz * w, py = Math.sin(a) * R2 / (sil ? 1.15 : 1) * w; k ? x.lineTo(px, py) : x.moveTo(px, py); } x.closePath();
    x.fillStyle = `hsla(${h},55%,48%,.75)`; x.fill(); x.lineWidth = 5; x.strokeStyle = `hsla(${h},70%,80%,.9)`; x.stroke();
    if (sil) { x.strokeStyle = `hsla(${h},70%,85%,.7)`; x.lineWidth = 1.6; for (let k = 0; k < 60; k++) { const a = k / 60 * 6.283, px = Math.cos(a) * R2 * uz, py = Math.sin(a) * R2 / 1.15, q = a + 0.4 * Math.sin(t * 6 + k * 0.5); x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(q) * 10, py + Math.sin(q) * 10); x.stroke(); } }
    x.fillStyle = `hsla(${h},60%,30%,.85)`; x.beginPath(); x.arc(-8, 4, 22, 0, 6.283); x.fill(); x.fillStyle = `hsla(${h},50%,20%,.9)`; x.beginPath(); x.arc(-8, 4, 9, 0, 6.283); x.fill();
    for (let k = 0; k < 7; k++) { const a = k * 2.4 + t * 0.2, d = 30 + (k % 3) * 9; x.fillStyle = `hsla(${(h + k * 40) % 360},75%,65%,.7)`; x.beginPath(); x.arc(Math.cos(a) * d, Math.sin(a) * d * 0.8, 4.5, 0, 6.283); x.fill(); }
    x.restore(); requestAnimationFrame(ciz);
  }
  requestAnimationFrame(ciz);
  document.getElementById('pay').onclick = async () => {
    const u = location.href, m = T(`${P.n} adlı oyuncunun Organizma profili: en uzun yaşam ${dk(P.u)}, en büyük kütle ${P.b | 0}. Sen ne kadar yaşarsın?`, `${P.n}'s Organizma profile: longest life ${dk(P.u)}, largest mass ${P.b | 0}. How long can you last?`);
    try { if (navigator.share) { await navigator.share({ title: 'Organizma', text: m, url: u }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(m + ' ' + u); document.getElementById('pay').textContent = '✅ ' + T('Kopyalandı', 'Copied'); } catch (e) { prompt(T('Kopyala:', 'Copy:'), u); }
  };
})();
</script>
