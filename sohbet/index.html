<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>Sohbet Odası</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1d2321; --mute:#6b7470; --line:#e1e4df;
  --acc:#2f7d6b; --acc-ink:#ffffff; --mine:#e3f1ec; --sys:#8a928e; --err:#b8452f;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141816; --panel:#1c2120; --ink:#e6ebe8; --mute:#8f9994; --line:#2b3230;
    --acc:#5cb89f; --acc-ink:#0f1513; --mine:#1f3530; --sys:#7c8681; --err:#e0795f;
    --shadow:0 1px 2px rgba(0,0,0,.3); }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;
  display:flex;flex-direction:column;height:100dvh}
button,input{font:inherit;color:inherit}
.brand{font-family:"Chakra Petch",sans-serif;font-weight:700;letter-spacing:.02em}

/* ---- giriş ---- */
#giris{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
.kart{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:28px 24px;width:100%;max-width:380px}
.kart h1{margin:0 0 4px;font-size:26px}
.kart p{margin:0 0 20px;color:var(--mute)}
.kart label{display:block;font-size:13px;color:var(--mute);margin-bottom:6px}
.satir{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;outline:none}
input[type=text]:focus{border-color:var(--acc)}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:10px;padding:0 16px;
  font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:default}
.hata{color:var(--err);font-size:13px;min-height:20px;margin-top:8px}
.durum{font-size:12px;color:var(--mute);margin-top:14px;display:flex;align-items:center;gap:6px}
.nokta{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.nokta.ok{background:#3aa57a}

/* ---- sohbet ---- */
#oda{flex:1;display:none;min-height:0}
#oda.acik{display:flex}
.ana{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header .brand{font-size:18px}
header .kim{margin-left:auto;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.kucuk{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
#kisiBtn{display:none}
#mesajlar{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.m{max-width:min(78%,640px);align-self:flex-start;padding:7px 11px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);margin-top:6px;overflow-wrap:anywhere;white-space:pre-wrap}
.m.devam{margin-top:0;border-top-left-radius:4px}
.m.ben{align-self:flex-end;background:var(--mine);border-color:transparent}
.m.ben.devam{border-top-left-radius:12px;border-top-right-radius:4px}
.m .ad{font-weight:600;font-size:13px;display:block;margin-bottom:1px}
.m .saat{font:11px "IBM Plex Mono",monospace;color:var(--mute);margin-left:8px;float:right;margin-top:5px}
.s{align-self:center;color:var(--sys);font-size:12px;margin:8px 0 2px;text-align:center}
.gun{align-self:center;font:11px "IBM Plex Mono",monospace;color:var(--mute);background:var(--line);
  border-radius:20px;padding:2px 10px;margin:12px 0 4px}
#yaziyor{font-size:12px;color:var(--mute);padding:0 16px;height:18px}
form#yaz{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
form#yaz .btn{padding:0 18px}
aside{width:210px;border-left:1px solid var(--line);background:var(--panel);padding:14px 16px;overflow-y:auto;flex:none}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 10px;font-weight:600}
aside ul{list-style:none;margin:0;padding:0}
aside li{display:flex;align-items:center;gap:8px;padding:4px 0;overflow-wrap:anywhere}
.yeni{position:absolute;right:24px;bottom:84px;display:none;background:var(--acc);color:var(--acc-ink);border:0;
  border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;box-shadow:var(--shadow)}
.m img.foto{display:block;max-width:100%;max-height:320px;border-radius:8px;margin:4px 0 2px;cursor:zoom-in;background:var(--line)}
.m .dosya{display:flex;align-items:center;gap:8px;padding:7px 10px;margin:4px 0 2px;border-radius:8px;background:var(--bg);
  color:var(--ink);text-decoration:none;border:1px solid var(--line);white-space:normal}
.m .dosya small{color:var(--mute);white-space:nowrap}
#ekBtn{padding:0 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-size:18px}
#buyuk{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;cursor:zoom-out}
#buyuk.acik{display:flex}
#buyuk img{max-width:100%;max-height:100%;border-radius:6px}
#oda.surukle .ana{outline:3px dashed var(--acc);outline-offset:-8px}
@media (max-width:700px){
  aside{position:fixed;right:0;top:0;bottom:0;transform:translateX(100%);transition:transform .2s;z-index:5;box-shadow:var(--shadow)}
  aside.acik{transform:none}
  #kisiBtn{display:inline-block}
  .m{max-width:88%}
  header .benim{display:none}
}
</style>
</head>
<body>

<section id="giris">
  <div class="kart">
    <h1 class="brand">Sohbet Odası</h1>
    <p>Bir takma ad seç. Odadaki herkes yazdıklarını, fotoğraf ve dosyalarını anında görür. Sohbet her saat başı temizlenir.</p>
    <form id="girisForm" autocomplete="off">
      <label for="nick">Takma ad</label>
      <div class="satir">
        <input type="text" id="nick" maxlength="16" placeholder="örn. erdal" autofocus>
        <button class="btn" id="girBtn" disabled>Gir</button>
      </div>
      <div class="hata" id="girisHata"></div>
    </form>
    <div class="durum"><span class="nokta" id="baglNokta"></span><span id="baglYazi">Bağlanıyor…</span></div>
  </div>
</section>

<section id="oda">
  <div class="ana" style="position:relative">
    <header>
      <span class="brand">Sohbet Odası</span>
      <span class="kim">
        <span class="nokta ok" id="odaNokta"></span>
        <span class="benim" id="benimAd"></span>
        <span id="sayac" title="Sohbet her saat başı temizlenir"></span>
        <button class="kucuk" id="kisiBtn">👥 <span id="sayi2">0</span></button>
        <button class="kucuk" id="cikBtn">Çık</button>
      </span>
    </header>
    <div id="mesajlar" aria-live="polite"></div>
    <button class="yeni" id="yeniBtn">↓ Yeni mesajlar</button>
    <div id="yaziyor"></div>
    <form id="yaz" autocomplete="off">
      <button type="button" class="btn" id="ekBtn" title="Fotoğraf veya dosya gönder (dosyalar en fazla 1 MB)">📎</button>
      <input type="file" id="dosyaIn" multiple hidden>
      <input type="text" id="metin" maxlength="500" placeholder="Mesaj yaz…" enterkeyhint="send">
      <button class="btn" id="gonderBtn">Gönder</button>
    </form>
  </div>
  <aside id="kisiler">
    <h2>Şu an burada · <span id="sayi">0</span></h2>
    <ul id="liste"></ul>
  </aside>
</section>

<div id="buyuk"><img id="buyukImg" alt="fotoğraf"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function(){
'use strict';
const CONFIG = {
  apiKey: "AIzaSyCQly5YyU9TNMfvZNBVA1UPZuglO8Rzogo",
  authDomain: "mesaj1-fc2c5.firebaseapp.com",
  databaseURL: "https://mesaj1-fc2c5-default-rtdb.firebaseio.com",
  projectId: "mesaj1-fc2c5",
  appId: "1:835014166916:web:f47e7f8ec1641bc44c75d1"
};
const KOK = 'sohbet';          // veritabanındaki klasör
const GECMIS = 150;            // gösterilecek son mesaj sayısı

const $ = id => document.getElementById(id);
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const CID = Math.random().toString(36).slice(2) + Date.now().toString(36);

if (!window.firebase){ $('baglYazi').textContent = 'Firebase yüklenemedi. İnternet bağlantını kontrol et.'; return; }
firebase.initializeApp(CONFIG);
const db = firebase.database();
const TS = firebase.database.ServerValue.TIMESTAMP;
const R = p => db.ref(KOK + '/' + p);

let ben = null, anahtar = null, bagli = false, kapat = [];
let saatFarki = 0;
db.ref('.info/serverTimeOffset').on('value', s => saatFarki = s.val() || 0);
const simdi = () => Date.now() + saatFarki;

/* ---------- yardımcılar ---------- */
function nickAnahtar(n){ return n.toLocaleLowerCase('tr-TR').replace(/[.#$\[\]\/\s]/g,'_'); }
function nickGecerli(n){
  if (n.length < 2) return 'En az 2 karakter olmalı.';
  if (n.length > 16) return 'En fazla 16 karakter olabilir.';
  if (!/^[\p{L}\p{N}_\-. ]+$/u.test(n)) return 'Sadece harf, rakam, boşluk ve _ - . kullanılabilir.';
  return '';
}
function renk(n){
  let h = 0; for (const c of n.toLocaleLowerCase('tr-TR')) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const koyu = matchMedia('(prefers-color-scheme: dark)').matches;
  return `hsl(${h % 360} ${koyu?55:50}% ${koyu?68:36}%)`;
}
function saat(t){ return new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); }
function gunAdi(t){
  const d = new Date(t), b = new Date(); const fark = Math.round((new Date(b.toDateString()) - new Date(d.toDateString()))/864e5);
  if (fark === 0) return 'Bugün'; if (fark === 1) return 'Dün';
  return d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
}
function izinHatasi(e){
  return e && /permission/i.test(e.code || e.message || '')
    ? 'Veritabanı izin vermiyor. Firebase kurallarının güncellenmesi gerekiyor.'
    : 'Bağlantı hatası: ' + (e && (e.message || e.code) || e);
}

/* ---------- bağlantı durumu ---------- */
db.ref('.info/connected').on('value', s => {
  bagli = s.val() === true;
  $('baglNokta').classList.toggle('ok', bagli);
  $('odaNokta').classList.toggle('ok', bagli);
  $('baglYazi').textContent = bagli ? 'Bağlandı' : 'Bağlanıyor…';
  girKontrol();
  if (bagli && ben) yenidenKatil();
});

/* ---------- giriş ---------- */
const nickIn = $('nick');
nickIn.value = ls.get('sohbet_nick') || '';
function girKontrol(){ $('girBtn').disabled = !bagli || nickIn.value.trim().length < 2; }
nickIn.addEventListener('input', () => { $('girisHata').textContent = ''; girKontrol(); });
girKontrol();

$('girisForm').addEventListener('submit', async e => {
  e.preventDefault();
  const n = nickIn.value.trim().replace(/\s+/g,' ');
  const h = nickGecerli(n); if (h){ $('girisHata').textContent = h; return; }
  $('girBtn').disabled = true; $('girisHata').textContent = '';
  try{
    const ok = await nickAl(n);
    if (!ok){ $('girisHata').textContent = '“' + n + '” şu an odada biri tarafından kullanılıyor. Başka bir ad dene.'; girKontrol(); return; }
    ben = n; ls.set('sohbet_nick', n);
    odayaGir();
  }catch(err){ $('girisHata').textContent = izinHatasi(err); girKontrol(); }
});

async function nickAl(n){
  const k = nickAnahtar(n);
  const ref = R('aktif/' + k);
  const sonuc = await ref.transaction(cur => {
    if (cur && cur.cid !== CID) return;           // başkası kullanıyor → iptal
    return { nick: n, cid: CID, ts: TS };
  }, null, false);
  if (!sonuc.committed) return false;
  await ref.onDisconnect().remove();
  anahtar = k;
  return true;
}

function sistemMesaji(metin){ return R('mesajlar').push({ tip:'s', text: metin, ts: TS }); }

async function odayaGir(){
  $('giris').style.display = 'none';
  $('oda').classList.add('acik');
  $('benimAd').textContent = ben;
  dinle();
  try{
    await sistemMesaji(ben + ' odaya katıldı');
    ayrilmaHazirla();
  }catch(e){ yerelSistem(izinHatasi(e)); }
  setTimeout(() => $('metin').focus(), 50);
}

function ayrilmaHazirla(){
  const r = R('mesajlar').push();            // anahtar şimdiden alınır, bağlantı koparsa yazılır
  r.onDisconnect().set({ tip:'s', text: ben + ' odadan ayrıldı', ts: TS });
  ayrilmaRef = r;
}
let ayrilmaRef = null;

let ilkBaglanti = true;
async function yenidenKatil(){
  if (ilkBaglanti){ ilkBaglanti = false; return; }
  // bağlantı koptuysa onDisconnect çalıştı; adı tekrar al
  try{
    const ok = await nickAl(ben);
    if (!ok){ yerelSistem('Bağlantı koptuğu sırada “' + ben + '” adını başkası aldı. Lütfen yeniden gir.'); setTimeout(cik, 2500); return; }
    ayrilmaHazirla();
  }catch(e){ yerelSistem(izinHatasi(e)); }
}

async function cik(){
  kapat.forEach(f => f()); kapat = [];
  try{
    if (ayrilmaRef){ await ayrilmaRef.onDisconnect().cancel(); await ayrilmaRef.set({ tip:'s', text: ben + ' odadan ayrıldı', ts: TS }); }
    if (anahtar){ const a = R('aktif/' + anahtar); await a.onDisconnect().cancel(); await a.remove(); }
    yaziyorBitir();
  }catch(e){}
  ben = null; anahtar = null; ayrilmaRef = null; ilkBaglanti = true;
  $('mesajlar').innerHTML = ''; sonYazan = null; sonGun = null;
  $('oda').classList.remove('acik'); $('giris').style.display = '';
  girKontrol(); nickIn.focus();
}
$('cikBtn').addEventListener('click', cik);

/* ---------- mesajlar ---------- */
const kutu = $('mesajlar');
let sonYazan = null, sonGun = null, okunmamis = 0;
const baslik = document.title;

function altta(){ return kutu.scrollHeight - kutu.scrollTop - kutu.clientHeight < 80; }
function asagi(){ kutu.scrollTop = kutu.scrollHeight; $('yeniBtn').style.display = 'none'; }
kutu.addEventListener('scroll', () => { if (altta()) $('yeniBtn').style.display = 'none'; });
$('yeniBtn').addEventListener('click', asagi);

function gunEkle(t){
  const g = new Date(t).toDateString();
  if (g !== sonGun){ sonGun = g; sonYazan = null;
    const d = document.createElement('div'); d.className = 'gun'; d.textContent = gunAdi(t); kutu.appendChild(d); }
}
function yerelSistem(metin){
  const d = document.createElement('div'); d.className = 's'; d.textContent = metin;
  const asg = altta(); kutu.appendChild(d); if (asg) asagi();
}
function mesajEkle(m){
  if (!m || typeof m.text !== 'string') return;
  const t = typeof m.ts === 'number' ? m.ts : simdi();
  const asg = altta();
  gunEkle(t);
  if (m.tip === 's'){
    const d = document.createElement('div'); d.className = 's';
    d.textContent = m.text + ' · ' + saat(t); kutu.appendChild(d); sonYazan = null;
  } else {
    if (!m.text && !m.img && !m.dosya) return;
    const benimMi = m.cid === CID;
    const devam = sonYazan === m.nick && !benimMi === !sonYazanBen;
    const d = document.createElement('div');
    d.className = 'm' + (benimMi ? ' ben' : '') + (devam ? ' devam' : '');
    if (!devam && !benimMi){
      const a = document.createElement('span'); a.className = 'ad'; a.textContent = m.nick; a.style.color = renk(m.nick); d.appendChild(a);
    }
    if (typeof m.img === 'string' && m.img.startsWith('data:image/')){
      const im = document.createElement('img'); im.className = 'foto'; im.alt = 'fotoğraf'; im.src = m.img;
      im.addEventListener('load', () => { if (asg || benimMi) asagi(); });
      im.addEventListener('click', () => buyut(m.img));
      d.appendChild(im);
    }
    if (m.dosya && typeof m.dosya.veri === 'string' && m.dosya.veri.startsWith('data:')){
      const a = document.createElement('a'); a.className = 'dosya';
      // her zaman indirilir, tarayıcıda açılmaz
      a.href = 'data:application/octet-stream;base64,' + (m.dosya.veri.split(',')[1] || '');
      a.download = String(m.dosya.ad || 'dosya').slice(0,120);
      const ik = document.createElement('span'); ik.textContent = '📄';
      const ad = document.createElement('span'); ad.textContent = a.download;
      const bo = document.createElement('small'); bo.textContent = boyutYaz(m.dosya.boyut);
      a.append(ik, ad, bo); d.appendChild(a);
    }
    if (m.text) d.appendChild(document.createTextNode(m.text));
    const s = document.createElement('span'); s.className = 'saat'; s.textContent = saat(t); d.appendChild(s);
    kutu.appendChild(d);
    sonYazan = m.nick; sonYazanBen = benimMi;
    if (!benimMi && document.hidden){ okunmamis++; document.title = '(' + okunmamis + ') ' + baslik; }
    if (benimMi){ asagi(); return; }
  }
  if (asg) asagi(); else $('yeniBtn').style.display = 'block';
}
let sonYazanBen = false;
document.addEventListener('visibilitychange', () => { if (!document.hidden){ okunmamis = 0; document.title = baslik; } });

/* ---------- saat başı temizlik ---------- */
const SAAT = 3600000;
let mesajKapat = null, aktifSaat = 0;
function saatBasi(){ const t = simdi(); return t - t % SAAT; }   // Türkiye UTC+3: saat başları UTC ile aynı

function mesajDinle(){
  if (mesajKapat) mesajKapat();
  aktifSaat = saatBasi();
  kutu.innerHTML = ''; sonYazan = null; sonGun = null; $('yeniBtn').style.display = 'none';
  const q = R('mesajlar').orderByChild('ts').startAt(aktifSaat).limitToLast(GECMIS);
  const ekle = s => mesajEkle(s.val());
  q.on('child_added', ekle, e => yerelSistem(izinHatasi(e)));
  mesajKapat = () => { q.off('child_added', ekle); mesajKapat = null; };
  eskileriSil();
}
function eskileriSil(){
  // önceki saatlerden kalan mesajları veritabanından siler (odada kim varsa o yapar)
  R('mesajlar').orderByChild('ts').endAt(aktifSaat - 1).limitToFirst(500).once('value').then(s => {
    const u = {}; s.forEach(c => { u[c.key] = null; });
    if (Object.keys(u).length) return R('mesajlar').update(u);
  }).catch(() => {});
}
function sayacGuncelle(){
  if (!ben) return;
  const kalan = SAAT - simdi() % SAAT;
  $('sayac').textContent = '🧹 ' + Math.ceil(kalan / 60000) + ' dk';
  if (saatBasi() !== aktifSaat){
    mesajDinle();
    yerelSistem('Saat başı: sohbet temizlendi 🧹');
  }
}
setInterval(sayacGuncelle, 1000);

function dinle(){
  mesajDinle();
  sayacGuncelle();
  kapat.push(() => { if (mesajKapat) mesajKapat(); });

  const ak = R('aktif');
  const listele = s => {
    const v = s.val() || {};
    const adlar = Object.values(v).map(x => x && x.nick).filter(Boolean).sort((a,b) => a.localeCompare(b,'tr'));
    $('sayi').textContent = adlar.length; $('sayi2').textContent = adlar.length;
    const ul = $('liste'); ul.innerHTML = '';
    adlar.forEach(n => {
      const li = document.createElement('li');
      const nk = document.createElement('span'); nk.className = 'nokta ok';
      const ad = document.createElement('span'); ad.textContent = n + (n === ben ? ' (sen)' : ''); ad.style.color = renk(n);
      li.append(nk, ad); ul.appendChild(li);
    });
  };
  ak.on('value', listele);
  kapat.push(() => ak.off('value', listele));

  const yz = R('yaziyor');
  const yazanlar = s => {
    const v = s.val() || {}; const t = simdi();
    const adlar = Object.values(v).filter(x => x && x.nick !== ben && t - (x.ts||0) < 8000).map(x => x.nick);
    $('yaziyor').textContent = adlar.length === 0 ? '' :
      adlar.length === 1 ? adlar[0] + ' yazıyor…' :
      adlar.length <= 3 ? adlar.join(', ') + ' yazıyor…' : 'Birkaç kişi yazıyor…';
  };
  yz.on('value', yazanlar);
  kapat.push(() => yz.off('value', yazanlar));
}

/* ---------- yazma ---------- */
const metinIn = $('metin');
let yaziyorZaman = 0, yaziyorTimer = null;
function yaziyorBitir(){
  clearTimeout(yaziyorTimer); yaziyorZaman = 0;
  if (anahtar) R('yaziyor/' + anahtar).remove().catch(()=>{});
}
metinIn.addEventListener('input', () => {
  if (!anahtar) return;
  if (!metinIn.value){ yaziyorBitir(); return; }
  const t = Date.now();
  if (t - yaziyorZaman > 3000){
    yaziyorZaman = t;
    const r = R('yaziyor/' + anahtar);
    r.set({ nick: ben, ts: TS }).catch(()=>{}); r.onDisconnect().remove();
  }
  clearTimeout(yaziyorTimer); yaziyorTimer = setTimeout(yaziyorBitir, 5000);
});

let sonGonderim = [];
function hizKontrol(){
  const t = Date.now(); sonGonderim = sonGonderim.filter(x => t - x < 10000);
  if (sonGonderim.length >= 8){ yerelSistem('Biraz yavaş 🙂 Birkaç saniye bekle.'); return false; }
  sonGonderim.push(t); return true;
}

/* ---------- fotoğraf ve dosya ---------- */
const DOSYA_MAX = 1024 * 1024;      // fotoğraf dışı dosyalar: en fazla 1 MB
const FOTO_HEDEF = 400 * 1024;      // fotoğraflar bu boyutun altına küçültülür
function boyutYaz(b){
  if (typeof b !== 'number') return '';
  return b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b/1024) + ' KB' : (b/1048576).toFixed(1).replace('.', ',') + ' MB';
}
function dataUrlBoyut(u){ return Math.floor(((u.split(',')[1] || '').length) * 3 / 4); }
function resimAc(file){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Bu fotoğraf açılamadı')); };
    im.src = u;
  });
}
async function fotoKucult(file){
  const im = await resimAc(file);
  let kenar = 1600, kalite = 0.82, url = '';
  for (let i = 0; i < 7; i++){
    const o = Math.min(1, kenar / Math.max(im.naturalWidth, im.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.naturalWidth * o)); c.height = Math.max(1, Math.round(im.naturalHeight * o));
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.drawImage(im, 0, 0, c.width, c.height);
    url = c.toDataURL('image/jpeg', kalite);
    if (dataUrlBoyut(url) <= FOTO_HEDEF) break;
    kenar = Math.round(kenar * 0.8); kalite = Math.max(0.6, kalite - 0.06);
  }
  return url;
}
function dosyaOku(file){
  return new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = () => rej(f.error); f.readAsDataURL(file); });
}
let gonderiliyor = false;
async function ekGonder(file){
  if (!ben || !file) return;
  if (!hizKontrol()) return;
  const foto = /^image\//.test(file.type) && !/svg/.test(file.type);
  if (!foto && file.size > DOSYA_MAX){
    yerelSistem('“' + file.name + '” çok büyük (' + boyutYaz(file.size) + '). Dosyalar en fazla 1 MB olabilir; fotoğraflarda sınır yok, otomatik küçültülür.');
    return;
  }
  const aciklama = metinIn.value.trim().slice(0, 500);
  gonderiliyor = true; $('ekBtn').disabled = true; $('ekBtn').textContent = '⏳';
  try{
    const msg = { nick: ben, cid: CID, text: aciklama, ts: TS };
    if (foto) msg.img = await fotoKucult(file);
    else msg.dosya = { ad: (file.name || 'dosya').slice(0, 120), boyut: file.size, veri: await dosyaOku(file) };
    metinIn.value = ''; yaziyorBitir();
    await R('mesajlar').push(msg);
  }catch(err){
    yerelSistem(err && err.code ? izinHatasi(err) : 'Gönderilemedi: ' + ((err && err.message) || err));
  }finally{
    gonderiliyor = false; $('ekBtn').disabled = false; $('ekBtn').textContent = '📎';
  }
}
async function ekleriGonder(liste){
  const fs = [...(liste || [])];
  if (fs.length > 5) yerelSistem('Tek seferde en fazla 5 dosya gönderilir; ilk 5 tanesi gidiyor.');
  for (const f of fs.slice(0, 5)) await ekGonder(f);
}
$('ekBtn').addEventListener('click', () => { if (!gonderiliyor) $('dosyaIn').click(); });
$('dosyaIn').addEventListener('change', e => { const l = [...e.target.files]; e.target.value = ''; ekleriGonder(l); });
document.addEventListener('paste', e => {
  if (!ben || gonderiliyor) return;
  const l = e.clipboardData && e.clipboardData.files;
  if (l && l.length){ e.preventDefault(); ekleriGonder(l); }
});
const odaEl = $('oda');
odaEl.addEventListener('dragover', e => { if (!ben) return; e.preventDefault(); odaEl.classList.add('surukle'); });
odaEl.addEventListener('dragleave', e => { if (!odaEl.contains(e.relatedTarget)) odaEl.classList.remove('surukle'); });
odaEl.addEventListener('drop', e => {
  e.preventDefault(); odaEl.classList.remove('surukle');
  if (ben && !gonderiliyor && e.dataTransfer) ekleriGonder(e.dataTransfer.files);
});
function buyut(src){ $('buyukImg').src = src; $('buyuk').classList.add('acik'); }
function kucult(){ $('buyuk').classList.remove('acik'); $('buyukImg').removeAttribute('src'); }
$('buyuk').addEventListener('click', kucult);
document.addEventListener('keydown', e => { if (e.key === 'Escape') kucult(); });

$('yaz').addEventListener('submit', async e => {
  e.preventDefault();
  const metin = metinIn.value.trim();
  if (!metin || !ben) return;
  if (!hizKontrol()) return;
  metinIn.value = ''; yaziyorBitir();
  try{ await R('mesajlar').push({ nick: ben, cid: CID, text: metin.slice(0,500), ts: TS }); }
  catch(err){ metinIn.value = metin; yerelSistem(izinHatasi(err)); }
});

$('kisiBtn').addEventListener('click', ev => { ev.stopPropagation(); $('kisiler').classList.toggle('acik'); });
document.addEventListener('click', ev => { if (!ev.target.closest('aside')) $('kisiler').classList.remove('acik'); });
})();
